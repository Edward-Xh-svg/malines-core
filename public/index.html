<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Malines Intelligence | المركز الرئيسي</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;900&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root { --bg: #050505; --red: #7f1d1d; }
        body { 
            background: var(--bg); 
            color: #d4d4d4; 
            font-family: 'Cairo', sans-serif; 
            height: 100vh; 
            overflow: hidden; 
            display: flex; 
            align-items: center; 
            justify-content: center;
        }
        
        .glitch-wrapper {
            text-align: center;
            position: relative;
        }

        .main-title {
            font-size: 4rem;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: -0.05em;
            color: white;
            line-height: 1;
            margin-bottom: 2rem;
        }

        .scanline {
            width: 100%;
            height: 2px;
            background: rgba(127, 29, 29, 0.2);
            position: absolute;
            top: 0;
            animation: scan 4s linear infinite;
        }

        @keyframes scan {
            0% { top: 0; }
            100% { top: 100%; }
        }

        .btn-access {
            display: inline-block;
            padding: 1rem 3rem;
            border: 1px solid var(--red);
            color: white;
            text-decoration: none;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 0.2em;
            font-size: 0.8rem;
            transition: all 0.3s;
            position: relative;
            background: rgba(127, 29, 29, 0.05);
        }

        .btn-access:hover {
            background: var(--red);
            box-shadow: 0 0 20px var(--red);
        }

        .terminal-status {
            margin-top: 2rem;
            font-family: monospace;
            font-size: 0.7rem;
            color: #444;
            text-transform: uppercase;
        }
    </style>
</head>
<body>

    <div class="scanline"></div>

    <div class="glitch-wrapper px-6">
        <p class="text-red-700 font-bold tracking-[0.5em] mb-4 text-xs uppercase">System Status: Online</p>
        <h1 class="main-title md:text-8xl">MALINES<br><span class="text-neutral-800">DATABASE</span></h1>
        
        <div class="mt-10">
            <a href="wiki.html" class="btn-access">
                دخول الأرشيف المركزي
            </a>
        </div>

        <div class="terminal-status">
            <p>Connection: Encrypted</p>
            <p>Location: Classified</p>
        </div>
    </div>

</body>
</html>
