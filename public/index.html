<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مجتمع مالينز | المنصة الرئيسية</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        malines: {
                            black: '#0a0a0a',
                            dark: '#111111',
                            card: '#161616',
                            border: '#2a2a2a',
                            text: '#e0e0e0',
                            muted: '#888888',
                            red: '#c0392b',
                            'red-hover': '#e74c3c',
                            accent: '#d4af37',
                        }
                    },
                    fontFamily: {
                        cairo: ['Cairo', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        :root {
            --black: #0a0a0a;
            --dark: #111111;
            --card: #161616;
            --border: #2a2a2a;
            --text: #e0e0e0;
            --muted: #888888;
            --red: #c0392b;
            --red-hover: #e74c3c;
            --accent: #d4af37;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: var(--black);
            color: var(--text);
            font-family: 'Cairo', sans-serif;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }

        /* ========== الشريط العلوي ========== */
        .topbar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 60px;
            background: rgba(10,10,10,0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(255,255,255,0.06);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 28px;
            z-index: 100;
        }

        .topbar-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .topbar-logo {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            object-fit: cover;
        }

        .topbar-title {
            font-weight: 700;
            font-size: 1.1rem;
            color: #fff;
            letter-spacing: 0.3px;
        }

        .topbar-right {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .btn-login {
            display: flex;
            align-items: center;
            gap: 7px;
            background: transparent;
            border: 1px solid rgba(255,255,255,0.2);
            color: #ccc;
            padding: 7px 18px;
            border-radius: 50px;
            cursor: pointer;
            font-size: 0.85rem;
            font-family: 'Cairo', sans-serif;
            transition: all 0.3s ease;
            white-space: nowrap;
        }

        .btn-login:hover {
            border-color: #fff;
            color: #fff;
            background: rgba(255,255,255,0.05);
        }

        .user-badge {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: #fff;
            color: #000;
            font-weight: 700;
            font-size: 1.1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            border: 2px solid rgba(255,255,255,0.3);
            transition: all 0.3s ease;
            position: relative;
        }

        .user-badge:hover {
            transform: scale(1.06);
            box-shadow: 0 0 25px rgba(255,255,255,0.15);
        }

        .user-dropdown {
            position: absolute;
            top: 48px;
            left: 0;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 6px 0;
            min-width: 170px;
            opacity: 0;
            visibility: hidden;
            transform: translateY(-6px);
            transition: all 0.25s ease;
            z-index: 10;
        }

        .user-dropdown.show {
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
        }

        .user-dropdown .dropdown-name {
            padding: 8px 16px;
            color: var(--muted);
            font-size: 0.8rem;
            border-bottom: 1px solid var(--border);
            margin-bottom: 4px;
        }

        .user-dropdown button {
            display: block;
            width: 100%;
            text-align: right;
            padding: 9px 16px;
            background: none;
            border: none;
            color: #ccc;
            cursor: pointer;
            font-family: 'Cairo', sans-serif;
            font-size: 0.9rem;
            transition: all 0.2s;
        }

        .user-dropdown button:hover {
            background: rgba(255,255,255,0.04);
            color: #fff;
        }

        /* ========== Hero Section ========== */
        .hero {
            position: relative;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 100px 24px 80px;
            overflow: hidden;
        }

        .hero-bg {
            position: absolute;
            inset: 0;
            z-index: 0;
        }

        .hero-bg img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0.35;
            filter: brightness(0.6) contrast(1.1);
        }

        .hero-bg::after {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(ellipse at center, transparent 30%, var(--black) 80%);
        }

        /* حلقات ضبابية مثل Grok */
        .hero-rings {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 1;
            pointer-events: none;
        }

        .ring {
            position: absolute;
            border-radius: 50%;
            border: 1px solid rgba(255,255,255,0.06);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        .ring-1 {
            width: 280px;
            height: 280px;
            animation: ringPulse 4s ease-in-out infinite;
        }

        .ring-2 {
            width: 380px;
            height: 380px;
            border-color: rgba(255,255,255,0.04);
            animation: ringPulse 4s ease-in-out 0.5s infinite;
        }

        .ring-3 {
            width: 500px;
            height: 500px;
            border-color: rgba(255,255,255,0.02);
            animation: ringPulse 4s ease-in-out 1s infinite;
        }

        @keyframes ringPulse {
            0%, 100% { opacity: 0.4; transform: translate(-50%, -50%) scale(0.95); }
            50% { opacity: 1; transform: translate(-50%, -50%) scale(1.02); }
        }

        /* شعار Malines */
        .hero-logo-container {
            position: relative;
            z-index: 2;
            margin-bottom: 24px;
        }

        .hero-logo {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            object-fit: cover;
            position: relative;
            z-index: 3;
            box-shadow: 0 0 80px rgba(192,57,43,0.25), 0 0 150px rgba(192,57,43,0.1);
        }

        .hero-content {
            position: relative;
            z-index: 2;
        }

        .hero-title {
            font-size: clamp(2rem, 5vw, 3.2rem);
            font-weight: 900;
            color: #fff;
            letter-spacing: -1px;
            margin-bottom: 12px;
            line-height: 1.2;
        }

        .hero-subtitle {
            font-size: clamp(0.95rem, 2vw, 1.15rem);
            color: var(--muted);
            font-weight: 400;
            letter-spacing: 1px;
            margin-bottom: 32px;
        }

        .hero-scroll {
            position: absolute;
            bottom: 30px;
            z-index: 2;
            animation: bounceDown 2s ease infinite;
            color: var(--muted);
            cursor: pointer;
        }

        @keyframes bounceDown {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(8px); }
        }

        /* ========== قسم الخدمات ========== */
        .services {
            position: relative;
            z-index: 2;
            padding: 60px 24px 100px;
            max-width: 1100px;
            margin: 0 auto;
        }

        .services-title {
            text-align: center;
            font-size: clamp(1.5rem, 3vw, 2rem);
            font-weight: 700;
            color: #fff;
            margin-bottom: 8px;
        }

        .services-subtitle {
            text-align: center;
            color: var(--muted);
            font-size: 0.95rem;
            margin-bottom: 40px;
        }

        .services-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
        }

        .service-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 28px 24px;
            transition: all 0.3s ease;
            cursor: pointer;
            text-decoration: none;
            color: inherit;
            display: block;
            position: relative;
            overflow: hidden;
        }

        .service-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 4px;
            height: 100%;
            background: var(--red);
            border-radius: 0 4px 4px 0;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .service-card:hover {
            border-color: rgba(255,255,255,0.15);
            background: #1a1a1a;
            transform: translateY(-2px);
            box-shadow: 0 12px 40px rgba(0,0,0,0.4);
        }

        .service-card:hover::before {
            opacity: 1;
        }

        .service-icon {
            width: 48px;
            height: 48px;
            background: rgba(192,57,43,0.1);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 16px;
            color: var(--red);
        }

        .service-name {
            font-size: 1.2rem;
            font-weight: 700;
            color: #fff;
            margin-bottom: 6px;
        }

        .service-desc {
            font-size: 0.9rem;
            color: var(--muted);
            line-height: 1.6;
        }

        /* ========== مودال تسجيل الدخول ========== */
        .modal-backdrop {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 200;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
            padding: 20px;
        }

        .modal-backdrop.active {
            opacity: 1;
            visibility: visible;
        }

        .modal-box {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 32px 28px;
            width: 100%;
            max-width: 420px;
            position: relative;
            text-align: right;
            transform: translateY(10px);
            transition: transform 0.3s ease;
        }

        .modal-backdrop.active .modal-box {
            transform: translateY(0);
        }

        .modal-box h2 {
            font-size: 1.4rem;
            margin-bottom: 24px;
            color: #fff;
            font-weight: 700;
        }

        .modal-close {
            position: absolute;
            top: 16px;
            left: 16px;
            background: none;
            border: none;
            color: #888;
            font-size: 1.3rem;
            cursor: pointer;
            padding: 6px;
            transition: color 0.2s;
        }

        .modal-close:hover { color: #fff; }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            margin-bottom: 6px;
            color: #aaa;
            font-size: 0.9rem;
            font-weight: 500;
        }

        .form-group input {
            width: 100%;
            padding: 12px 14px;
            background: #1e1e1e;
            border: 1px solid var(--border);
            border-radius: 10px;
            color: #fff;
            font-family: 'Cairo', sans-serif;
            font-size: 0.95rem;
            transition: border-color 0.3s;
        }

        .form-group input:focus {
            outline: none;
            border-color: #fff;
        }

        .form-error {
            color: var(--red-hover);
            font-size: 0.85rem;
            margin-bottom: 16px;
            display: none;
            align-items: center;
            gap: 6px;
        }

        .form-error.show { display: flex; }

        .btn-submit {
            width: 100%;
            padding: 13px;
            background: #fff;
            border: none;
            color: #000;
            font-weight: 700;
            font-size: 1rem;
            border-radius: 10px;
            cursor: pointer;
            font-family: 'Cairo', sans-serif;
            transition: all 0.3s ease;
            margin-top: 8px;
        }

        .btn-submit:hover {
            background: #e0e0e0;
        }

        .btn-submit:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* ========== تذييل ========== */
        .footer {
            text-align: center;
            padding: 30px;
            color: #444;
            font-size: 0.75rem;
            border-top: 1px solid rgba(255,255,255,0.04);
        }

        /* ========== تحسينات الجوال ========== */
        @media (max-width: 640px) {
            .topbar { padding: 0 16px; height: 54px; }
            .topbar-title { font-size: 1rem; }
            .btn-login span { display: none; }
            .btn-login { padding: 7px 12px; }
            .hero { padding: 80px 16px 60px; }
            .hero-logo { width: 75px; height: 75px; }
            .ring-1 { width: 180px; height: 180px; }
            .ring-2 { width: 260px; height: 260px; }
            .ring-3 { width: 350px; height: 350px; }
            .services { padding: 40px 16px 60px; }
            .modal-box { padding: 24px 18px; }
        }
    </style>
</head>
<body>

    <!-- ==================== الشريط العلوي ==================== -->
    <header class="topbar">
        <div class="topbar-left">
            <img src="malines-icon.png" alt="Malines" class="topbar-logo" onerror="this.style.display='none'">
            <span class="topbar-title">مجتمع مالينز</span>
        </div>
        <div class="topbar-right">
            <!-- زر تسجيل الدخول -->
            <button id="btnLogin" class="btn-login" onclick="openModal()">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4M10 17l5-5-5-5M13.8 12H3"/></svg>
                <span>تسجيل الدخول</span>
            </button>

            <!-- أيقونة المستخدم -->
            <div id="userBadge" class="user-badge" style="display: none;" onclick="toggleDropdown()">
                <span id="userInitial"></span>
                <div id="userDropdown" class="user-dropdown">
                    <div class="dropdown-name" id="dropdownUsername"></div>
                    <button onclick="handleLogout()">تسجيل الخروج</button>
                </div>
            </div>
        </div>
    </header>

    <!-- ==================== Hero Section ==================== -->
    <section class="hero" id="hero">
        <div class="hero-bg">
            <img src="malines-excon.png" alt="Malines Background" onerror="this.style.display='none'">
        </div>

        <!-- حلقات ضبابية -->
        <div class="hero-rings">
            <div class="ring ring-1"></div>
            <div class="ring ring-2"></div>
            <div class="ring ring-3"></div>
        </div>

        <!-- الشعار -->
        <div class="hero-logo-container">
            <img src="malines-icon.png" alt="Malines" class="hero-logo" onerror="this.style.display='none'">
        </div>

        <div class="hero-content">
            <h1 class="hero-title">مرحباً بك في مجتمع مالينز</h1>
            <p class="hero-subtitle">المنصة المتكاملة للتوثيق والأرشيف والمجتمع</p>
        </div>

        <!-- سهم التمرير -->
        <div class="hero-scroll" onclick="document.getElementById('services').scrollIntoView({behavior:'smooth'})">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><polyline points="6 9 12 15 18 9"/></svg>
        </div>
    </section>

    <!-- ==================== قسم الخدمات ==================== -->
    <section class="services" id="services">
        <h2 class="services-title">الخدمات</h2>
        <p class="services-subtitle">اكتشف ما تقدمه منصة مجتمع مالينز</p>

        <div class="services-grid">
            <!-- خدمة الأرشيف (الويكي) -->
            <a href="wiki.html" class="service-card">
                <div class="service-icon">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
                </div>
                <div class="service-name">أرشيف مالينز المركزي</div>
                <div class="service-desc">الموسوعة الحرة للوثائق والمخطوطات. تصفح المعاهدات، الحروب، والعمليات التاريخية المؤرشفة.</div>
            </a>
        </div>
    </section>

    <!-- ==================== تذييل ==================== -->
    <footer class="footer">
        مجتمع مالينز &copy; 2026 &middot; جميع الحقوق محفوظة
    </footer>

    <!-- ==================== مودال تسجيل الدخول ==================== -->
    <div id="loginModal" class="modal-backdrop">
        <div class="modal-box">
            <button class="modal-close" onclick="closeModal()">✕</button>
            <h2>تسجيل الدخول</h2>
            <div class="form-group">
                <label for="emailInput">البريد الإلكتروني</label>
                <input type="email" id="emailInput" placeholder="example@malines.com" dir="ltr" autocomplete="email">
            </div>
            <div class="form-group">
                <label for="passInput">كلمة المرور</label>
                <input type="password" id="passInput" placeholder="••••••••" autocomplete="current-password">
            </div>
            <div id="loginError" class="form-error">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>
                <span></span>
            </div>
            <button id="btnSubmit" class="btn-submit" onclick="doLogin()">دخول</button>
        </div>
    </div>

    <script>
        // ============ المتغيرات ============
        const STORAGE_KEY = 'malines_user';
        let dropdownVisible = false;

        const btnLogin = document.getElementById('btnLogin');
        const userBadge = document.getElementById('userBadge');
        const userInitial = document.getElementById('userInitial');
        const userDropdown = document.getElementById('userDropdown');
        const dropdownUsername = document.getElementById('dropdownUsername');
        const loginModal = document.getElementById('loginModal');
        const loginError = document.getElementById('loginError');
        const btnSubmit = document.getElementById('btnSubmit');

        // ============ المودال ============
        function openModal() {
            loginModal.classList.add('active');
            document.getElementById('emailInput').focus();
            loginError.classList.remove('show');
            document.getElementById('emailInput').value = '';
            document.getElementById('passInput').value = '';
        }

        function closeModal() {
            loginModal.classList.remove('active');
        }

        loginModal.addEventListener('click', function(e) {
            if (e.target === loginModal) closeModal();
        });

        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') closeModal();
        });

        // ============ تسجيل الدخول ============
        async function doLogin() {
            const email = document.getElementById('emailInput').value.trim();
            const password = document.getElementById('passInput').value;

            loginError.classList.remove('show');

            if (!email) { showError('يرجى إدخال البريد الإلكتروني'); return; }
            if (!password) { showError('يرجى إدخال كلمة المرور'); return; }

            btnSubmit.disabled = true;
            btnSubmit.textContent = 'جارٍ التحقق...';

            try {
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                const data = await response.json();

                if (response.ok && data.success) {
                    setLoggedInUser(data.username);
                    closeModal();
                } else {
                    showError(data.error || 'فشل تسجيل الدخول');
                }
            } catch (err) {
                showError('تعذر الاتصال بالخادم');
            } finally {
                btnSubmit.disabled = false;
                btnSubmit.textContent = 'دخول';
            }
        }

        function showError(msg) {
            loginError.querySelector('span').textContent = msg;
            loginError.classList.add('show');
        }

        // ============ المستخدم ============
        function setLoggedInUser(username) {
            localStorage.setItem(STORAGE_KEY, JSON.stringify({ username }));
            updateUI(username);
        }

        function updateUI(username) {
            btnLogin.style.display = 'none';
            userBadge.style.display = 'flex';
            userInitial.textContent = username.charAt(0).toUpperCase();
            dropdownUsername.textContent = username;
        }

        function clearUser() {
            localStorage.removeItem(STORAGE_KEY);
            btnLogin.style.display = 'flex';
            userBadge.style.display = 'none';
            userDropdown.classList.remove('show');
            dropdownVisible = false;
        }

        function handleLogout() {
            clearUser();
        }

        function toggleDropdown() {
            dropdownVisible = !dropdownVisible;
            userDropdown.classList.toggle('show', dropdownVisible);
        }

        document.addEventListener('click', function(e) {
            if (!userBadge.contains(e.target)) {
                userDropdown.classList.remove('show');
                dropdownVisible = false;
            }
        });

        // ============ التهيئة ============
        (function init() {
            const stored = localStorage.getItem(STORAGE_KEY);
            if (stored) {
                try {
                    const user = JSON.parse(stored);
                    if (user.username) updateUI(user.username);
                } catch (e) { clearUser(); }
            }
        })();
    </script>
</body>
</html>
