<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>أرشيف مالينز | الصفحة الرئيسية</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --bg: #0d0d0d;
            --surface: #121212;
            --border: #2a2a2a;
            --accent: #b8860b;
            --text: #d0d0d0;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Cairo', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            position: relative;
            overflow-x: hidden;
        }
        /* زخرفة خلفية بشكل دوائر متقاطعة */
        body::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -50%;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 30% 40%, rgba(184,134,11,0.05) 0%, transparent 50%);
            pointer-events: none;
        }
        .container {
            width: 100%;
            max-width: 700px;
            text-align: center;
            z-index: 2;
        }
        .logo {
            font-family: 'Amiri', serif;
            font-size: 3.5rem;
            font-weight: 700;
            color: #fff;
            letter-spacing: -1px;
            margin-bottom: 1rem;
            line-height: 1.2;
        }
        .logo span {
            color: var(--accent);
        }
        .subtitle {
            font-size: 1.2rem;
            color: #999;
            margin-bottom: 2.5rem;
            font-weight: 300;
            letter-spacing: 2px;
        }
        .search-box {
            display: flex;
            gap: 10px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 50px;
            padding: 6px 6px 6px 20px;
            transition: 0.3s;
            margin-bottom: 2rem;
        }
        .search-box:focus-within {
            border-color: var(--accent);
            box-shadow: 0 0 15px rgba(184,134,11,0.15);
        }
        .search-box input {
            flex: 1;
            background: transparent;
            border: none;
            color: #fff;
            font-size: 1rem;
            font-family: 'Cairo', sans-serif;
            outline: none;
            padding: 10px 0;
        }
        .search-box button {
            background: var(--accent);
            border: none;
            color: #000;
            font-weight: bold;
            font-family: 'Cairo', sans-serif;
            border-radius: 40px;
            padding: 10px 30px;
            cursor: pointer;
            transition: 0.3s;
            white-space: nowrap;
        }
        .search-box button:hover {
            background: #d4a017;
        }
        .quick-links {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
            margin-bottom: 2rem;
            font-size: 0.9rem;
        }
        .quick-links a {
            color: #aaa;
            text-decoration: none;
            border-bottom: 1px solid transparent;
            transition: 0.2s;
            padding: 4px 8px;
        }
        .quick-links a:hover {
            color: #fff;
            border-bottom-color: var(--accent);
        }
        .archive-btn {
            display: inline-block;
            padding: 12px 40px;
            border: 1px solid var(--accent);
            color: #fff;
            text-decoration: none;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 3px;
            font-size: 0.8rem;
            border-radius: 4px;
            transition: all 0.4s;
            background: rgba(184,134,11,0.05);
            margin-top: 1rem;
        }
        .archive-btn:hover {
            background: var(--accent);
            color: #000;
            box-shadow: 0 0 20px var(--accent);
        }
        .footer-note {
            margin-top: 3rem;
            font-size: 0.7rem;
            color: #444;
            letter-spacing: 1px;
            text-transform: uppercase;
        }
        /* تأثير خط المسح الاختياري */
        .scanline {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 2px;
            background: rgba(184,134,11,0.08);
            pointer-events: none;
            animation: scan 6s linear infinite;
            z-index: 1;
        }
        @keyframes scan {
            0% { top: 0; }
            100% { top: 100%; }
        }
    </style>
</head>
<body>
    <div class="scanline"></div>

    <div class="container">
        <!-- شعار ويكيبيدي مُخصص -->
        <div class="logo">
            أرشيف <span>مالينز</span>
        </div>
        <div class="subtitle">الموسوعة الحرة للوثائق والمخطوطات</div>

        <!-- بحث سريع ينقلك إلى wiki.html مع استعلام -->
        <div class="search-box">
            <input 
                type="text" 
                id="searchInput" 
                placeholder="ابحث عن معاهدة، حرب، وثيقة..." 
                onkeypress="if(event.key==='Enter') goSearch()"
            />
            <button onclick="goSearch()">بحث</button>
        </div>

        <!-- روابط سريعة لبعض المقالات (يمكنك تعديلها) -->
        <div class="quick-links">
            <a href="wiki.html?id=11001">معاهدة جين ستي</a>
            <a href="wiki.html?id=11002">الحرب 1906 - 1907</a>
            <a href="wiki.html?id=11003">الحرب 1907 - 1908</a>
        </div>

        <!-- زر الدخول التقليدي -->
        <a href="wiki.html" class="archive-btn">دخول الأرشيف المركزي</a>

        <div class="footer-note">
            اتصال آمن • موقع سري • جميع الحقوق محفوظة
        </div>
    </div>

    <script>
        // دالة البحث: تنقلك إلى wiki.html مع وسيط بحث q
        function goSearch() {
            const query = document.getElementById('searchInput').value.trim();
            if (query) {
                window.location.href = `wiki.html?q=${encodeURIComponent(query)}`;
            } else {
                window.location.href = 'wiki.html';
            }
        }
    </script>
</body>
</html>
