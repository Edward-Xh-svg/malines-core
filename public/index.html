<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>أرشيف مالينز | الصفحة الرئيسية</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        bg: '#0d0d0d',
                        surface: '#121212',
                        border: '#2a2a2a',
                        accent: '#b8860b',
                        'accent-hover': '#d4a017',
                        text: '#d0d0d0',
                        'text-muted': '#888888',
                    },
                    fontFamily: {
                        cairo: ['Cairo', 'sans-serif'],
                        amiri: ['Amiri', 'serif'],
                    }
                }
            }
        }
    </script>
    <style>
        :root {
            --bg: #0d0d0d;
            --surface: #121212;
            --border: #2a2a2a;
            --accent: #b8860b;
            --accent-hover: #d4a017;
            --text: #d0d0d0;
            --text-muted: #888888;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Cairo', sans-serif;
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
        }

        /* خلفية زخرفية */
        .bg-glow {
            position: fixed;
            top: -50%;
            right: -50%;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 30% 40%, rgba(184,134,11,0.04) 0%, transparent 50%);
            pointer-events: none;
            z-index: 0;
        }

        .bg-glow2 {
            position: fixed;
            bottom: -30%;
            left: -30%;
            width: 60%;
            height: 60%;
            background: radial-gradient(circle at 70% 60%, rgba(184,134,11,0.03) 0%, transparent 50%);
            pointer-events: none;
            z-index: 0;
        }

        /* الشريط العلوي */
        .topbar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 60px;
            background: rgba(10,10,10,0.85);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border-bottom: 1px solid rgba(255,255,255,0.06);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 24px;
            z-index: 100;
        }

        .topbar-brand {
            font-weight: 700;
            font-size: 1.1rem;
            color: #fff;
            text-decoration: none;
            letter-spacing: 0.5px;
        }

        .topbar-actions {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        /* زر تسجيل الدخول */
        .btn-login {
            display: flex;
            align-items: center;
            gap: 8px;
            background: transparent;
            border: 1px solid rgba(255,255,255,0.15);
            color: #ccc;
            padding: 8px 18px;
            border-radius: 30px;
            cursor: pointer;
            font-size: 0.9rem;
            font-family: 'Cairo', sans-serif;
            transition: all 0.3s ease;
            white-space: nowrap;
        }

        .btn-login:hover {
            border-color: var(--accent);
            color: #fff;
            background: rgba(184,134,11,0.08);
        }

        .btn-login svg {
            flex-shrink: 0;
        }

        /* أيقونة المستخدم */
        .user-badge {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: var(--accent);
            color: #000;
            font-weight: 700;
            font-size: 1.2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            border: 2px solid rgba(255,255,255,0.2);
            transition: all 0.3s ease;
            position: relative;
        }

        .user-badge:hover {
            transform: scale(1.08);
            box-shadow: 0 0 20px rgba(184,134,11,0.3);
        }

        /* قائمة منسدلة للمستخدم */
        .user-dropdown {
            position: absolute;
            top: 50px;
            left: 0;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 8px 0;
            min-width: 160px;
            opacity: 0;
            visibility: hidden;
            transform: translateY(-5px);
            transition: all 0.25s ease;
        }

        .user-dropdown.show {
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
        }

        .user-dropdown button {
            display: block;
            width: 100%;
            text-align: right;
            padding: 10px 16px;
            background: none;
            border: none;
            color: #ccc;
            cursor: pointer;
            font-family: 'Cairo', sans-serif;
            font-size: 0.9rem;
            transition: background 0.2s;
        }

        .user-dropdown button:hover {
            background: rgba(255,255,255,0.04);
            color: #fff;
        }

        /* المحتوى المركزي */
        .main-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 80px 24px 40px;
            position: relative;
            z-index: 1;
        }

        .content-wrapper {
            width: 100%;
            max-width: 680px;
            text-align: center;
        }

        .logo {
            font-family: 'Amiri', serif;
            font-size: clamp(2.2rem, 5vw, 3.5rem);
            font-weight: 700;
            color: #ffffff;
            letter-spacing: -1px;
            margin-bottom: 0.4rem;
            line-height: 1.2;
        }

        .logo span { color: var(--accent); }

        .subtitle {
            font-size: clamp(0.85rem, 2vw, 1.1rem);
            color: var(--text-muted);
            margin-bottom: 2.2rem;
            font-weight: 300;
            letter-spacing: 3px;
            text-transform: uppercase;
        }

        /* مربع البحث */
        .search-wrapper {
            display: flex;
            gap: 10px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 50px;
            padding: 5px 5px 5px 18px;
            transition: all 0.3s ease;
            margin-bottom: 1.8rem;
        }

        .search-wrapper:focus-within {
            border-color: var(--accent);
            box-shadow: 0 0 20px rgba(184,134,11,0.1);
        }

        .search-wrapper input {
            flex: 1;
            background: transparent;
            border: none;
            color: #fff;
            font-size: 1rem;
            font-family: 'Cairo', sans-serif;
            outline: none;
            padding: 10px 0;
            min-width: 0;
        }

        .search-wrapper input::placeholder { color: #555; }

        .search-wrapper button {
            background: var(--accent);
            border: none;
            color: #000;
            font-weight: 700;
            font-family: 'Cairo', sans-serif;
            border-radius: 40px;
            padding: 10px 28px;
            cursor: pointer;
            transition: all 0.3s ease;
            white-space: nowrap;
            font-size: 0.95rem;
        }

        .search-wrapper button:hover {
            background: var(--accent-hover);
            box-shadow: 0 4px 15px rgba(184,134,11,0.3);
        }

        /* روابط سريعة */
        .quick-links {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
            margin-bottom: 2.2rem;
            font-size: 0.9rem;
        }

        .quick-links a {
            color: #777;
            text-decoration: none;
            border-bottom: 1px solid transparent;
            transition: all 0.25s ease;
            padding: 4px 8px;
        }

        .quick-links a:hover {
            color: #fff;
            border-bottom-color: var(--accent);
        }

        /* أزرار الأرشيف */
        .btn-archive {
            display: inline-block;
            padding: 14px 44px;
            border: 1px solid var(--accent);
            color: #fff;
            text-decoration: none;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 3px;
            font-size: 0.8rem;
            border-radius: 4px;
            transition: all 0.4s ease;
            background: rgba(184,134,11,0.05);
            margin: 6px;
        }

        .btn-archive:hover {
            background: var(--accent);
            color: #000;
            box-shadow: 0 0 25px rgba(184,134,11,0.25);
        }

        .footer-note {
            margin-top: 3.5rem;
            font-size: 0.65rem;
            color: #444;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        /* المودال */
        .modal-backdrop {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.75);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 200;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
            padding: 20px;
        }

        .modal-backdrop.active {
            opacity: 1;
            visibility: visible;
        }

        .modal-box {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 32px 28px;
            width: 100%;
            max-width: 420px;
            position: relative;
            text-align: right;
            transform: translateY(10px);
            transition: transform 0.3s ease;
        }

        .modal-backdrop.active .modal-box {
            transform: translateY(0);
        }

        .modal-box h2 {
            font-size: 1.4rem;
            margin-bottom: 24px;
            color: #fff;
            font-weight: 700;
        }

        .modal-close {
            position: absolute;
            top: 16px;
            left: 16px;
            background: none;
            border: none;
            color: #888;
            font-size: 1.3rem;
            cursor: pointer;
            padding: 6px;
            line-height: 1;
            transition: color 0.2s;
        }

        .modal-close:hover { color: #fff; }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            margin-bottom: 6px;
            color: #aaa;
            font-size: 0.9rem;
            font-weight: 500;
        }

        .form-group input {
            width: 100%;
            padding: 12px 14px;
            background: #1a1a1a;
            border: 1px solid var(--border);
            border-radius: 8px;
            color: #fff;
            font-family: 'Cairo', sans-serif;
            font-size: 0.95rem;
            transition: border-color 0.3s;
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--accent);
        }

        .form-group input::placeholder { color: #444; }

        .form-error {
            color: #e74c3c;
            font-size: 0.85rem;
            margin-bottom: 16px;
            display: none;
            align-items: center;
            gap: 6px;
        }

        .form-error.show {
            display: flex;
        }

        .btn-submit {
            width: 100%;
            padding: 13px;
            background: var(--accent);
            border: none;
            color: #000;
            font-weight: 700;
            font-size: 1rem;
            border-radius: 8px;
            cursor: pointer;
            font-family: 'Cairo', sans-serif;
            transition: all 0.3s ease;
            margin-top: 8px;
        }

        .btn-submit:hover {
            background: var(--accent-hover);
            box-shadow: 0 4px 18px rgba(184,134,11,0.25);
        }

        .btn-submit:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        /* تحسينات الجوال */
        @media (max-width: 640px) {
            .topbar {
                padding: 0 16px;
                height: 54px;
            }
            .topbar-brand { font-size: 1rem; }
            .btn-login { padding: 7px 14px; font-size: 0.8rem; gap: 5px; }
            .btn-login span { display: none; }
            .main-container { padding: 70px 16px 30px; }
            .search-wrapper { padding: 4px 4px 4px 14px; }
            .search-wrapper button { padding: 10px 20px; font-size: 0.85rem; }
            .quick-links { gap: 12px; font-size: 0.8rem; }
            .btn-archive { padding: 12px 30px; font-size: 0.7rem; letter-spacing: 2px; margin: 4px; }
            .modal-box { padding: 24px 18px; }
        }
    </style>
</head>
<body>

    <!-- خلفيات -->
    <div class="bg-glow"></div>
    <div class="bg-glow2"></div>

    <!-- الشريط العلوي -->
    <header class="topbar">
        <a href="/" class="topbar-brand">📦 أرشيف مالينز</a>
        <div class="topbar-actions">
            <!-- زر تسجيل الدخول -->
            <button id="btnLogin" class="btn-login" onclick="openModal()">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4M10 17l5-5-5-5M13.8 12H3"/></svg>
                <span>تسجيل الدخول</span>
            </button>

            <!-- أيقونة المستخدم -->
            <div id="userBadge" class="user-badge" style="display: none;" onclick="toggleDropdown()">
                <span id="userInitial"></span>
                <div id="userDropdown" class="user-dropdown">
                    <div style="padding: 8px 16px; color: #888; font-size: 0.8rem; border-bottom: 1px solid var(--border); margin-bottom: 4px;" id="dropdownUsername"></div>
                    <button onclick="handleLogout()">تسجيل الخروج</button>
                </div>
            </div>
        </div>
    </header>

    <!-- المحتوى الرئيسي -->
    <div class="main-container">
        <div class="content-wrapper">
            <div class="logo">أرشيف <span>مالينز</span></div>
            <div class="subtitle">الموسوعة الحرة للوثائق والمخطوطات</div>

            <div class="search-wrapper">
                <input type="text" id="searchInput" placeholder="ابحث عن معاهدة، حرب، وثيقة..." onkeypress="if(event.key==='Enter') doSearch()">
                <button onclick="doSearch()">بحث</button>
            </div>

            <div class="quick-links">
                <a href="wiki.html?id=11001">معاهدة جين ستي</a>
                <a href="wiki.html?id=11002">الحرب 1906 - 1907</a>
                <a href="wiki.html?id=11003">الحرب 1907 - 1908</a>
            </div>

            <a href="wiki.html" class="btn-archive">دخول الأرشيف المركزي</a>
            <a href="chat.html" class="btn-archive" style="border-color:#c49b3f;">المستشار الاقتصادي</a>

            <div class="footer-note">اتصال آمن &middot; موقع سري &middot; جميع الحقوق محفوظة</div>
        </div>
    </div>

    <!-- مودال تسجيل الدخول -->
    <div id="loginModal" class="modal-backdrop">
        <div class="modal-box">
            <button class="modal-close" onclick="closeModal()">✕</button>
            <h2>تسجيل الدخول</h2>
            <div class="form-group">
                <label for="emailInput">البريد الإلكتروني</label>
                <input type="email" id="emailInput" placeholder="example@malines.com" dir="ltr" autocomplete="email">
            </div>
            <div class="form-group">
                <label for="passInput">كلمة المرور</label>
                <input type="password" id="passInput" placeholder="••••••••" autocomplete="current-password">
            </div>
            <div id="loginError" class="form-error">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>
                <span></span>
            </div>
            <button id="btnSubmit" class="btn-submit" onclick="doLogin()">دخول</button>
        </div>
    </div>

    <script>
        // ============ المتغيرات ============
        const STORAGE_KEY = 'malines_user';
        let dropdownVisible = false;

        // ============ عناصر DOM ============
        const btnLogin = document.getElementById('btnLogin');
        const userBadge = document.getElementById('userBadge');
        const userInitial = document.getElementById('userInitial');
        const userDropdown = document.getElementById('userDropdown');
        const dropdownUsername = document.getElementById('dropdownUsername');
        const loginModal = document.getElementById('loginModal');
        const loginError = document.getElementById('loginError');
        const btnSubmit = document.getElementById('btnSubmit');

        // ============ دوال المودال ============
        function openModal() {
            loginModal.classList.add('active');
            document.getElementById('emailInput').focus();
            loginError.classList.remove('show');
            document.getElementById('emailInput').value = '';
            document.getElementById('passInput').value = '';
        }

        function closeModal() {
            loginModal.classList.remove('active');
        }

        // إغلاق المودال عند النقر على الخلفية
        loginModal.addEventListener('click', function(e) {
            if (e.target === loginModal) closeModal();
        });

        // إغلاق المودال عند Escape
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') closeModal();
        });

        // ============ دوال تسجيل الدخول ============
        async function doLogin() {
            const email = document.getElementById('emailInput').value.trim();
            const password = document.getElementById('passInput').value;

            // إخفاء الخطأ السابق
            loginError.classList.remove('show');

            // تحقق من المدخلات
            if (!email) {
                showError('يرجى إدخال البريد الإلكتروني');
                return;
            }
            if (!password) {
                showError('يرجى إدخال كلمة المرور');
                return;
            }

            // تعطيل الزر أثناء الطلب
            btnSubmit.disabled = true;
            btnSubmit.textContent = 'جارٍ التحقق...';

            try {
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                const data = await response.json();

                if (response.ok && data.success) {
                    // تسجيل دخول ناجح
                    setLoggedInUser(data.username);
                    closeModal();
                } else {
                    showError(data.error || 'فشل تسجيل الدخول');
                }
            } catch (err) {
                showError('تعذر الاتصال بالخادم. حاول مرة أخرى.');
            } finally {
                btnSubmit.disabled = false;
                btnSubmit.textContent = 'دخول';
            }
        }

        function showError(msg) {
            loginError.querySelector('span').textContent = msg;
            loginError.classList.add('show');
        }

        // ============ دوال المستخدم ============
        function setLoggedInUser(username) {
            localStorage.setItem(STORAGE_KEY, JSON.stringify({ username }));
            updateUI(username);
        }

        function updateUI(username) {
            btnLogin.style.display = 'none';
            userBadge.style.display = 'flex';
            userInitial.textContent = username.charAt(0).toUpperCase();
            dropdownUsername.textContent = username;
        }

        function clearUser() {
            localStorage.removeItem(STORAGE_KEY);
            btnLogin.style.display = 'flex';
            userBadge.style.display = 'none';
            userDropdown.classList.remove('show');
            dropdownVisible = false;
        }

        function handleLogout() {
            clearUser();
        }

        function toggleDropdown() {
            dropdownVisible = !dropdownVisible;
            if (dropdownVisible) {
                userDropdown.classList.add('show');
            } else {
                userDropdown.classList.remove('show');
            }
        }

        // إغلاق القائمة عند النقر خارجها
        document.addEventListener('click', function(e) {
            if (!userBadge.contains(e.target)) {
                userDropdown.classList.remove('show');
                dropdownVisible = false;
            }
        });

        // ============ دالة البحث ============
        function doSearch() {
            const query = document.getElementById('searchInput').value.trim();
            if (query) {
                window.location.href = `wiki.html?q=${encodeURIComponent(query)}`;
            } else {
                window.location.href = 'wiki.html';
            }
        }

        // ============ التهيئة عند التحميل ============
        (function init() {
            const stored = localStorage.getItem(STORAGE_KEY);
            if (stored) {
                try {
                    const user = JSON.parse(stored);
                    if (user.username) {
                        updateUI(user.username);
                    }
                } catch (e) {
                    clearUser();
                }
            }
        })();
    </script>
</body>
</html>
