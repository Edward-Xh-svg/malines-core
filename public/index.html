<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>أرشيف مالينز | الصفحة الرئيسية</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        bg: '#0d0d0d',
                        surface: '#121212',
                        border: '#2a2a2a',
                        accent: '#b8860b',
                        'accent-hover': '#d4a017',
                        text: '#d0d0d0',
                        'text-muted': '#888888',
                    },
                    fontFamily: {
                        cairo: ['Cairo', 'sans-serif'],
                        amiri: ['Amiri', 'serif'],
                    }
                }
            }
        }
    </script>
    <style>
        :root {
            --bg: #0d0d0d;
            --surface: #121212;
            --border: #2a2a2a;
            --accent: #b8860b;
            --accent-hover: #d4a017;
            --text: #d0d0d0;
            --text-muted: #888888;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Cairo', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            position: relative;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -50%;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 30% 40%, rgba(184,134,11,0.04) 0%, transparent 50%);
            pointer-events: none;
        }

        body::after {
            content: '';
            position: absolute;
            bottom: -30%;
            left: -30%;
            width: 60%;
            height: 60%;
            background: radial-gradient(circle at 70% 60%, rgba(184,134,11,0.03) 0%, transparent 50%);
            pointer-events: none;
        }

        /* Header */
        .header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            padding: 15px 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 100;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .home-link {
            color: #fff;
            font-weight: 700;
            text-decoration: none;
            font-size: 1.1rem;
            letter-spacing: 1px;
        }

        .login-btn {
            background: none;
            border: 1px solid var(--border);
            color: var(--text-muted);
            padding: 8px 20px;
            border-radius: 30px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .login-btn:hover {
            border-color: var(--accent);
            color: #fff;
        }

        .user-avatar {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: var(--accent);
            color: #000;
            font-weight: 700;
            font-size: 1.2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            border: none;
            transition: transform 0.3s;
        }

        .user-avatar:hover {
            transform: scale(1.1);
        }

        /* Modal overlay */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(5px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 200;
            visibility: hidden;
            opacity: 0;
            transition: visibility 0.3s, opacity 0.3s;
        }

        .modal-overlay.active {
            visibility: visible;
            opacity: 1;
        }

        .modal {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 30px;
            width: 90%;
            max-width: 400px;
            position: relative;
            text-align: right;
        }

        .modal h2 {
            font-size: 1.3rem;
            margin-bottom: 20px;
            color: #fff;
        }

        .modal label {
            display: block;
            margin-bottom: 5px;
            color: #aaa;
            font-size: 0.9rem;
        }

        .modal input {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            background: #1a1a1a;
            border: 1px solid var(--border);
            border-radius: 6px;
            color: #fff;
            font-family: 'Cairo', sans-serif;
        }

        .modal .error {
            color: #e74c3c;
            font-size: 0.85rem;
            margin-bottom: 15px;
        }

        .modal .btn-submit {
            width: 100%;
            padding: 12px;
            background: var(--accent);
            border: none;
            color: #000;
            font-weight: 700;
            border-radius: 6px;
            cursor: pointer;
            font-family: 'Cairo', sans-serif;
            transition: background 0.3s;
        }

        .modal .btn-submit:hover {
            background: var(--accent-hover);
        }

        .modal .close-btn {
            position: absolute;
            top: 15px;
            left: 15px;
            background: none;
            border: none;
            color: #aaa;
            font-size: 1.2rem;
            cursor: pointer;
        }

        .container {
            width: 100%;
            max-width: 720px;
            text-align: center;
            z-index: 2;
            position: relative;
        }

        .logo {
            font-family: 'Amiri', serif;
            font-size: 3.5rem;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: -1px;
            margin-bottom: 0.5rem;
            line-height: 1.2;
        }

        .logo span { color: var(--accent); }

        .subtitle {
            font-size: 1.15rem;
            color: var(--text-muted);
            margin-bottom: 2.5rem;
            font-weight: 300;
            letter-spacing: 3px;
            text-transform: uppercase;
        }

        .search-box {
            display: flex;
            gap: 10px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 50px;
            padding: 6px 6px 6px 20px;
            transition: all 0.3s ease;
            margin-bottom: 2rem;
        }

        .search-box:focus-within {
            border-color: var(--accent);
            box-shadow: 0 0 20px rgba(184,134,11,0.12);
        }

        .search-box input {
            flex: 1;
            background: transparent;
            border: none;
            color: #fff;
            font-size: 1rem;
            font-family: 'Cairo', sans-serif;
            outline: none;
            padding: 10px 0;
        }

        .search-box input::placeholder { color: #555; }

        .search-box button {
            background: var(--accent);
            border: none;
            color: #000;
            font-weight: 700;
            font-family: 'Cairo', sans-serif;
            border-radius: 40px;
            padding: 10px 32px;
            cursor: pointer;
            transition: all 0.3s ease;
            white-space: nowrap;
            font-size: 0.95rem;
        }

        .search-box button:hover {
            background: var(--accent-hover);
            box-shadow: 0 4px 15px rgba(184,134,11,0.3);
        }

        .quick-links {
            display: flex;
            justify-content: center;
            gap: 24px;
            flex-wrap: wrap;
            margin-bottom: 2.5rem;
            font-size: 0.9rem;
        }

        .quick-links a {
            color: #777;
            text-decoration: none;
            border-bottom: 1px solid transparent;
            transition: all 0.25s ease;
            padding: 4px 8px;
            position: relative;
        }

        .quick-links a::after {
            content: '';
            position: absolute;
            bottom: 0;
            right: 0;
            width: 0;
            height: 1px;
            background: var(--accent);
            transition: width 0.3s ease;
        }

        .quick-links a:hover { color: #fff; }
        .quick-links a:hover::after { width: 100%; }

        .archive-btn {
            display: inline-block;
            padding: 14px 48px;
            border: 1px solid var(--accent);
            color: #fff;
            text-decoration: none;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 3px;
            font-size: 0.8rem;
            border-radius: 4px;
            transition: all 0.4s ease;
            background: rgba(184,134,11,0.05);
            margin-top: 0.5rem;
            position: relative;
            overflow: hidden;
        }

        .archive-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.1), transparent);
            transition: left 0.5s ease;
        }

        .archive-btn:hover {
            background: var(--accent);
            color: #000;
            box-shadow: 0 0 25px rgba(184,134,11,0.25);
        }

        .archive-btn:hover::before { left: 100%; }

        .footer-note {
            margin-top: 4rem;
            font-size: 0.65rem;
            color: #444;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .scanline {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 1px;
            background: rgba(184,134,11,0.06);
            pointer-events: none;
            animation: scan 8s linear infinite;
            z-index: 1;
        }

        @keyframes scan {
            0% { top: 0; }
            100% { top: 100%; }
        }

        .grain {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            opacity: 0.03;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
        }
    </style>
</head>
<body>
    <div class="scanline"></div>
    <div class="grain"></div>

    <!-- Header -->
    <header class="header">
        <div class="header-left">
            <a href="/" class="home-link">أرشيف مالينز</a>
        </div>
        <div>
            <!-- زر تسجيل الدخول (يظهر إذا لم يسجل) -->
            <button id="loginButton" class="login-btn" onclick="openLoginModal()">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4M10 17l5-5-5-5M13.8 12H3"/></svg>
                تسجيل الدخول
            </button>
            <!-- دائرة المستخدم (تظهر بعد تسجيل الدخول) -->
            <div id="userAvatar" style="display: none;" class="user-avatar" onclick="logout()"></div>
        </div>
    </header>

    <!-- المودال -->
    <div id="loginModal" class="modal-overlay">
        <div class="modal">
            <button class="close-btn" onclick="closeLoginModal()">✕</button>
            <h2>تسجيل الدخول</h2>
            <div>
                <label for="emailInput">البريد الإلكتروني</label>
                <input type="email" id="emailInput" placeholder="example@mail.com" dir="ltr">
            </div>
            <div>
                <label for="passwordInput">كلمة المرور</label>
                <input type="password" id="passwordInput" placeholder="********">
            </div>
            <div id="loginError" class="error" style="display: none;"></div>
            <button class="btn-submit" onclick="handleLogin()">دخول</button>
        </div>
    </div>

    <!-- المحتوى الرئيسي -->
    <div class="container">
        <div class="logo">
            أرشيف <span>مالينز</span>
        </div>
        <div class="subtitle">الموسوعة الحرة للوثائق والمخطوطات</div>

        <div class="search-box">
            <input 
                type="text" 
                id="searchInput" 
                placeholder="ابحث عن معاهدة، حرب، وثيقة..." 
                onkeypress="if(event.key==='Enter') goSearch()"
            />
            <button onclick="goSearch()">بحث</button>
        </div>

        <div class="quick-links">
            <a href="wiki.html?id=11001">معاهدة جين ستي</a>
            <a href="wiki.html?id=11002">الحرب 1906 - 1907</a>
            <a href="wiki.html?id=11003">الحرب 1907 - 1908</a>
        </div>

        <a href="wiki.html" class="archive-btn">دخول الأرشيف المركزي</a>

        <div class="footer-note">
            اتصال آمن &middot; موقع سري &middot; جميع الحقوق محفوظة
        </div>
    </div>

    <script>
        // ========== وظائف تسجيل الدخول ==========
        const STORAGE_KEY = 'malines_user';

        function openLoginModal() {
            document.getElementById('loginModal').classList.add('active');
            document.getElementById('emailInput').focus();
        }

        function closeLoginModal() {
            document.getElementById('loginModal').classList.remove('active');
            document.getElementById('loginError').style.display = 'none';
            document.getElementById('emailInput').value = '';
            document.getElementById('passwordInput').value = '';
        }

        async function handleLogin() {
            const email = document.getElementById('emailInput').value.trim();
            const password = document.getElementById('passwordInput').value;
            const errorDiv = document.getElementById('loginError');

            errorDiv.style.display = 'none';

            if (!email || !password) {
                errorDiv.textContent = 'يرجى إدخال البريد الإلكتروني وكلمة المرور';
                errorDiv.style.display = 'block';
                return;
            }

            try {
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                const data = await response.json();

                if (response.ok && data.success) {
                    // حفظ اسم المستخدم في localStorage
                    localStorage.setItem(STORAGE_KEY, JSON.stringify({ username: data.username }));
                    updateUIForLoggedInUser(data.username);
                    closeLoginModal();
                } else {
                    errorDiv.textContent = data.error || 'حدث خطأ ما';
                    errorDiv.style.display = 'block';
                }
            } catch (err) {
                errorDiv.textContent = 'فشل الاتصال بالخادم';
                errorDiv.style.display = 'block';
            }
        }

        function updateUIForLoggedInUser(username) {
            document.getElementById('loginButton').style.display = 'none';
            const avatar = document.getElementById('userAvatar');
            avatar.style.display = 'flex';
            avatar.textContent = username.charAt(0).toUpperCase();
            avatar.title = username;
        }

        function logout() {
            localStorage.removeItem(STORAGE_KEY);
            document.getElementById('loginButton').style.display = 'flex';
            document.getElementById('userAvatar').style.display = 'none';
        }

        // تحقق من وجود جلسة عند التحميل
        (function initAuth() {
            const stored = localStorage.getItem(STORAGE_KEY);
            if (stored) {
                try {
                    const user = JSON.parse(stored);
                    if (user.username) {
                        updateUIForLoggedInUser(user.username);
                    }
                } catch (e) { /* تجاهل */ }
            }
        })();

        // ========== وظيفة البحث ==========
        function goSearch() {
            const query = document.getElementById('searchInput').value.trim();
            if (query) {
                window.location.href = `wiki.html?q=${encodeURIComponent(query)}`;
            } else {
                window.location.href = 'wiki.html';
            }
        }
    </script>
</body>
</html>
