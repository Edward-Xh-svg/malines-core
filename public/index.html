<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Malines Community | الرئيسية</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --dark: #050505; --surface: #0a0a0a; --red: #7f1d1d; --border: #1a1a1a;
        }
        body { background: var(--dark); color: #d4d4d4; font-family: system-ui, -apple-system, sans-serif; }
        .hero-gradient { background: radial-gradient(circle at center, #1a0505 0%, #050505 100%); }
        .btn-red { background: var(--red); transition: 0.3s; border: 1px solid #991b1b; }
        .btn-red:hover { background: #b91c1c; box-shadow: 0 0 20px rgba(127, 29, 29, 0.4); }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <header class="border-b border-[#1a1a1a] sticky top-0 bg-black/80 backdrop-blur-md z-50">
        <div class="max-w-7xl mx-auto px-6 h-16 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <span class="w-1 h-6 bg-red-800"></span>
                <span class="font-black tracking-tighter text-xl text-white">MALINES</span>
            </div>
            <nav class="hidden md:flex gap-8 text-xs font-bold tracking-widest text-neutral-500">
                <a href="#" class="hover:text-red-700 transition">INFRASTRUCTURE</a>
                <a href="#" class="hover:text-red-700 transition">PROTOCOLS</a>
                <a href="wiki.html" class="text-red-600">ARCHIVE</a>
            </nav>
        </div>
    </header>

    <main class="flex-grow flex flex-col items-center justify-center relative px-6 hero-gradient">
        <div class="text-center max-w-4xl py-20">
            <h1 class="text-5xl md:text-7xl font-black text-white mb-6 leading-none">
                GEOPOLITICAL <br><span class="text-red-800">COMMAND CENTER</span>
            </h1>
            <p class="text-neutral-500 text-lg md:text-xl max-w-2xl mx-auto mb-10 leading-relaxed">
                المنصة المركزية لإدارة العمليات السياسية والمحاكاة الاستراتيجية ضمن مجتمع Malines. 
            </p>
            <div class="flex flex-col md:flex-row gap-4 justify-center">
                <a href="wiki.html" class="btn-red px-10 py-4 text-white font-bold text-sm uppercase tracking-widest">
                    دخول الأرشيف الإخباري
                </a>
            </div>
        </div>
    </main>

    <footer class="border-t border-[#1a1a1a] p-10 bg-black">
        <div class="max-w-7xl mx-auto flex flex-col md:flex-row justify-between items-center gap-6">
            <div class="text-center md:text-right">
                <p class="text-[10px] text-neutral-600 uppercase tracking-widest mb-1">Official Communications</p>
                <a href="mailto:malines@ivanova.sbs" class="text-neutral-400 hover:text-red-700 font-mono">malines@ivanova.sbs</a>
            </div>
            <p class="text-[10px] text-neutral-700 font-mono uppercase tracking-widest">© 2026 IVANOVA CORP. SYSTEM ID: MALINES-CORE</p>
        </div>
    </footer>

</body>
</html>
