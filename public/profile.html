<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="malines-fivcon.png" type="image/png">
    <title>الملف الشخصي | مجتمع مالينز</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root{--black:#050505;--dark:#0a0a0a;--card:#0f0f10;--border:#232325;--text:#e9e9e9;--muted:#8d8d8d;--red:#c0392b;--red-hover:#e74c3c;--accent:#d4af37;}
        *{margin:0;padding:0;box-sizing:border-box;}
        body{background:radial-gradient(circle at 20% 20%,rgba(192,57,43,0.08),transparent 30%),var(--black);color:var(--text);font-family:'Cairo',sans-serif;min-height:100vh;}

        /* Topbar */
        .topbar{position:fixed;top:0;left:0;right:0;height:64px;background:rgba(5,5,5,0.7);backdrop-filter:blur(24px);border-bottom:1px solid rgba(255,255,255,0.04);display:flex;align-items:center;justify-content:space-between;padding:0 32px;z-index:100;}
        .topbar-title{font-weight:800;font-size:1rem;color:#fff;}
        .btn-back{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,0.04);border:1px solid var(--border);color:#ccc;padding:8px 16px;border-radius:999px;cursor:pointer;font-family:'Cairo';font-size:0.88rem;text-decoration:none;transition:0.2s;}
        .btn-back:hover{background:rgba(255,255,255,0.08);color:#fff;}

        /* Profile */
        .profile-wrap{max-width:680px;margin:96px auto 60px;padding:0 24px;}

        .profile-card{background:rgba(15,15,16,0.95);border:1px solid var(--border);border-radius:24px;padding:40px;margin-bottom:24px;}

        .avatar-section{display:flex;align-items:center;gap:24px;margin-bottom:32px;}
        .avatar-big{width:90px;height:90px;border-radius:50%;background:linear-gradient(145deg,var(--red),#8e2a1f);display:flex;align-items:center;justify-content:center;font-size:2.2rem;font-weight:800;color:#fff;flex-shrink:0;overflow:hidden;position:relative;cursor:pointer;}
        .avatar-big img{width:100%;height:100%;object-fit:cover;}
        .avatar-overlay{position:absolute;inset:0;background:rgba(0,0,0,0.5);display:flex;align-items:center;justify-content:center;opacity:0;transition:0.2s;border-radius:50%;}
        .avatar-big:hover .avatar-overlay{opacity:1;}
        .avatar-info h2{font-size:1.4rem;font-weight:900;color:#fff;}
        .role-badge{display:inline-block;padding:3px 12px;border-radius:999px;font-size:0.78rem;font-weight:700;margin-top:6px;}
        .badge-admin{background:rgba(192,57,43,0.15);color:var(--red-hover);border:1px solid rgba(192,57,43,0.25);}
        .badge-member{background:rgba(255,255,255,0.05);color:var(--muted);border:1px solid var(--border);}

        .section-title{font-size:1rem;font-weight:800;color:#fff;margin-bottom:18px;padding-bottom:10px;border-bottom:1px solid var(--border);}
        .form-group{margin-bottom:18px;}
        .form-label{display:block;margin-bottom:7px;color:#aaa;font-size:0.88rem;font-weight:600;}
        .form-input{width:100%;padding:12px 14px;background:#1a1a1a;border:1px solid rgba(255,255,255,0.07);border-radius:10px;color:#fff;font-family:'Cairo';font-size:0.92rem;}
        .form-input:focus{outline:none;border-color:rgba(255,255,255,0.2);}
        textarea.form-input{resize:vertical;min-height:100px;}
        .form-row{display:grid;grid-template-columns:1fr 1fr;gap:16px;}

        .alert{padding:12px 16px;border-radius:10px;font-size:0.88rem;margin-bottom:16px;display:none;}
        .alert-error{background:rgba(192,57,43,0.1);color:var(--red-hover);border:1px solid rgba(192,57,43,0.2);}
        .alert-success{background:rgba(34,197,94,0.08);color:#4ade80;border:1px solid rgba(34,197,94,0.2);}

        .btn-save{display:inline-flex;align-items:center;gap:8px;padding:12px 28px;background:#fff;color:#000;border:none;border-radius:10px;cursor:pointer;font-family:'Cairo';font-size:0.92rem;font-weight:800;transition:0.2s;}
        .btn-save:hover{background:#e5e5e5;}
        .btn-save:disabled{opacity:0.5;cursor:not-allowed;}

        .not-logged{text-align:center;padding:80px 24px;}
        .not-logged h2{font-size:1.4rem;font-weight:800;color:#fff;margin-bottom:12px;}
        .not-logged p{color:var(--muted);margin-bottom:24px;}
        .btn-go{display:inline-block;padding:12px 28px;background:#fff;color:#000;border-radius:10px;font-weight:800;text-decoration:none;font-family:'Cairo';}

        @media(max-width:600px){.form-row{grid-template-columns:1fr;}.avatar-section{flex-direction:column;text-align:center;}}
    </style>
</head>
<body>
<header class="topbar">
    <a href="javascript:history.back()" class="btn-back">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg>
        رجوع
    </a>
    <span class="topbar-title">الملف الشخصي</span>
    <div style="width:80px;"></div>
</header>

<div class="profile-wrap" id="profileWrap">
    <div style="text-align:center;padding:80px;color:var(--muted);">
        <div style="width:40px;height:40px;border:3px solid #2a2a2a;border-top-color:var(--red);border-radius:50%;animation:spin 1s linear infinite;margin:0 auto 16px;"></div>
        جارٍ التحميل...
    </div>
</div>

<style>@keyframes spin{to{transform:rotate(360deg);}}</style>

<input type="file" id="avatarFileInput" accept="image/*" style="display:none;" onchange="handleAvatarSelect(event)">

<script>
const TOKEN = localStorage.getItem('malines_token') || '';
const stored = localStorage.getItem('malines_user');
let currentUser = null;
let newAvatarBase64 = '';

try { if (stored) currentUser = JSON.parse(stored); } catch(e) {}

async function init() {
    if (!TOKEN || !currentUser) {
        document.getElementById('profileWrap').innerHTML = `
            <div class="not-logged">
                <h2>يجب تسجيل الدخول</h2>
                <p>سجّل دخولك لعرض وتعديل ملفك الشخصي</p>
                <a href="/" class="btn-go">الذهاب للرئيسية</a>
            </div>`;
        return;
    }

    try {
        const res = await fetch('/api/me', { headers:{'Authorization':'Bearer '+TOKEN} });
        const user = await res.json();
        renderProfile(user);
    } catch(e) { renderProfile(currentUser); }
}

function renderProfile(user) {
    const isAdmin = user.role === 'admin';
    const badgeClass = isAdmin ? 'badge-admin' : 'badge-member';
    const badgeLabel = isAdmin ? 'Admin' : 'Member';
    const avatarHtml = user.avatar
        ? `<img src="${esc(user.avatar)}" alt="${esc(user.username)}"><div class="avatar-overlay"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg></div>`
        : `${esc((user.username||'?').charAt(0).toUpperCase())}<div class="avatar-overlay"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg></div>`;

    document.getElementById('profileWrap').innerHTML = `
        <div class="profile-card">
            <div class="avatar-section">
                <div class="avatar-big" id="avatarBig" onclick="document.getElementById('avatarFileInput').click()" title="اضغط لتغيير الصورة">${avatarHtml}</div>
                <div class="avatar-info">
                    <h2>${esc(user.display_name || user.username)}</h2>
                    <div style="color:var(--muted);font-size:0.88rem;">@${esc(user.username)}</div>
                    <span class="role-badge ${badgeClass}">${badgeLabel}</span>
                </div>
            </div>

            <div class="section-title">تعديل الملف الشخصي</div>
            <div class="alert alert-error" id="profileErr"></div>
            <div class="alert alert-success" id="profileOk"></div>

            <div class="form-row">
                <div class="form-group">
                    <label class="form-label">الاسم المعروض</label>
                    <input class="form-input" type="text" id="fDisplayName" value="${esc(user.display_name||'')}" placeholder="${esc(user.username)}">
                </div>
                <div class="form-group">
                    <label class="form-label">المعرّف داخل اللعبة</label>
                    <input class="form-input" type="text" id="fGameId" value="${esc(user.game_id||'')}" placeholder="#0000" dir="ltr">
                </div>
            </div>
            <div class="form-group">
                <label class="form-label">نبذة شخصية</label>
                <textarea class="form-input" id="fBio" placeholder="أخبرنا عن نفسك...">${esc(user.bio||'')}</textarea>
            </div>
            <button class="btn-save" id="saveBtn" onclick="saveProfile()">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
                حفظ التغييرات
            </button>
        </div>
    `;
}

function handleAvatarSelect(e) {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = function(ev) {
        newAvatarBase64 = ev.target.result;
        const el = document.getElementById('avatarBig');
        if (el) el.innerHTML = `<img src="${newAvatarBase64}" alt="avatar"><div class="avatar-overlay"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg></div>`;
    };
    reader.readAsDataURL(file);
}

async function saveProfile() {
    const display_name = document.getElementById('fDisplayName')?.value.trim() || '';
    const bio          = document.getElementById('fBio')?.value.trim() || '';
    const game_id      = document.getElementById('fGameId')?.value.trim() || '';
    const errEl = document.getElementById('profileErr');
    const okEl  = document.getElementById('profileOk');
    errEl.style.display = 'none'; okEl.style.display = 'none';
    const btn = document.getElementById('saveBtn');
    btn.disabled = true; btn.textContent = 'جارٍ الحفظ...';

    try {
        let avatarUrl = currentUser?.avatar || '';

        // رفع الصورة الجديدة إذا وُجدت
        if (newAvatarBase64) {
            const upRes = await fetch('/api/upload', {
                method: 'POST',
                headers: {'Content-Type':'application/json','Authorization':'Bearer '+TOKEN},
                body: JSON.stringify({ image: newAvatarBase64 })
            });
            const upData = await upRes.json();
            if (upData.url) avatarUrl = upData.url;
        }

        const r = await fetch('/api/profile', {
            method: 'PUT',
            headers: {'Content-Type':'application/json','Authorization':'Bearer '+TOKEN},
            body: JSON.stringify({ display_name, bio, game_id, avatar: avatarUrl })
        });
        const data = await r.json();
        if (data.success) {
            // تحديث localStorage
            if (currentUser) {
                currentUser.avatar = avatarUrl;
                currentUser.display_name = display_name;
                localStorage.setItem('malines_user', JSON.stringify(currentUser));
            }
            okEl.textContent = 'تم الحفظ بنجاح ✅';
            okEl.style.display = 'block';
            newAvatarBase64 = '';
        } else {
            errEl.textContent = data.error || 'فشل الحفظ';
            errEl.style.display = 'block';
        }
    } catch(e) { errEl.textContent = 'تعذر الاتصال'; errEl.style.display = 'block'; }
    finally { btn.disabled = false; btn.innerHTML = `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg> حفظ التغييرات`; }
}

function esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

init();
</script>
</body>
</html>
