<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Malines Wiki | الأرشيف المركزي</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&family=JetBrains+Mono:wght@300;500&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root { --bg: #050505; --red: #b91c1c; --border: #1a1a1a; }
        body { background: var(--bg); color: #d4d4d4; font-family: 'Cairo', sans-serif; margin: 0; }
        .article-card { border-bottom: 1px solid var(--border); padding: 4rem 0; }
        .document-content { 
            font-family: 'JetBrains Mono', monospace; 
            font-size: 0.95rem; 
            color: #a3a3a3; 
            white-space: pre-wrap; 
            border-right: 2px solid var(--red); 
            padding-right: 1.5rem; 
            margin-top: 2rem;
        }
        .title-text { font-weight: 900; color: white; letter-spacing: -0.02em; }
        /* شريط تحميل بسيط */
        .loader-bar { height: 2px; background: var(--red); width: 0%; transition: 0.3s; }
    </style>
</head>
<body class="content-view">
    <div id="app">
        <header class="sticky top-0 z-50 bg-black/90 border-b border-white/5 px-6 py-4">
            <div class="max-w-5xl mx-auto flex justify-between items-center">
                <span class="text-xs font-bold tracking-widest text-white uppercase">Terminal: Malines Wiki</span>
                <a href="index.html" class="text-[10px] text-neutral-500 uppercase">Return</a>
            </div>
        </header>

        <main class="max-w-4xl mx-auto px-6">
            <div v-if="loading" class="py-20 text-center animate-pulse text-xs uppercase tracking-widest">
                قاري قراءة البيانات...
            </div>

            <div v-else>
                <section v-for="article in fullArticles" :key="article.id" class="article-card">
                    <span class="text-[10px] text-red-700 font-bold tracking-[0.3em] uppercase block mb-4">REF: {{ article.id }}</span>
                    <h2 class="title-text text-4xl md:text-6xl mb-10">{{ article.title }}</h2>

                    <div class="mb-10 border border-white/5 bg-black p-1">
                        <img :src="'/png/' + article.id + '.png'" 
                             @error="(e) => e.target.style.display = 'none'" 
                             class="w-full grayscale hover:grayscale-0 transition duration-700">
                    </div>

                    <div class="document-content">{{ article.content }}</div>
                </section>
            </div>
        </main>
    </div>

    <script>
        const { createApp, ref, onMounted } = Vue;
        createApp({
            setup() {
                const fullArticles = ref([]);
                const loading = ref(true);

                const loadArticles = async () => {
                    loading.value = true;
                    try {
                        const res = await fetch('/api/articles');
                        const list = await res.json();
                        
                        // جلب المحتوى لكل ملف بشكل منفصل لضمان استقرار قراءة TXT
                        for (let item of list) {
                            try {
                                const textRes = await fetch(`/txt/${item.id}.txt`);
                                if (textRes.ok) {
                                    item.content = await textRes.text();
                                    fullArticles.value.push(item);
                                }
                            } catch (e) { console.error("Error loading " + item.id); }
                        }
                    } catch (e) { console.error("Archive Error"); }
                    loading.value = false;
                };

                onMounted(loadArticles);
                return { fullArticles, loading };
            }
        }).mount('#app');
    </script>
</body>
</html>
