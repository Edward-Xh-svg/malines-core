<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>أرشيف مالينز | السجلات المركزية</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700;900&family=JetBrains+Mono&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root { --bg: #050505; --red: #7f1d1d; --border: #1a1a1a; }
        body { 
            background: var(--bg); 
            color: #d4d4d4; 
            font-family: 'Cairo', sans-serif; 
            margin: 0;
            scroll-behavior: smooth;
        }
        
        /* تنسيق المقالات المتتالية */
        .article-section {
            border-bottom: 1px solid var(--border);
            padding: 100px 0;
            opacity: 0;
            transform: translateY(20px);
            animation: fadeIn 0.8s forwards;
        }

        @keyframes fadeIn {
            to { opacity: 1; transform: translateY(0); }
        }

        .document-title {
            font-weight: 900;
            color: white;
            text-transform: uppercase;
            letter-spacing: -0.02em;
            line-height: 1.1;
        }

        /* تنسيق النص الجذاب */
        .document-body {
            font-family: 'JetBrains Mono', monospace;
            background: #0a0a0a;
            padding: 30px;
            border-right: 4px solid var(--red);
            font-size: 0.95rem;
            line-height: 1.8;
            color: #a3a3a3;
            white-space: pre-wrap;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.5);
        }

        .img-container {
            border: 1px solid var(--border);
            background: black;
            padding: 5px;
            overflow: hidden;
        }

        .img-container img {
            filter: grayscale(1);
            transition: 0.5s;
        }

        .img-container:hover img {
            filter: grayscale(0);
        }

        /* شريط التمرير */
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-thumb { background: var(--red); }
    </style>
</head>
<body>

    <div id="app" class="max-w-4xl mx-auto px-6">
        
        <header class="py-12 border-b border-white/5 flex justify-between items-end">
            <div>
                <h1 class="text-white font-black text-2xl tracking-tighter uppercase">Malines Archive</h1>
                <p class="text-[10px] text-red-900 font-bold tracking-[0.4em] uppercase">Security Level: Alpha</p>
            </div>
            <a href="index.html" class="text-[10px] text-neutral-600 hover:text-white transition uppercase border-b border-transparent hover:border-red-900 pb-1">Exit Terminal</a>
        </header>

        <div v-if="loading" class="py-40 text-center">
            <div class="inline-block w-8 h-8 border-2 border-red-900 border-t-white rounded-full animate-spin mb-4"></div>
            <p class="text-[10px] tracking-widest text-neutral-600 uppercase">Connecting to Database...</p>
        </div>

        <main v-else>
            <section v-for="(art, index) in articles" :key="art.id" class="article-section">
                
                <div class="flex items-center gap-4 mb-6">
                    <span class="text-[10px] font-bold text-red-700 uppercase tracking-widest">Doc_ID: {{ art.id }}</span>
                    <div class="h-[1px] flex-grow bg-white/5"></div>
                </div>

                <h2 class="document-title text-5xl md:text-7xl mb-12">{{ art.title }}</h2>

                <div class="img-container mb-12 shadow-2xl">
                    <img :src="'/PNG/' + art.id + '.png'" 
                         @error="(e) => e.target.style.display='none'"
                         class="w-full h-auto">
                </div>

                <div v-if="art.content" class="document-body shadow-lg">
                    {{ art.content }}
                </div>
                <div v-else class="text-xs text-neutral-700 italic">
                    جاري فك تشفير البيانات النبضية...
                </div>

            </section>
        </main>

        <footer class="py-20 text-center opacity-20 text-[9px] tracking-[1em] uppercase">
            End of Archive Connection
        </footer>
    </div>

    <script>
        const { createApp, ref, onMounted } = Vue;
        createApp({
            setup() {
                const articles = ref([]);
                const loading = ref(true);

                const init = async () => {
                    try {
                        // 1. جلب القائمة من السيرفر
                        const res = await fetch('/api/articles');
                        const data = await res.json();
                        articles.value = data;
                        loading.value = false;

                        // 2. جلب نصوص الملفات مباشرة من مجلد TXT داخل public
                        data.forEach(async (item, index) => {
                            try {
                                const textRes = await fetch(`/TXT/${item.id}.txt`);
                                if (textRes.ok) {
                                    articles.value[index].content = await textRes.text();
                                }
                            } catch (err) {
                                console.error("Error loading text for: " + item.id);
                            }
                        });
                    } catch (e) {
                        console.error("Connection failed");
                        loading.value = false;
                    }
                };

                onMounted(init);
                return { articles, loading };
            }
        }).mount('#app');
    </script>
</body>
</html>
