<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>أرشيف مالينز المركزي</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700;900&family=IBM+Plex+Sans+Arabic:wght@300;500&family=Amiri:wght@400;700&display=swap" rel="stylesheet">

    <!-- Open Graph / WhatsApp / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://malines.ivanova.sbs/wiki.html" />
    <meta property="og:title" content="Archive | Malines Community" />
    <meta property="og:description" content="مرحبا في ارشيف مجتمع مالينز" />
    <meta property="og:image" content="https://malines.ivanova.sbs/sex-con.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="ar_MA" />
    <meta property="og:site_name" content="Archive | Malines Community" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://malines.ivanova.sbs/wiki.html" />
    <meta name="twitter:title" content="Archive | Malines Community" />
    <meta name="twitter:description" content="مرحبا في ارشيف مجتمع مالينز!" />
    <meta name="twitter:image" content="https://malines.ivanova.sbs/sex-con.png" />

    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --bg: #0d0d0d;
            --sidebar-bg: #121212;
            --text: #d0d0d0;
            --link: #6ea8dc;
            --border: #2a2a2a;
            --accent: #b8860b;
        }
        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'IBM Plex Sans Arabic', sans-serif;
            margin: 0;
        }
        .wiki-body {
            display: flex;
            min-height: 100vh;
        }
        .sidebar {
            width: 280px;
            background: var(--sidebar-bg);
            border-left: 1px solid var(--border);
            padding: 20px;
            position: sticky;
            top: 0;
            height: 100vh;
            overflow-y: auto;
            flex-shrink: 0;
        }
        .main-content {
            flex: 1;
            padding: 40px 60px;
            max-width: 900px;
        }
        .article-title {
            font-family: 'Amiri', serif;
            font-weight: 700;
            border-bottom: 2px solid var(--border);
            padding-bottom: 10px;
            margin-bottom: 30px;
            color: #f0f0f0;
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .listen-btn {
            background: none;
            border: 1px solid var(--border);
            color: #ccc;
            font-size: 1.8rem;
            cursor: pointer;
            border-radius: 8px;
            padding: 4px 10px;
            transition: 0.3s;
            line-height: 1;
        }
        .listen-btn:hover {
            background: #1a1a1a;
            color: #fff;
            border-color: var(--accent);
        }
        .listen-btn.active {
            color: var(--accent);
            border-color: var(--accent);
            background: #1a1a1a;
            animation: pulse 1.2s infinite;
        }
        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(184, 134, 11, 0.4); }
            70% { box-shadow: 0 0 0 8px rgba(184, 134, 11, 0); }
            100% { box-shadow: 0 0 0 0 rgba(184, 134, 11, 0); }
        }
        .document-text {
            font-family: 'Amiri', serif;
            line-height: 2.4;
            font-size: 1.15rem;
            color: #c0c0c0;
            white-space: pre-wrap;
            background: rgba(255,255,255,0.02);
            padding: 20px;
            border-radius: 8px;
            border-right: 3px solid var(--accent);
            position: relative;
        }
        .word {
            transition: 0.2s;
            position: relative;
        }
        .word.current {
            background: rgba(184, 134, 11, 0.2);
            border-radius: 4px;
            padding: 0 2px;
            color: #fff;
        }
        .word.current::before {
            content: "▸";
            position: absolute;
            right: -1.2em;
            top: 50%;
            transform: translateY(-50%);
            color: var(--accent);
            font-size: 1rem;
            animation: bounce 0.6s infinite alternate;
        }
        @keyframes bounce {
            from { transform: translateY(-50%) scale(1); }
            to { transform: translateY(-60%) scale(1.2); }
        }
        .sidebar-link {
            display: block;
            padding: 8px 12px;
            margin: 4px 0;
            border-radius: 6px;
            color: #aaa;
            text-decoration: none;
            transition: 0.2s;
            cursor: pointer;
            font-size: 0.9rem;
        }
        .sidebar-link:hover, .sidebar-link.active {
            background: #1e1e1e;
            color: #fff;
            border-right: 3px solid var(--accent);
        }
        .search-input {
            width: 100%;
            padding: 8px 12px;
            background: #1a1a1a;
            border: 1px solid var(--border);
            border-radius: 6px;
            color: #ddd;
            margin-bottom: 20px;
            font-family: inherit;
        }
        .image-container img {
            max-width: 100%;
            border-radius: 8px;
            border: 1px solid var(--border);
            filter: grayscale(0.3);
            transition: 0.5s;
        }
        .image-container img:hover {
            filter: grayscale(0);
        }
        .placeholder-message {
            font-style: italic;
            color: #888;
        }
        .sidebar::-webkit-scrollbar { width: 6px; }
        .sidebar::-webkit-scrollbar-track { background: #0a0a0a; }
        .sidebar::-webkit-scrollbar-thumb { background: #333; border-radius: 3px; }
    </style>
</head>
<body>
    <div id="app">
        <div class="wiki-body">
            <!-- الشريط الجانبي -->
            <aside class="sidebar">
                <div style="font-family: 'Cairo', sans-serif; font-weight: 900; font-size: 1.3rem; color: #ddd; margin-bottom: 25px; border-bottom: 1px solid var(--border); padding-bottom: 10px;">
                    📜 الأرشيف
                </div>
                <input 
                    type="text" 
                    v-model="searchQuery" 
                    placeholder="ابحث عن مقال..." 
                    class="search-input"
                />
                <nav>
                    <div 
                        v-for="art in filteredArticles" 
                        :key="art.id"
                        :class="['sidebar-link', { active: activeId === art.id }]"
                        @click="selectArticle(art.id)"
                    >
                        {{ art.title }}
                    </div>
                    <div v-if="filteredArticles.length === 0" style="color: #555; padding: 10px;">
                        لا توجد نتائج
                    </div>
                </nav>
            </aside>

            <!-- المحتوى الرئيسي -->
            <main class="main-content">
                <div v-if="!activeArticle" style="text-align: center; margin-top: 100px;">
                    <h2 style="font-family: 'Amiri', serif; font-size: 2.5rem; color: #555;">مرحباً بك في الأرشيف</h2>
                    <p class="placeholder-message">اختر مقالاً من القائمة الجانبية للبدء</p>
                </div>

                <div v-else>
                    <h1 class="article-title" style="font-size: 2.4rem;">
                        <span>{{ activeArticle.title }}</span>
                        <button 
                            class="listen-btn" 
                            :class="{ active: isSpeaking }"
                            @click="toggleSpeech"
                            :title="isSpeaking ? 'إيقاف الاستماع' : 'استمع إلى المقال'"
                        >
                            {{ isSpeaking ? '▶' : '▷' }}
                        </button>
                    </h1>

                    <div class="image-container" style="margin-bottom: 30px;">
                        <img 
                            :src="'/PNG/' + activeArticle.id + '.png'" 
                            @error="(e) => e.target.style.display='none'"
                            :alt="activeArticle.title"
                            loading="lazy"
                        />
                        <div v-if="imageFailed" style="color: #444; font-size: 0.8rem; margin-top: 5px;">(لا توجد صورة)</div>
                    </div>

                    <!-- عرض النص مع مؤشر النطق -->
                    <div v-if="activeArticle.content" class="document-text" ref="textContainer">
                        <span 
                            v-for="(token, idx) in tokens" 
                            :key="idx"
                            :class="['word', { current: idx === currentTokenIndex && isSpeaking }]"
                        >{{ token.text }}</span>
                    </div>
                    <div v-else-if="loadingContent" class="placeholder-message" style="padding: 30px; text-align: center;">
                        ⏳ جارٍ تحميل الوثيقة...
                    </div>
                    <div v-else class="placeholder-message" style="padding: 30px; text-align: center; color: #aa0000;">
                        ⚠️ تعذر تحميل المحتوى لهذا المقال.
                    </div>
                </div>
            </main>
        </div>
    </div>

    <script>
        const { createApp, ref, computed, onMounted, watch, nextTick } = Vue;

        createApp({
            setup() {
                const articles = ref([
                    { id: '11001', title: 'معاهدة جين ستي', content: null },
                    { id: '11002', title: 'الحرب الهولندية اليابانية الألمانية : اغسطس 1906 - مارس 1907', content: null },
                    { id: '11003', title: 'الحرب الهولندية اليابانية الألمانية : اغسطس 1907 - مارس 1908', content: null },
                ]);

                const activeId = ref(null);
                const searchQuery = ref('');
                const loadingContent = ref(false);
                const isSpeaking = ref(false);
                const currentTokenIndex = ref(-1);
                const tokens = ref([]);
                const speechSynth = window.speechSynthesis;
                let utterance = null;

                const filteredArticles = computed(() => {
                    const q = searchQuery.value.trim().toLowerCase();
                    if (!q) return articles.value;
                    return articles.value.filter(art => 
                        art.title.toLowerCase().includes(q)
                    );
                });

                const activeArticle = computed(() => {
                    return articles.value.find(a => a.id === activeId.value) || null;
                });

                const loadAllContents = async () => {
                    const promises = articles.value.map(async (article) => {
                        try {
                            const res = await fetch(`/TXT/${article.id}.txt`);
                            if (res.ok) {
                                article.content = await res.text();
                            } else {
                                article.content = '';
                            }
                        } catch (e) {
                            article.content = '';
                        }
                    });
                    await Promise.allSettled(promises);
                };

                const selectArticle = (id) => {
                    if (isSpeaking.value) stopSpeech();
                    activeId.value = id;
                    const art = articles.value.find(a => a.id === id);
                    if (art && art.content === null) {
                        loadingContent.value = true;
                        fetch(`/TXT/${id}.txt`)
                            .then(res => res.ok ? res.text() : '')
                            .then(text => {
                                art.content = text;
                                loadingContent.value = false;
                            })
                            .catch(() => {
                                art.content = '';
                                loadingContent.value = false;
                            });
                    }
                };

                // تقسيم النص إلى كلمات مع الحفاظ على الفراغات
                const tokenize = (text) => {
                    if (!text) return [];
                    // تقسيم يحافظ على المسافات والأسطر كعناصر منفصلة
                    const parts = text.split(/(\s+)/);
                    return parts.map(p => ({ text: p, isSpace: /^\s+$/.test(p) }));
                };

                // تحديث tokens عند تغير المقال النشط أو محتواه
                watch([activeArticle, () => activeArticle.value?.content], () => {
                    if (activeArticle.value && activeArticle.value.content) {
                        tokens.value = tokenize(activeArticle.value.content);
                    } else {
                        tokens.value = [];
                    }
                    currentTokenIndex.value = -1;
                }, { immediate: true });

                const stopSpeech = () => {
                    speechSynth.cancel();
                    isSpeaking.value = false;
                    currentTokenIndex.value = -1;
                };

                const toggleSpeech = () => {
                    if (isSpeaking.value) {
                        stopSpeech();
                        return;
                    }
                    if (!activeArticle.value || !activeArticle.value.content) return;

                    // إيقاف أي كلام حالي
                    speechSynth.cancel();

                    const text = activeArticle.value.content;
                    utterance = new SpeechSynthesisUtterance(text);
                    utterance.lang = 'ar-SA'; // العربية
                    utterance.rate = 0.9;
                    utterance.pitch = 1;

                    // تتبع الحدود لتحديث المؤشر
                    utterance.onboundary = (event) => {
                        if (event.charIndex !== undefined) {
                            // البحث عن token الذي يغطي هذا الموضع
                            let charCount = 0;
                            for (let i = 0; i < tokens.value.length; i++) {
                                const t = tokens.value[i];
                                const len = t.text.length;
                                if (event.charIndex >= charCount && event.charIndex < charCount + len) {
                                    currentTokenIndex.value = i;
                                    break;
                                }
                                charCount += len;
                            }
                        }
                    };

                    utterance.onend = () => {
                        isSpeaking.value = false;
                        currentTokenIndex.value = -1;
                    };

                    utterance.onerror = () => {
                        isSpeaking.value = false;
                        currentTokenIndex.value = -1;
                    };

                    speechSynth.speak(utterance);
                    isSpeaking.value = true;
                };

                onMounted(loadAllContents);

                return {
                    articles,
                    activeId,
                    searchQuery,
                    filteredArticles,
                    activeArticle,
                    loadingContent,
                    isSpeaking,
                    currentTokenIndex,
                    tokens,
                    toggleSpeech,
                    selectArticle,
                };
            }
        }).mount('#app');
    </script>
</body>
</html>
