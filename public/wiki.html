<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>أرشيف مالينز المركزي</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&family=IBM+Plex+Sans+Arabic:wght@300;500&family=Amiri:wght@400;700&display=swap" rel="stylesheet">

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://malines.ivanova.sbs/wiki.html" />
    <meta property="og:title" content="Archive | Malines Community" />
    <meta property="og:description" content="مرحبا في ارشيف مجتمع مالينز" />
    <meta property="og:image" content="https://malines.ivanova.sbs/sex-con.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="ar_MA" />
    <meta property="og:site_name" content="Archive | Malines Community" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://malines.ivanova.sbs/wiki.html" />
    <meta name="twitter:title" content="Archive | Malines Community" />
    <meta name="twitter:description" content="مرحبا في ارشيف مجتمع مالينز!" />
    <meta name="twitter:image" content="https://malines.ivanova.sbs/sex-con.png" />

    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --bg: #0a0a0a;
            --sidebar-bg: #0f0f0f;
            --text: #cccccc;
            --link: #8ab4f8;
            --border: #2a2a2a;
            --accent: #c49b3f;
            --accent-hover: #dbb452;
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'IBM Plex Sans Arabic', sans-serif;
            margin: 0;
            display: flex;
        }

        .wiki-body {
            display: flex;
            width: 100%;
            min-height: 100vh;
        }

        /* Sidebar */
        .sidebar {
            width: 300px;
            background: var(--sidebar-bg);
            border-left: 1px solid var(--border);
            padding: 24px 0;
            position: sticky;
            top: 0;
            height: 100vh;
            overflow-y: auto;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
        }

        .sidebar-header {
            padding: 0 24px 20px;
            border-bottom: 1px solid var(--border);
            margin-bottom: 16px;
        }

        .sidebar-header a {
            font-family: 'Cairo', sans-serif;
            font-weight: 700;
            font-size: 1.25rem;
            color: #e0e0e0;
            margin: 0;
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
            transition: color 0.2s;
        }

        .sidebar-header a:hover {
            color: var(--accent);
        }

        .sidebar-header .icon {
            color: var(--accent);
            opacity: 0.8;
            flex-shrink: 0;
        }

        .search-box {
            padding: 0 24px;
            margin-bottom: 20px;
            position: relative;
        }

        .search-input {
            width: 100%;
            padding: 10px 12px 10px 36px;
            background: #1a1a1a;
            border: 1px solid var(--border);
            border-radius: 8px;
            color: #ddd;
            font-family: inherit;
            font-size: 0.9rem;
            box-sizing: border-box;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .search-input:focus {
            border-color: var(--accent);
            outline: none;
            box-shadow: 0 0 0 3px rgba(196,155,63,0.08);
        }

        .search-input::placeholder {
            color: #555;
        }

        .search-icon {
            position: absolute;
            right: 34px;
            top: 50%;
            transform: translateY(-50%);
            color: #555;
            pointer-events: none;
            transition: color 0.2s;
        }

        .search-box:focus-within .search-icon {
            color: var(--accent);
        }

        .nav-list {
            list-style: none;
            padding: 0 12px;
            margin: 0;
            flex: 1;
            overflow-y: auto;
        }

        .nav-item {
            display: block;
            padding: 10px 14px;
            margin: 2px 0;
            border-radius: 6px;
            color: #999;
            text-decoration: none;
            transition: all 0.2s ease;
            cursor: pointer;
            font-size: 0.88rem;
            border-right: 2px solid transparent;
            line-height: 1.5;
        }

        .nav-item:hover {
            background: #1a1a1a;
            color: #e0e0e0;
            border-right-color: rgba(196,155,63,0.5);
        }

        .nav-item.active {
            background: #1a1a1a;
            color: #fff;
            border-right-color: var(--accent);
            font-weight: 500;
        }

        .no-results {
            color: #555;
            padding: 12px 14px;
            font-size: 0.85rem;
            text-align: center;
        }

        /* Main content */
        .main-content {
            flex: 1;
            padding: 40px 56px;
            max-width: 900px;
            margin: 0 auto;
            width: 100%;
        }

        .article-header {
            margin-bottom: 32px;
        }

        .article-title {
            font-family: 'Amiri', serif;
            font-weight: 700;
            font-size: 2.2rem;
            color: #f0f0f0;
            border-bottom: 1px solid var(--border);
            padding-bottom: 16px;
            margin: 0 0 20px;
            display: flex;
            align-items: center;
            gap: 14px;
            line-height: 1.3;
        }

        .article-title .icon {
            color: var(--accent);
            opacity: 0.7;
            flex-shrink: 0;
        }

        .article-meta {
            display: flex;
            gap: 24px;
            color: #666;
            font-size: 0.85rem;
            flex-wrap: wrap;
        }

        .meta-item {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .meta-item .icon {
            color: #444;
            flex-shrink: 0;
        }

        .image-container {
            margin-bottom: 32px;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid var(--border);
            background: #0f0f0f;
        }

        .image-container img {
            width: 100%;
            display: block;
            filter: grayscale(0.3);
            transition: filter 0.5s ease;
        }

        .image-container img:hover {
            filter: grayscale(0);
        }

        .document-text {
            font-family: 'Amiri', serif;
            line-height: 2.4;
            font-size: 1.15rem;
            color: #c0c0c0;
            white-space: pre-wrap;
            background: rgba(255,255,255,0.015);
            padding: 28px;
            border-radius: 8px;
            border-right: 3px solid var(--accent);
        }

        .placeholder-message {
            text-align: center;
            margin-top: 100px;
            color: #555;
        }

        .placeholder-message h2 {
            font-family: 'Amiri', serif;
            font-size: 2rem;
            color: #444;
            margin-bottom: 12px;
        }

        .placeholder-message p {
            color: #555;
            font-size: 1rem;
        }

        .loading-state {
            text-align: center;
            margin-top: 60px;
            color: #555;
        }

        .loading-state .spinner {
            width: 32px;
            height: 32px;
            border: 2px solid var(--border);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 16px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .error-text {
            color: #aa5555;
            text-align: center;
            margin-top: 60px;
        }

        /* Scrollbar */
        .sidebar::-webkit-scrollbar { width: 4px; }
        .sidebar::-webkit-scrollbar-track { background: transparent; }
        .sidebar::-webkit-scrollbar-thumb { background: #2a2a2a; border-radius: 2px; }
        .sidebar::-webkit-scrollbar-thumb:hover { background: #3a3a3a; }

        /* Mobile */
        .mobile-toggle {
            display: none;
            position: fixed;
            bottom: 24px;
            left: 24px;
            z-index: 100;
            background: var(--accent);
            color: #000;
            border: none;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 4px 20px rgba(0,0,0,0.4);
            align-items: center;
            justify-content: center;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .mobile-toggle:hover {
            transform: scale(1.05);
            box-shadow: 0 6px 24px rgba(0,0,0,0.5);
        }

        .mobile-toggle svg {
            stroke: #000;
        }

        .overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.6);
            z-index: 40;
            backdrop-filter: blur(2px);
        }

        .overlay.active {
            display: block;
        }

        @media (max-width: 1024px) {
            .wiki-body {
                flex-direction: column;
            }
            .sidebar {
                position: fixed;
                right: -300px;
                top: 0;
                width: 300px;
                z-index: 50;
                transition: right 0.3s ease;
                box-shadow: -4px 0 20px rgba(0,0,0,0.3);
            }
            .sidebar.open {
                right: 0;
            }
            .main-content {
                padding: 24px;
                max-width: 100%;
            }
            .mobile-toggle {
                display: flex;
            }
            .article-title {
                font-size: 1.6rem;
            }
        }

        @media (max-width: 640px) {
            .main-content {
                padding: 16px;
            }
            .article-title {
                font-size: 1.4rem;
                gap: 10px;
            }
            .document-text {
                padding: 16px;
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>
    <div id="app">
        <div class="overlay" :class="{ active: sidebarOpen }" @click="sidebarOpen = false"></div>

        <div class="wiki-body">
            <!-- Sidebar -->
            <aside class="sidebar" :class="{ open: sidebarOpen }">
                <div class="sidebar-header">
                    <a href="index.html">
                        <span class="icon">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path></svg>
                        </span>
                        أرشيف مالينز
                    </a>
                </div>

                <div class="search-box">
                    <input 
                        type="text" 
                        v-model="searchQuery" 
                        placeholder="ابحث عن مقال..." 
                        class="search-input"
                    />
                    <span class="search-icon">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
                    </span>
                </div>

                <nav class="nav-list">
                    <div 
                        v-for="art in filteredArticles" 
                        :key="art.id"
                        :class="['nav-item', { active: activeId === art.id }]"
                        @click="selectArticle(art.id)"
                    >
                        {{ art.title }}
                    </div>
                    <div v-if="filteredArticles.length === 0" class="no-results">
                        لا توجد نتائج
                    </div>
                </nav>
            </aside>

            <!-- Main Content -->
            <main class="main-content">
                <div v-if="!activeArticle" class="placeholder-message">
                    <h2>مرحباً بك في الأرشيف</h2>
                    <p>اختر مقالاً من القائمة الجانبية للبدء</p>
                </div>

                <div v-else>
                    <div class="article-header">
                        <h1 class="article-title">
                            <span class="icon">
                                <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline></svg>
                            </span>
                            {{ activeArticle.title }}
                        </h1>
                        <div class="article-meta">
                            <span class="meta-item">
                                <span class="icon">
                                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
                                </span>
                                <span>وثيقة تاريخية</span>
                            </span>
                            <span class="meta-item">
                                <span class="icon">
                                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
                                </span>
                                <span>5 دقائق قراءة</span>
                            </span>
                        </div>
                    </div>

                    <div class="image-container">
                        <img 
                            :src="'/PNG/' + activeArticle.id + '.png'" 
                            @error="(e) => e.target.style.display='none'"
                            :alt="activeArticle.title"
                            loading="lazy"
                        />
                    </div>

                    <div v-if="activeArticle.content" class="document-text">
                        {{ activeArticle.content }}
                    </div>
                    <div v-else-if="loadingContent" class="loading-state">
                        <div class="spinner"></div>
                        <p>جارٍ تحميل الوثيقة...</p>
                    </div>
                    <div v-else class="error-text">
                        تعذر تحميل المحتوى لهذا المقال.
                    </div>
                </div>
            </main>
        </div>

        <button class="mobile-toggle" @click="sidebarOpen = !sidebarOpen">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
        </button>
    </div>

    <script>
        const { createApp, ref, computed, onMounted } = Vue;

        createApp({
            setup() {
                const articles = ref([
                    { id: '11001', title: 'معاهدة جين ستي', content: null },
                    { id: '11002', title: 'الحرب الهولندية اليابانية الألمانية : اغسطس 1906 - مارس 1907', content: null },
                    { id: '11003', title: 'الحرب الهولندية اليابانية الألمانية : مارس 1907 - يناير 1908', content: null },
                    { id: '11004', title: 'عملية إيكازوتشي: أكتوبر - ديسمبر 1904', content: null },
                    { id: '11005', title: 'عملية إيكازوتشي: يناير - مارس 1905', content: null },
                    { id: '11018', title: 'الحرب الكبرى : اكتوبر 1914 – يناير 1915', content: null },
                    { id: '11019', title: 'الحرب الكبرى : يناير 1915 – مايو 1915', content: null },
                    { id: '11020', title: 'الحرب الكبرى : مايو 1915 – اغسطس 1915', content: null },
                    { id: '11021', title: 'الحرب الكبرى : ابريل 1916 - اغسطس 1916', content: null },
                    { id: '11022', title: 'الحرب الكبرى : اغسطس 1916 - اكتوبر 1916', content: null },
                    { id: '11023', title: 'الحرب الكبرى : الغزو الأمريكي للمكسيك', content: null },
                    { id: '11024', title: 'حرب الخلافة الاسبانية الثانية', content: null },
                    { id: '11025', title: 'عودة الإمبراطورية الرومانية المقدسة', content: null },
                    { id: '11026', title: 'الحرب الكبرى : دخول الجيش الأمريكي لأوروبا 1917', content: null },
                    { id: '11027', title: 'انقلاب 1918 - روسيا', content: null },
                    { id: '11028', title: 'عملية بارباروسا : الامبراطورية الرومانية المقدسة', content: null },
                ]);

                const activeId = ref(null);
                const searchQuery = ref('');
                const loadingContent = ref(false);
                const sidebarOpen = ref(false);

                const filteredArticles = computed(() => {
                    const q = searchQuery.value.trim().toLowerCase();
                    if (!q) return articles.value;
                    return articles.value.filter(art => 
                        art.title.toLowerCase().includes(q)
                    );
                });

                const activeArticle = computed(() => {
                    return articles.value.find(a => a.id === activeId.value) || null;
                });

                const loadAllContents = async () => {
                    const promises = articles.value.map(async (article) => {
                        try {
                            const res = await fetch(`/TXT/${article.id}.txt`);
                            if (res.ok) {
                                article.content = await res.text();
                            } else {
                                article.content = '';
                            }
                        } catch (e) {
                            article.content = '';
                        }
                    });
                    await Promise.allSettled(promises);
                };

                const selectArticle = (id) => {
                    activeId.value = id;
                    sidebarOpen.value = false;
                    const art = articles.value.find(a => a.id === id);
                    if (art && art.content === null) {
                        loadingContent.value = true;
                        fetch(`/TXT/${id}.txt`)
                            .then(res => res.ok ? res.text() : '')
                            .then(text => {
                                art.content = text;
                                loadingContent.value = false;
                            })
                            .catch(() => {
                                art.content = '';
                                loadingContent.value = false;
                            });
                    }
                };

                onMounted(loadAllContents);

                return {
                    articles,
                    activeId,
                    searchQuery,
                    filteredArticles,
                    activeArticle,
                    loadingContent,
                    sidebarOpen,
                    selectArticle,
                };
            }
        }).mount('#app');
    </script>
</body>
</html>
