<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>أرشيف مالينز المركزي</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700;900&family=JetBrains+Mono&family=IBM+Plex+Sans+Arabic:wght@300;500&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root { --accent: #7f1d1d; }
        body { background: #050505; color: #d4d4d4; font-family: 'Cairo', sans-serif; }
        .article-card { border-bottom: 1px solid #1a1a1a; padding: 60px 0; }
        .document-text { 
            font-family: 'IBM Plex Sans Arabic', sans-serif; 
            white-space: pre-wrap; 
            background: #0a0a0a; 
            padding: 30px; 
            border-right: 4px solid var(--accent);
            line-height: 2;
            font-size: 1rem;
            color: #bcbcbc;
        }
    </style>
</head>
<body>
    <div id="app" class="max-w-4xl mx-auto px-6 py-10">
        
        <header class="mb-20 border-b border-white/5 pb-6">
            <h1 class="text-white font-black text-3xl uppercase tracking-tighter">Malines Wiki Archive</h1>
        </header>

        <div v-for="art in articles" :key="art.id" class="article-card">
            <h2 class="text-5xl font-black text-white mb-8 uppercase tracking-tighter">{{ art.title }}</h2>

            <div class="mb-10 bg-black p-1 border border-white/5">
                <img :src="'/PNG/' + art.id + '.png'" 
                     @error="(e) => e.target.style.display='none'"
                     class="w-full grayscale hover:grayscale-0 transition duration-700">
            </div>
            
            <pre v-if="art.content" class="document-text">{{ art.content }}</pre>
            <div v-else class="text-[10px] text-red-900 animate-pulse tracking-[0.2em] font-mono">RETRIEVING DATA...</div>
        </div>

    </div>

    <script>
        const { createApp, ref, onMounted } = Vue;

        createApp({
            setup() {
                
                // ==========================================================
                // 📂 [منطقة النشر] - أضف ملفاتك الجديدة هنا فقط!
                // ==========================================================
                const articles = ref([
                    { id: '11001', title: 'معاهدة جين ستي', content: null },
                    { id: '11002', title: 'المقالة الثانية', content: null },
                    
                    // لنشر مقال جديد، انسخ السطر التالي وضعه فوق هذا التعليق:
                    // { id: 'اسم_الملف', title: 'عنوان المقال المكتوب', content: null },
                ]);
                // ==========================================================


                // ⚙️ [دالة النشر التلقائي] - لا تلمس هذا الجزء
                const autoPublish = async () => {
                    for (let article of articles.value) {
                        try {
                            const res = await fetch(`/TXT/${article.id}.txt`);
                            if (res.ok) {
                                article.content = await res.text();
                            }
                        } catch (e) {
                            console.error("فشل جلب الوثيقة: " + article.id);
                        }
                    }
                };

                onMounted(autoPublish);

                return { articles };
            }
        }).mount('#app');
    </script>
</body>
</html>
