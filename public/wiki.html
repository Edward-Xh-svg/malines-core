<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Malines Wiki | الأرشيف المركزي</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root { --bg: #050505; --red: #7f1d1d; --border: #1a1a1a; }
        body { background: var(--bg); color: #a3a3a3; font-family: 'Inter', sans-serif; margin: 0; }
        .sidebar { background: #0a0a0a; border-left: 1px solid var(--border); transition: all 0.3s; }
        .nav-btn { border-right: 3px solid transparent; transition: 0.3s; text-align: right; }
        .nav-btn.active { background: #141414; border-right-color: var(--red); color: white; }
        .content-view { background: radial-gradient(circle at top right, #0d0202 0%, #050505 100%); }
        pre { white-space: pre-wrap; font-family: inherit; line-height: 1.8; color: #d4d4d4; margin: 0; }
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-thumb { background: var(--red); }
    </style>
</head>
<body class="h-screen flex flex-col md:flex-row overflow-hidden">

    <div id="app" class="flex flex-col md:flex-row w-full h-full">
        
        <aside class="sidebar w-full md:w-80 flex flex-col shrink-0 z-10">
            <div class="p-6 border-b border-[#1a1a1a]">
                <h2 class="text-white font-black tracking-widest text-xs mb-1 uppercase">Malines Intelligence</h2>
                <p class="text-[9px] text-neutral-600 uppercase tracking-tighter">Database Access Terminal</p>
            </div>
            
            <nav class="flex-grow overflow-y-auto p-3 space-y-1">
                <div v-if="loadingList" class="text-neutral-600 text-[10px] p-4 animate-pulse">جاري فحص قاعدة البيانات...</div>
                
                <div v-if="error" class="text-red-900 text-[10px] p-4 border border-red-900/20 bg-red-900/5">
                    فشل الاتصال بالنظام الأرشيفي. 
                    <button @click="fetchArticles" class="underline block mt-2">إعادة المحاولة</button>
                </div>

                <button 
                    v-for="art in articles" 
                    :key="art.id"
                    @click="loadArticle(art)"
                    :class="['nav-btn w-full p-4 text-xs font-bold uppercase tracking-tight', activeId === art.id ? 'active' : 'text-neutral-500 hover:text-neutral-300']"
                >
                    {{ art.title }}
                </button>
            </nav>

            <div class="p-4 border-t border-[#1a1a1a]">
                <a href="index.html" class="block text-center text-[10px] text-neutral-600 hover:text-red-700 transition font-bold uppercase">RETURN TO COMMAND</a>
            </div>
        </aside>

        <main class="flex-grow overflow-y-auto content-view p-6 md:p-16 relative">
            <div v-if="loadingArticle" class="absolute inset-0 bg-black/60 flex items-center justify-center z-20">
                <div class="w-6 h-6 border-2 border-red-900 border-t-red-500 rounded-full animate-spin"></div>
            </div>

            <div v-if="current" class="max-w-4xl mx-auto">
                <header class="mb-12">
                    <div class="w-12 h-1 bg-red-900 mb-6"></div>
                    <h1 class="text-4xl md:text-6xl font-black text-white uppercase tracking-tighter leading-none mb-4">
                        {{ current.title }}
                    </h1>
                </header>

                <div v-if="!imageError" class="mb-12 border border-neutral-900 p-1 bg-black shadow-2xl">
                    <img :src="'/PNG/' + current.id + '.png'" @error="imageError = true" class="w-full grayscale opacity-60 hover:grayscale-0 hover:opacity-100 transition duration-1000">
                </div>

                <article class="text-neutral-400 text-lg leading-relaxed">
                    <pre>{{ content }}</pre>
                </article>
            </div>

            <div v-else-if="!loadingList" class="h-full flex flex-col items-center justify-center opacity-20">
                <div class="w-20 h-20 border border-neutral-800 rounded-full flex items-center justify-center mb-4">
                    <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path></svg>
                </div>
                <span class="text-[10px] tracking-[1em] uppercase">Security Level 4 Required</span>
            </div>
        </main>
    </div>

    <script>
        const { createApp, ref, onMounted } = Vue;
        createApp({
            setup() {
                const articles = ref([]);
                const current = ref(null);
                const content = ref('');
                const activeId = ref('');
                const loadingList = ref(false);
                const loadingArticle = ref(false);
                const imageError = ref(false);
                const error = ref(false);

                // جلب قائمة المقالات
                const fetchArticles = async () => {
                    loadingList.value = true;
                    error.value = false;
                    try {
                        const res = await fetch('/api/articles');
                        if (!res.ok) throw new Error("Network response was not ok");
                        const data = await res.json();
                        articles.value = data;
                        if (data.length === 0) error.value = true;
                    } catch (e) {
                        console.error("Archive fetch error:", e);
                        error.value = true;
                    } finally {
                        loadingList.value = false;
                    }
                };

                // جلب محتوى مقالة محددة
                const loadArticle = async (art) => {
                    if (activeId.value === art.id) return;
                    
                    loadingArticle.value = true;
                    imageError.value = false;
                    activeId.value = art.id;
                    
                    try {
                        const res = await fetch(`/TXT/${art.id}.txt`);
                        if (!res.ok) throw new Error("File not found");
                        content.value = await res.text();
                        current.value = art;
                    } catch (e) {
                        content.value = "تحذير: تعذر فك تشفير الوثيقة. الملف قد يكون مفقوداً أو تالفاً.";
                        current.value = art; // نبقي العنوان ظاهراً
                    } finally {
                        loadingArticle.value = false;
                    }
                };

                onMounted(fetchArticles);
                
                return { 
                    articles, current, content, activeId, 
                    loadingList, loadingArticle, imageError, error, 
                    loadArticle, fetchArticles 
                };
            }
        }).mount('#app');
    </script>
</body>
</html>
