<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>أرشيف مالينز المركزي</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700;900&family=JetBrains+Mono&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: #050505; color: #d4d4d4; font-family: 'Cairo', sans-serif; }
        .article-card { border-bottom: 1px solid #1a1a1a; padding: 60px 0; }
        .document-text { 
            font-family: 'JetBrains Mono', monospace; 
            white-space: pre-wrap; 
            background: #0a0a0a; 
            padding: 25px; 
            border-right: 4px solid #7f1d1d;
            line-height: 1.8;
            font-size: 0.95rem;
        }
    </style>
</head>
<body>
    <div id="app" class="max-w-4xl mx-auto px-6 py-10">
        
        <header class="mb-20 border-b border-white/5 pb-6">
            <h1 class="text-white font-black text-3xl uppercase tracking-tighter">Malines Wiki Archive</h1>
        </header>

        <div v-for="art in articles" :key="art.id" class="article-card">
            <h2 class="text-5xl font-black text-white mb-8 uppercase tracking-tighter">{{ art.title }}</h2>

            <div class="mb-10 bg-black p-1 border border-white/5">
                <img :src="'/PNG/' + art.id + '.png'" 
                     @error="(e) => e.target.style.display='none'"
                     class="w-full grayscale hover:grayscale-0 transition duration-700">
            </div>
            
            <pre v-if="art.content" class="document-text">{{ art.content }}</pre>
            <div v-else class="text-xs text-red-900 animate-pulse">جاري سحب الوثيقة...</div>
        </div>

    </div>

    <script>
        const { createApp, ref, onMounted } = Vue;
        createApp({
            setup() {
                // أضف أسماء ملفاتك هنا يدوياً (هذا أضمن وأسرع حل)
                const articles = ref([
                    { id: '11001', title: 'سجل العمليات الأول' },
                    { id: '11002', title: 'تقرير المنطقة المركزية' }
                    // كلما أضفت ملفاً جديداً في المجلد، أضف سطر هنا فقط
                ]);

                onMounted(() => {
                    // جلب النصوص مباشرة
                    articles.value.forEach(async (item, index) => {
                        try {
                            const res = await fetch(`/TXT/${item.id}.txt`);
                            if (res.ok) {
                                articles.value[index].content = await res.text();
                            }
                        } catch (e) { console.error("Error loading:", item.id); }
                    });
                });

                return { articles };
            }
        }).mount('#app');
    </script>
</body>
</html>
