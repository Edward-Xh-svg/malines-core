<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>أرشيف مالينز المركزي</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700;900&family=JetBrains+Mono&family=IBM+Plex+Sans+Arabic:wght@300;500&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root { --accent: #7f1d1d; }
        body { background: #050505; color: #d4d4d4; font-family: 'Cairo', sans-serif; }
        
        .article-card { border-bottom: 1px solid #1a1a1a; padding: 60px 0; }
        
        /* التعديل الجديد على الخط هنا */
        .document-text { 
            font-family: 'IBM Plex Sans Arabic', 'JetBrains Mono', monospace; 
            font-weight: 300; /* وزن خفيف يعطي طاقة تقنية */
            white-space: pre-wrap; 
            background: #0a0a0a; 
            padding: 30px; 
            border-right: 4px solid var(--accent);
            line-height: 2; /* زيادة التباعد بين الأسطر لراحة العين */
            font-size: 1rem;
            color: #bcbcbc;
            box-shadow: inset 0 0 30px rgba(0,0,0,0.5);
            letter-spacing: 0.01em;
        }

        /* لمسة جمالية للصور عند المرور عليها */
        .img-frame {
            border: 1px solid #1a1a1a;
            padding: 4px;
            background: #000;
            transition: border-color 0.5s;
        }
        .img-frame:hover { border-color: var(--accent); }
    </style>
</head>
<body>
    <div id="app" class="max-w-4xl mx-auto px-6 py-10">
        
        <header class="mb-20 border-b border-white/5 pb-6 flex justify-between items-end">
            <h1 class="text-white font-black text-3xl uppercase tracking-tighter">Malines Wiki Archive</h1>
            <span class="text-[10px] text-neutral-600 font-mono">Terminal v3.1</span>
        </header>

        <div v-for="art in articles" :key="art.id" class="article-card">
            <h2 class="text-5xl font-black text-white mb-8 uppercase tracking-tighter">{{ art.title }}</h2>

            <div class="mb-10 img-frame">
                <img :src="'/PNG/' + art.id + '.png'" 
                     @error="(e) => e.target.style.display='none'"
                     class="w-full grayscale hover:grayscale-0 transition duration-1000">
            </div>
            
            <pre v-if="art.content" class="document-text">{{ art.content }}</pre>
            <div v-else class="text-xs text-red-900 animate-pulse font-mono uppercase tracking-[0.3em]">
                Decryption in progress...
            </div>
        </div>

    </div>

    <script>
        const { createApp, ref, onMounted } = Vue;
        createApp({
            setup() {
                const articles = ref([
                    { id: '11001', title: 'سجل العمليات الأول' },
                    { id: '11002', title: 'تقرير المنطقة المركزية' }
                ]);

                onMounted(() => {
                    articles.value.forEach(async (item, index) => {
                        try {
                            const res = await fetch(`/TXT/${item.id}.txt`);
                            if (res.ok) {
                                articles.value[index].content = await res.text();
                            }
                        } catch (e) { console.error("Error loading:", item.id); }
                    });
                });

                return { articles };
            }
        }).mount('#app');
    </script>
</body>
</html>
