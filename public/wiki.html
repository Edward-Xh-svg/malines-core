<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Malines Wiki | الأرشيف</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root { --bg: #050505; --red: #7f1d1d; --border: #1a1a1a; }
        body { background: var(--bg); color: #a3a3a3; font-family: 'Inter', sans-serif; }
        .sidebar { background: #0a0a0a; border-left: 1px solid var(--border); }
        .nav-btn { border-right: 3px solid transparent; transition: 0.3s; }
        .nav-btn.active { background: #141414; border-right-color: var(--red); color: white; }
        .content-view { background: radial-gradient(circle at top right, #0d0202 0%, #050505 100%); }
        pre { white-space: pre-wrap; font-family: inherit; line-height: 1.8; color: #d4d4d4; }
        /* شريط تمرير احترافي */
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-thumb { background: var(--red); }
    </style>
</head>
<body class="h-screen flex flex-col md:flex-row overflow-hidden">

    <div id="app" class="flex flex-col md:flex-row w-full h-full">
        
        <aside class="sidebar w-full md:w-80 flex flex-col shrink-0">
            <div class="p-6 border-b border-[#1a1a1a]">
                <h2 class="text-white font-black tracking-widest text-xs mb-1 uppercase">Malines Intelligence</h2>
                <p class="text-[9px] text-neutral-600 uppercase">Database Access Terminal</p>
            </div>
            
            <nav class="flex-grow overflow-y-auto p-3 space-y-1">
                <div v-if="error" class="text-red-900 text-[10px] p-4 border border-red-900/20 bg-red-900/5">
                    خطأ في الاتصال بالنظام الأرشيفي. تأكد من وجود ملفات في مجلد TXT.
                </div>
                <button 
                    v-for="art in articles" 
                    @click="loadArticle(art)"
                    :class="['nav-btn w-full text-right p-4 text-xs font-bold uppercase tracking-tight', activeId === art.id ? 'active' : 'text-neutral-500 hover:text-neutral-300']"
                >
                    {{ art.title }}
                </button>
            </nav>

            <div class="p-4 border-t border-[#1a1a1a]">
                <a href="index.html" class="block text-center text-[10px] text-neutral-600 hover:text-red-700 transition font-bold">RETURN TO COMMAND</a>
            </div>
        </aside>

        <main class="flex-grow overflow-y-auto content-view p-6 md:p-16">
            <div v-if="loading" class="h-full flex items-center justify-center">
                <div class="w-6 h-6 border-2 border-red-900 border-t-red-500 rounded-full animate-spin"></div>
            </div>

            <div v-else-if="current" class="max-w-4xl mx-auto">
                <header class="mb-12">
                    <div class="w-12 h-1 bg-red-900 mb-6"></div>
                    <h1 class="text-4xl md:text-6xl font-black text-white uppercase tracking-tighter leading-none mb-4">
                        {{ current.title }}
                    </h1>
                </header>

                <div v-if="!imageError" class="mb-12 border border-neutral-900 p-1 bg-black">
                    <img :src="'/PNG/' + current.id + '.png'" @error="imageError = true" class="w-full grayscale opacity-70 hover:grayscale-0 hover:opacity-100 transition duration-700">
                </div>

                <article class="prose prose-invert max-w-none">
                    <pre>{{ content }}</pre>
                </article>
            </div>

            <div v-else class="h-full flex flex-col items-center justify-center border border-[#111] m-4 opacity-20">
                <span class="text-[10px] tracking-[1em] uppercase">No File Selected</span>
            </div>
        </main>
    </div>

    <script>
        const { createApp, ref, onMounted } = Vue;
        createApp({
            setup() {
                const articles = ref([]);
                const current = ref(null);
                const content = ref('');
                const activeId = ref('');
                const loading = ref(false);
                const imageError = ref(false);
                const error = ref(false);

                const fetchArticles = async () => {
                    try {
                        const res = await fetch('/api/articles');
                        if (!res.ok) throw new Error();
                        articles.value = await res.json();
                        error.value = articles.value.length === 0;
                    } catch (e) {
                        error.value = true;
                    }
                };

                const loadArticle = async (art) => {
                    loading.value = true;
                    imageError.value = false;
                    activeId.value = art.id;
                    try {
                        const res = await fetch(`/TXT/${art.id}.txt`);
                        content.value = await res.text();
                        current.value = art;
                    } catch (e) {
                        content.value = "فشل تحميل الوثيقة.";
                    }
                    loading.value = false;
                };

                onMounted(fetchArticles);
                return { articles, current, content, activeId, loading, imageError, error, loadArticle };
            }
        }).mount('#app');
    </script>
</body>
</html>
