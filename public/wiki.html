<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Malines Wiki | الموسوعة المعرفية</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: #0b0f1a;
            color: #e2e8f0;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }
        .article-card {
            background: #161e2d;
            border: 1px solid #2d3748;
            transition: transform 0.2s, border-color 0.2s;
        }
        .article-card:hover {
            border-color: #3b82f6;
            transform: translateY(-2px);
        }
        .sidebar {
            border-left: 1px solid #1e293b;
        }
        pre {
            white-space: pre-wrap;
            word-wrap: break-word;
            font-family: inherit;
        }
    </style>
</head>
<body>
    <div id="app" class="flex flex-col md:flex-row min-h-screen">
        
        <aside class="w-full md:w-80 sidebar p-6 bg-[#0f172a]">
            <div class="mb-8">
                <a href="index.html" class="text-blue-400 hover:text-blue-300 text-sm flex items-center gap-2 mb-4">
                    <span>← العودة للرئيسية</span>
                </a>
                <h2 class="text-xl font-bold border-b border-blue-900 pb-2">فهرس المقالات</h2>
            </div>
            
            <nav class="space-y-2">
                <button 
                    v-for="article in articles" 
                    :key="article.id"
                    @click="loadArticle(article)"
                    :class="['w-full text-right p-3 rounded-lg transition text-sm', 
                             currentArticle?.id === article.id ? 'bg-blue-600 text-white' : 'hover:bg-gray-800 text-slate-400']"
                >
                    {{ article.title }}
                </button>
            </nav>
        </aside>

        <main class="flex-grow p-6 md:p-12 overflow-y-auto">
            <div v-if="currentArticle" class="max-w-4xl mx-auto">
                <header class="mb-8">
                    <h1 class="text-4xl font-extrabold mb-4">{{ currentArticle.title }}</h1>
                    <div class="h-1 w-20 bg-blue-600"></div>
                </header>

                <div class="mb-8 rounded-xl overflow-hidden border border-gray-700 shadow-2xl">
                    <img 
                        :src="`../PNG/${currentArticle.id}.png`" 
                        :alt="currentArticle.title"
                        @error="handleImageError"
                        class="w-full object-cover max-h-[400px]"
                    >
                </div>

                <article class="prose prose-invert max-w-none text-slate-300 leading-relaxed text-lg">
                    <pre class="bg-transparent border-none p-0">{{ currentContent }}</pre>
                </article>
            </div>

            <div v-else class="h-full flex items-center justify-center text-slate-500">
                <div class="text-center">
                    <svg class="mx-auto mb-4 w-12 h-12 opacity-20" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.75 0 3.332.477 4.5 1.253v13C19.832 18.477 18.246 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"></path></svg>
                    <p>الرجاء اختيار مقالة من القائمة لعرض المحتوى</p>
                </div>
            </div>
        </main>
    </div>

    <script>
        const { createApp, ref, onMounted } = Vue;

        createApp({
            setup() {
                const currentArticle = ref(null);
                const currentContent = ref('');
                
                // هنا نضع أسماء الملفات التي تريد عرضها
                // في العادة يتم جلب هذه القائمة من السيرفر، لكن بناءً على طلبك سنحددها هنا لتطابق المجلدات
                const articles = ref([
                    { id: 'updates-new-system', title: 'تحديثات النظام الجديد' },
                    { id: 'beginners-guide', title: 'دليل المبتدئين للمحاكاة' },
                    { id: 'first-tournament', title: 'البطولة الجيوسياسية الأولى' }
                ]);

                const loadArticle = async (article) => {
                    currentArticle.value = article;
                    try {
                        const response = await fetch(`../TXT/${article.id}.txt`);
                        if (response.ok) {
                            currentContent.value = await response.text();
                        } else {
                            currentContent.value = "تعذر تحميل محتوى المقالة.";
                        }
                    } catch (error) {
                        currentContent.value = "خطأ في الاتصال بالسيرفر.";
                    }
                };

                const handleImageError = (e) => {
                    // إخفاء الصورة في حال عدم وجودها لمنع ظهور أيقونة الخطأ
                    e.target.style.display = 'none';
                };

                onMounted(() => {
                    // تحميل أول مقالة تلقائياً عند الفتح
                    if (articles.value.length > 0) {
                        loadArticle(articles.value[0]);
                    }
                });

                return {
                    articles,
                    currentArticle,
                    currentContent,
                    loadArticle,
                    handleImageError
                };
            }
        }).mount('#app');
    </script>
</body>
</html>
