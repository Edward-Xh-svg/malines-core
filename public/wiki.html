    <style>
        :root {
            --black: #050505;
            --dark: #0a0a0a;
            --card: #101012;
            --card-2: #0c0c0d;
            --border: #242426;
            --border-soft: rgba(255,255,255,0.08);
            --text: #ececec;
            --muted: #8f8f8f;
            --muted-2: #6f6f6f;
            --red: #c0392b;
            --red-hover: #e74c3c;
            --accent: #d4af37;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            background:
                radial-gradient(circle at 18% 12%, rgba(192,57,43,0.10), transparent 22%),
                radial-gradient(circle at 82% 16%, rgba(212,175,55,0.05), transparent 18%),
                radial-gradient(circle at 50% 88%, rgba(255,255,255,0.03), transparent 24%),
                var(--black);
            color: var(--text);
            font-family: 'Cairo', sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
            text-rendering: optimizeLegibility;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
            opacity: 0.55;
            background:
                radial-gradient(1px 1px at 12% 18%, rgba(255,255,255,0.12), transparent),
                radial-gradient(1px 1px at 78% 28%, rgba(255,255,255,0.08), transparent),
                radial-gradient(1.5px 1.5px at 42% 72%, rgba(255,255,255,0.10), transparent),
                radial-gradient(1px 1px at 70% 10%, rgba(255,255,255,0.07), transparent),
                radial-gradient(1px 1px at 25% 85%, rgba(255,255,255,0.06), transparent);
            animation: starsMove 38s linear infinite;
        }

        @keyframes starsMove {
            from { transform: translateY(0); }
            to { transform: translateY(-30px); }
        }

        .topbar {
            position: sticky;
            top: 0;
            left: 0;
            right: 0;
            height: 68px;
            background: rgba(5,5,5,0.58);
            backdrop-filter: blur(28px);
            -webkit-backdrop-filter: blur(28px);
            border-bottom: 1px solid rgba(255,255,255,0.04);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 32px;
            z-index: 100;
            flex-shrink: 0;
        }

        .topbar-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .topbar-logo {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            object-fit: cover;
            border: 1px solid rgba(255,255,255,0.10);
            box-shadow: 0 0 14px rgba(255,255,255,0.07);
        }

        .topbar-title {
            font-weight: 800;
            font-size: 1.1rem;
            color: #fff;
            letter-spacing: -0.3px;
            text-decoration: none;
            background: linear-gradient(135deg, #ffffff 0%, #d0d0d0 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .topbar-title:hover {
            color: var(--accent);
        }

        .topbar-right {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .btn-login {
            display: flex;
            align-items: center;
            gap: 7px;
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.15);
            color: #d7d7d7;
            padding: 8px 20px;
            border-radius: 999px;
            cursor: pointer;
            font-size: 0.85rem;
            font-family: 'Cairo', sans-serif;
            transition: all 0.25s ease;
            white-space: nowrap;
            backdrop-filter: blur(10px);
        }

        .btn-login:hover {
            border-color: rgba(255,255,255,0.30);
            color: #fff;
            background: rgba(255,255,255,0.06);
            transform: translateY(-1px);
            box-shadow: 0 8px 24px rgba(192,57,43,0.12);
        }

        .user-badge {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background: linear-gradient(135deg, #ffffff 0%, #e6e6e6 100%);
            color: #000;
            font-weight: 800;
            font-size: 1.05rem;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            border: 2px solid rgba(255,255,255,0.18);
            transition: all 0.25s ease;
            position: relative;
            box-shadow: 0 0 18px rgba(255,255,255,0.10);
        }

        .user-badge:hover {
            transform: scale(1.05);
            box-shadow: 0 0 26px rgba(255,255,255,0.18);
        }

        .user-dropdown {
            position: absolute;
            top: 52px;
            left: 0;
            background: rgba(10,10,10,0.96);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 8px 0;
            min-width: 180px;
            opacity: 0;
            visibility: hidden;
            transform: translateY(-8px);
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 10;
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
        }

        .user-dropdown.show {
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
        }

        .user-dropdown .dropdown-name {
            padding: 8px 16px;
            color: var(--muted);
            font-size: 0.8rem;
            border-bottom: 1px solid var(--border);
            margin-bottom: 4px;
        }

        .user-dropdown button {
            display: block;
            width: 100%;
            text-align: right;
            padding: 10px 16px;
            background: none;
            border: none;
            color: #ccc;
            cursor: pointer;
            font-family: 'Cairo', sans-serif;
            font-size: 0.9rem;
            transition: all 0.2s;
        }

        .user-dropdown button:hover {
            background: rgba(255,255,255,0.04);
            color: #fff;
        }

        .wiki-shell {
            position: relative;
            z-index: 1;
            display: flex;
            flex: 1;
            min-height: calc(100vh - 68px);
            width: 100%;
        }

        .sidebar {
            width: 320px;
            background: rgba(10,10,11,0.985);
            border-left: 1px solid rgba(255,255,255,0.05);
            padding: 18px 0 20px;
            height: calc(100vh - 68px);
            overflow-y: auto;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.03);
        }

        .sidebar-header {
            padding: 0 20px 16px;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 800;
            font-size: 1.05rem;
            color: #f0f0f0;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }

        .sidebar-header .icon {
            color: var(--accent);
            opacity: 0.9;
            flex-shrink: 0;
        }

        .search-box {
            padding: 0 20px;
            margin-bottom: 16px;
            position: relative;
        }

        .search-input {
            width: 100%;
            padding: 11px 12px 11px 40px;
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.10);
            border-radius: 12px;
            color: #ddd;
            font-family: 'Cairo', sans-serif;
            font-size: 0.9rem;
            box-sizing: border-box;
            transition: border-color 0.2s, box-shadow 0.2s, background 0.2s;
        }

        .search-input:focus {
            border-color: rgba(255,255,255,0.22);
            outline: none;
            background: rgba(255,255,255,0.06);
            box-shadow: 0 0 0 3px rgba(192,57,43,0.08);
        }

        .search-input::placeholder {
            color: #5d5d5d;
        }

        .search-icon {
            position: absolute;
            right: 34px;
            top: 50%;
            transform: translateY(-50%);
            color: #666;
            pointer-events: none;
            transition: color 0.2s;
        }

        .search-box:focus-within .search-icon {
            color: var(--red-hover);
        }

        .nav-list {
            list-style: none;
            padding: 0 12px 0 12px;
            margin: 0;
            flex: 1;
            overflow-y: auto;
        }

        .nav-item {
            display: block;
            padding: 12px 14px;
            margin: 4px 0;
            border-radius: 12px;
            color: #b6b6b6;
            text-decoration: none;
            transition: all 0.2s ease;
            cursor: pointer;
            font-size: 0.88rem;
            border-right: 2px solid transparent;
            line-height: 1.55;
            background: rgba(255,255,255,0.015);
            border: 1px solid rgba(255,255,255,0.04);
        }

        .nav-item:hover {
            background: rgba(255,255,255,0.05);
            color: #ffffff;
            border-right-color: rgba(192,57,43,0.75);
            border-color: rgba(255,255,255,0.08);
            transform: translateX(-2px);
        }

        .nav-item.active {
            background: rgba(255,255,255,0.07);
            color: #fff;
            border-right-color: var(--red);
            border-color: rgba(255,255,255,0.10);
            font-weight: 700;
            box-shadow: inset 0 0 0 1px rgba(255,255,255,0.03);
        }

        .no-results {
            color: #616161;
            padding: 14px;
            font-size: 0.85rem;
            text-align: center;
        }

        .main-content {
            flex: 1;
            padding: 34px 48px;
            max-width: 980px;
            margin: 0 auto;
            width: 100%;
            overflow-y: auto;
            position: relative;
        }

        .main-content::before {
            content: '';
            position: absolute;
            inset: 0;
            pointer-events: none;
            background: radial-gradient(circle at top center, rgba(192,57,43,0.05), transparent 40%);
            opacity: 0.55;
        }

        .article-header {
            margin-bottom: 30px;
            position: relative;
            z-index: 1;
        }

        .article-title {
            font-family: 'Amiri', serif;
            font-weight: 700;
            font-size: 2.2rem;
            color: #f4f4f4;
            border-bottom: 1px solid rgba(255,255,255,0.08);
            padding-bottom: 16px;
            margin: 0 0 16px;
            display: flex;
            align-items: center;
            gap: 14px;
            line-height: 1.35;
        }

        .article-title .icon {
            color: var(--red);
            opacity: 0.85;
            flex-shrink: 0;
        }

        .article-meta {
            display: flex;
            gap: 22px;
            color: #6f6f6f;
            font-size: 0.85rem;
            flex-wrap: wrap;
        }

        .meta-item {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .image-container {
            margin-bottom: 30px;
            border-radius: 18px;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.08);
            background:
                linear-gradient(180deg, rgba(255,255,255,0.03), rgba(255,255,255,0.012)),
                #0f0f10;
            position: relative;
            z-index: 1;
            box-shadow: 0 20px 50px rgba(0,0,0,0.22);
        }

        .image-container img {
            width: 100%;
            display: block;
            filter: grayscale(0.15) contrast(1.03);
            transition: filter 0.5s ease, transform 0.5s ease;
        }

        .image-container img:hover {
            filter: grayscale(0) contrast(1.06);
            transform: scale(1.01);
        }

        .document-text {
            font-family: 'Amiri', serif;
            line-height: 2.45;
            font-size: 1.15rem;
            color: #c6c6c6;
            white-space: pre-wrap;
            background: linear-gradient(180deg, rgba(255,255,255,0.015), rgba(255,255,255,0.008));
            padding: 30px;
            border-radius: 18px;
            border: 1px solid rgba(255,255,255,0.07);
            border-right: 3px solid var(--red);
            position: relative;
            z-index: 1;
            box-shadow: 0 16px 40px rgba(0,0,0,0.18);
        }

        .placeholder-message {
            text-align: center;
            margin-top: 100px;
            color: #686868;
            position: relative;
            z-index: 1;
        }

        .placeholder-message h2 {
            font-family: 'Amiri', serif;
            font-size: 2rem;
            color: #dedede;
            margin-bottom: 12px;
        }

        .loading-state {
            text-align: center;
            margin-top: 60px;
            color: #686868;
            position: relative;
            z-index: 1;
        }

        .spinner {
            width: 32px;
            height: 32px;
            border: 2px solid rgba(255,255,255,0.08);
            border-top-color: var(--red);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 16px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .error-text {
            color: #aa6666;
            text-align: center;
            margin-top: 60px;
            position: relative;
            z-index: 1;
        }

        .modal-backdrop {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 200;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
            padding: 20px;
        }

        .modal-backdrop.active {
            opacity: 1;
            visibility: visible;
        }

        .modal-box {
            background: linear-gradient(180deg, rgba(18,18,19,0.98), rgba(13,13,14,0.98));
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 24px;
            padding: 36px 30px;
            width: 100%;
            max-width: 420px;
            position: relative;
            text-align: right;
            transform: translateY(10px) scale(0.98);
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 30px 60px rgba(0,0,0,0.6);
        }

        .modal-box::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 24px;
            background: radial-gradient(circle at top right, rgba(192,57,43,0.08), transparent 40%);
            pointer-events: none;
        }

        .modal-backdrop.active .modal-box {
            transform: translateY(0) scale(1);
        }

        .modal-box h2 {
            font-size: 1.5rem;
            margin-bottom: 28px;
            color: #fff;
            font-weight: 800;
            position: relative;
            z-index: 1;
        }

        .modal-close {
            position: absolute;
            top: 16px;
            left: 16px;
            width: 36px;
            height: 36px;
            background: none;
            border: none;
            color: #888;
            cursor: pointer;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            z-index: 2;
        }

        .modal-close:hover {
            color: #fff;
            background: rgba(255,255,255,0.05);
        }

        .form-group {
            margin-bottom: 20px;
            position: relative;
            z-index: 1;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #aaa;
            font-size: 0.9rem;
            font-weight: 500;
        }

        .form-group input {
            width: 100%;
            padding: 14px 16px;
            background: #1a1a1a;
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 12px;
            color: #fff;
            font-family: 'Cairo', sans-serif;
            font-size: 0.95rem;
            transition: border-color 0.3s, box-shadow 0.3s;
        }

        .form-group input:focus {
            outline: none;
            border-color: rgba(255,255,255,0.25);
            box-shadow: 0 0 0 3px rgba(255,255,255,0.05);
        }

        .form-error {
            color: var(--red-hover);
            font-size: 0.85rem;
            margin-bottom: 16px;
            display: none;
            align-items: center;
            gap: 8px;
            background: rgba(192,57,43,0.1);
            padding: 10px 14px;
            border-radius: 8px;
            position: relative;
            z-index: 1;
        }

        .form-error.show { display: flex; }

        .btn-submit {
            width: 100%;
            padding: 14px;
            background: #fff;
            border: none;
            color: #000;
            font-weight: 700;
            font-size: 1rem;
            border-radius: 12px;
            cursor: pointer;
            font-family: 'Cairo', sans-serif;
            transition: all 0.3s ease;
            margin-top: 12px;
            letter-spacing: 0.5px;
            position: relative;
            z-index: 1;
        }

        .btn-submit:hover {
            background: #e0e0e0;
            box-shadow: 0 8px 25px rgba(255,255,255,0.1);
        }

        .btn-submit:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            background: #555;
            color: #999;
        }

        .mobile-toggle {
            display: none;
            position: fixed;
            bottom: 24px;
            left: 24px;
            z-index: 100;
            background: linear-gradient(135deg, var(--red), #8f2319);
            color: #fff;
            border: none;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 8px 24px rgba(0,0,0,0.42);
            align-items: center;
            justify-content: center;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .mobile-toggle:hover {
            transform: scale(1.05);
            box-shadow: 0 10px 28px rgba(0,0,0,0.5);
        }

        .overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.6);
            z-index: 40;
            backdrop-filter: blur(2px);
        }

        .overlay.active {
            display: block;
        }

        .sidebar::-webkit-scrollbar { width: 4px; }
        .sidebar::-webkit-scrollbar-track { background: transparent; }
        .sidebar::-webkit-scrollbar-thumb { background: #2a2a2a; border-radius: 2px; }

        @media (max-width: 1024px) {
            .wiki-shell {
                flex-direction: column;
            }

            .sidebar {
                position: fixed;
                right: -320px;
                top: 68px;
                width: 320px;
                z-index: 50;
                height: calc(100vh - 68px);
                transition: right 0.3s ease;
                box-shadow: -4px 0 20px rgba(0,0,0,0.3);
            }

            .sidebar.open {
                right: 0;
            }

            .main-content {
                padding: 24px;
                max-width: 100%;
            }

            .mobile-toggle {
                display: flex;
            }

            .article-title {
                font-size: 1.6rem;
            }
        }

        @media (max-width: 640px) {
            .topbar { padding: 0 16px; height: 58px; }
            .topbar-title { font-size: 1rem; }
            .btn-login span { display: none; }
            .btn-login { padding: 8px 14px; }
            .wiki-shell { min-height: calc(100vh - 58px); }
            .sidebar { top: 58px; height: calc(100vh - 58px); width: 290px; right: -290px; }
            .main-content { padding: 16px; }
            .article-title { font-size: 1.4rem; gap: 10px; }
            .document-text { padding: 18px; font-size: 1rem; border-radius: 16px; }
            .image-container { border-radius: 16px; }
            .archive-card { padding: 18px; }
        }
    </style>
</head>
<body>

    <header class="topbar">
        <div class="topbar-left">
            <img src="malines-icon.png" alt="Malines" class="topbar-logo" onerror="this.style.display='none'">
            <a href="index.html" class="topbar-title">مجتمع مالينز</a>
        </div>
        <div class="topbar-right">
            <button id="btnLogin" class="btn-login" onclick="openModal()">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4M10 17l5-5-5-5M13.8 12H3"/></svg>
                <span>تسجيل الدخول</span>
            </button>

            <div id="userBadge" class="user-badge" style="display: none;" onclick="toggleDropdown()">
                <span id="userInitial"></span>
                <div id="userDropdown" class="user-dropdown">
                    <div class="dropdown-name" id="dropdownUsername"></div>
                    <button onclick="handleLogout()">تسجيل الخروج</button>
                </div>
            </div>
        </div>
    </header>

    <div id="app">
        <div class="overlay" :class="{ active: sidebarOpen }" @click="sidebarOpen = false"></div>

        <div class="wiki-shell">
            <aside class="sidebar" :class="{ open: sidebarOpen }">
                <div class="sidebar-header">
                    <span class="icon">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path></svg>
                    </span>
                    أرشيف مالينز
                </div>

                <div class="search-box">
                    <input 
                        type="text" 
                        v-model="searchQuery" 
                        placeholder="ابحث عن مقال..." 
                        class="search-input"
                    />
                    <span class="search-icon">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
                    </span>
                </div>

                <nav class="nav-list">
                    <div 
                        v-for="art in filteredArticles" 
                        :key="art.id"
                        :class="['nav-item', { active: activeId === art.id }]"
                        @click="selectArticle(art.id)"
                    >
                        {{ art.title }}
                    </div>
                    <div v-if="filteredArticles.length === 0" class="no-results">
                        لا توجد نتائج
                    </div>
                </nav>
            </aside>

            <main class="main-content">
                <div v-if="!activeArticle" class="placeholder-message">
                    <h2>مرحباً بك في الأرشيف</h2>
                    <p>اختر مقالاً من القائمة الجانبية للبدء</p>
                </div>

                <div v-else>
                    <div class="article-header">
                        <h1 class="article-title">
                            <span class="icon">
                                <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline></svg>
                            </span>
                            {{ activeArticle.title }}
                        </h1>
                        <div class="article-meta">
                            <span class="meta-item">
                                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
                                <span>وثيقة تاريخية</span>
                            </span>
                            <span class="meta-item">
                                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
                                <span>5 دقائق قراءة</span>
                            </span>
                        </div>
                    </div>

                    <div class="image-container">
                        <img 
                            :src="'/PNG/' + activeArticle.id + '.png'" 
                            @error="(e) => e.target.style.display='none'"
                            :alt="activeArticle.title"
                            loading="lazy"
                        />
                    </div>

                    <div v-if="activeArticle.content" class="document-text">
                        {{ activeArticle.content }}
                    </div>
                    <div v-else-if="loadingContent" class="loading-state">
                        <div class="spinner"></div>
                        <p>جارٍ تحميل الوثيقة...</p>
                    </div>
                    <div v-else class="error-text">
                        تعذر تحميل المحتوى لهذا المقال.
                    </div>
                </div>
            </main>
        </div>

        <button class="mobile-toggle" @click="sidebarOpen = !sidebarOpen">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
        </button>
    </div>

    <div id="loginModal" class="modal-backdrop">
        <div class="modal-box">
            <button class="modal-close" onclick="closeModal()" aria-label="إغلاق">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12" /></svg>
            </button>
            <h2>تسجيل الدخول</h2>
            <div class="form-group">
                <label for="emailInput">البريد الإلكتروني</label>
                <input type="email" id="emailInput" placeholder="example@malines.com" dir="ltr" autocomplete="email">
            </div>
            <div class="form-group">
                <label for="passInput">كلمة المرور</label>
                <input type="password" id="passInput" placeholder="••••••••" autocomplete="current-password">
            </div>
            <div id="loginError" class="form-error">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>
                <span></span>
            </div>
            <button id="btnSubmit" class="btn-submit" onclick="doLogin()">دخول</button>
        </div>
    </div>

    <script>
        const { createApp, ref, computed, onMounted } = Vue;

        const vueApp = createApp({
            setup() {
                const articles = ref([
                    { id: '11001', title: 'معاهدة جين ستي', content: null },
                    { id: '11002', title: 'الحرب الهولندية اليابانية الألمانية : اغسطس 1906 - مارس 1907', content: null },
                    { id: '11003', title: 'الحرب الهولندية اليابانية الألمانية : مارس 1907 - يناير 1908', content: null },
                    { id: '11004', title: 'عملية إيكازوتشي: أكتوبر - ديسمبر 1904', content: null },
                    { id: '11005', title: 'عملية إيكازوتشي: يناير - مارس 1905', content: null },
                    { id: '11018', title: 'الحرب الكبرى : اكتوبر 1914 – يناير 1915', content: null },
                    { id: '11019', title: 'الحرب الكبرى : يناير 1915 – مايو 1915', content: null },
                    { id: '11020', title: 'الحرب الكبرى : مايو 1915 – اغسطس 1915', content: null },
                    { id: '11021', title: 'الحرب الكبرى : ابريل 1916 - اغسطس 1916', content: null },
                    { id: '11022', title: 'الحرب الكبرى : اغسطس 1916 - اكتوبر 1916', content: null },
                    { id: '11023', title: 'الحرب الكبرى : الغزو الأمريكي للمكسيك', content: null },
                    { id: '11024', title: 'حرب الخلافة الاسبانية الثانية', content: null },
                    { id: '11025', title: 'عودة الإمبراطورية الرومانية المقدسة', content: null },
                    { id: '11026', title: 'الحرب الكبرى : دخول الجيش الأمريكي لأوروبا 1917', content: null },
                    { id: '11027', title: 'انقلاب 1918 - روسيا', content: null },
                    { id: '11028', title: 'عملية بارباروسا : الامبراطورية الرومانية المقدسة', content: null },
                    { id: '11029', title: 'الحرب الجرمانية العظمى: الجزء الاول', content: null },
                    { id: '11030', title: 'الحرب الجرمانية العظمى: الجزء الثاني', content: null },
                    { id: '11031', title: 'الحرب الجرمانية العظمى: الجزء الثالث', content: null },
                    { id: '11032', title: 'حرب الاستقلال الجزائرية', content: null },
                    { id: '11033', title: 'الحرب السوفيتية الاوردية', content: null },
                    { id: '11034', title: 'عملية دي اوليانوف', content: null },
                    { id: '11035', title: 'عمليات غرب أفريقيا — وثيقة السنغال الفيدرالية', content: null },
                    { id: '11036', title: 'الحرب البلقانية الرومانية المقدسة', content: null },
                    { id: '11037', title: 'الحرب الأوكرانية العظمى', content: null },
                ]);

                const activeId = ref(null);
                const searchQuery = ref('');
                const loadingContent = ref(false);
                const sidebarOpen = ref(false);

                const filteredArticles = computed(() => {
                    const q = searchQuery.value.trim().toLowerCase();
                    if (!q) return articles.value;
                    return articles.value.filter(art => art.title.toLowerCase().includes(q));
                });

                const activeArticle = computed(() => {
                    return articles.value.find(a => a.id === activeId.value) || null;
                });

                const loadAllContents = async () => {
                    const promises = articles.value.map(async (article) => {
                        try {
                            const res = await fetch(`/TXT/${article.id}.txt`);
                            if (res.ok) {
                                article.content = await res.text();
                            } else {
                                article.content = '';
                            }
                        } catch (e) {
                            article.content = '';
                        }
                    });
                    await Promise.allSettled(promises);
                };

                const selectArticle = (id) => {
                    activeId.value = id;
                    sidebarOpen.value = false;
                    const art = articles.value.find(a => a.id === id);
                    if (art && art.content === null) {
                        loadingContent.value = true;
                        fetch(`/TXT/${id}.txt`)
                            .then(res => res.ok ? res.text() : '')
                            .then(text => {
                                art.content = text;
                                loadingContent.value = false;
                            })
                            .catch(() => {
                                art.content = '';
                                loadingContent.value = false;
                            });
                    }
                };

                onMounted(() => {
                    loadAllContents();
                });

                return {
                    articles,
                    activeId,
                    searchQuery,
                    filteredArticles,
                    activeArticle,
                    loadingContent,
                    sidebarOpen,
                    selectArticle,
                };
            }
        });

        vueApp.mount('#app');

        const STORAGE_KEY = 'malines_user';
        let dropdownVisible = false;

        const btnLogin = document.getElementById('btnLogin');
        const userBadge = document.getElementById('userBadge');
        const userInitial = document.getElementById('userInitial');
        const userDropdown = document.getElementById('userDropdown');
        const dropdownUsername = document.getElementById('dropdownUsername');
        const loginModal = document.getElementById('loginModal');
        const loginError = document.getElementById('loginError');
        const btnSubmit = document.getElementById('btnSubmit');

        function openModal() {
            loginModal.classList.add('active');
            document.getElementById('emailInput').focus();
            loginError.classList.remove('show');
            document.getElementById('emailInput').value = '';
            document.getElementById('passInput').value = '';
        }

        function closeModal() {
            loginModal.classList.remove('active');
        }

        loginModal.addEventListener('click', function(e) {
            if (e.target === loginModal) closeModal();
        });

        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') closeModal();
        });

        async function doLogin() {
            const email = document.getElementById('emailInput').value.trim();
            const password = document.getElementById('passInput').value;

            loginError.classList.remove('show');

            if (!email) { showError('يرجى إدخال البريد الإلكتروني'); return; }
            if (!password) { showError('يرجى إدخال كلمة المرور'); return; }

            btnSubmit.disabled = true;
            btnSubmit.textContent = 'جارٍ التحقق...';

            try {
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                const data = await response.json();

                if (response.ok && data.success) {
                    setLoggedInUser(data.username);
                    closeModal();
                } else {
                    showError(data.error || 'فشل تسجيل الدخول');
                }
            } catch (err) {
                showError('تعذر الاتصال بالخادم');
            } finally {
                btnSubmit.disabled = false;
                btnSubmit.textContent = 'دخول';
            }
        }

        function showError(msg) {
            loginError.querySelector('span').textContent = msg;
            loginError.classList.add('show');
        }

        function setLoggedInUser(username) {
            localStorage.setItem(STORAGE_KEY, JSON.stringify({ username }));
            updateUI(username);
        }

        function updateUI(username) {
            btnLogin.style.display = 'none';
            userBadge.style.display = 'flex';
            userInitial.textContent = username.charAt(0).toUpperCase();
            dropdownUsername.textContent = username;
        }

        function clearUser() {
            localStorage.removeItem(STORAGE_KEY);
            btnLogin.style.display = 'flex';
            userBadge.style.display = 'none';
            userDropdown.classList.remove('show');
            dropdownVisible = false;
        }

        function handleLogout() {
            clearUser();
        }

        function toggleDropdown() {
            dropdownVisible = !dropdownVisible;
            userDropdown.classList.toggle('show', dropdownVisible);
        }

        document.addEventListener('click', function(e) {
            if (!userBadge.contains(e.target)) {
                userDropdown.classList.remove('show');
                dropdownVisible = false;
            }
        });

        (function initAuth() {
            const stored = localStorage.getItem(STORAGE_KEY);
            if (stored) {
                try {
                    const user = JSON.parse(stored);
                    if (user.username) updateUI(user.username);
                } catch (e) {
                    clearUser();
                }
            }
        })();
    </script>
</body>
</html>
