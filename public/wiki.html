<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Malines Wiki | الأرشيف</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: #050505; color: #a3a3a3; font-family: system-ui, sans-serif; }
        .active-link { background: #7f1d1d !important; color: white !important; border-right: 4px solid #b91c1c; }
        .scrollbar-hidden::-webkit-scrollbar { width: 4px; }
        .scrollbar-hidden::-webkit-scrollbar-thumb { background: #1a1a1a; }
    </style>
</head>
<body class="h-screen flex flex-col overflow-hidden">

    <div id="app" class="flex flex-col md:flex-row h-full w-full">
        
        <aside class="w-full md:w-80 bg-[#0a0a0a] border-l border-[#1a1a1a] flex flex-col shrink-0 overflow-hidden">
            <div class="p-6 border-b border-[#1a1a1a] flex justify-between items-center">
                <h2 class="text-white font-black tracking-tighter uppercase">Archives</h2>
                <a href="index.html" class="text-[10px] border border-neutral-800 px-2 py-1 hover:bg-neutral-900 transition">BACK</a>
            </div>
            <nav class="flex-grow overflow-y-auto scrollbar-hidden p-4 space-y-1">
                <button 
                    v-for="art in articles" :key="art.id"
                    @click="fetchData(art)"
                    :class="['w-full text-right p-3 text-sm transition font-medium', 
                             activeId === art.id ? 'active-link' : 'hover:bg-neutral-900']"
                >
                    {{ art.title }}
                </button>
            </nav>
        </aside>

        <main class="flex-grow overflow-y-auto bg-[#050505] p-6 md:p-16">
            <div v-if="loading" class="h-full flex items-center justify-center">
                <div class="w-10 h-10 border-2 border-red-900 border-t-red-500 rounded-full animate-spin"></div>
            </div>

            <div v-else-if="current" class="max-w-3xl mx-auto">
                <header class="mb-10">
                    <span class="text-red-700 text-xs font-bold tracking-[0.3em] uppercase">Security Level: Classified</span>
                    <h1 class="text-4xl md:text-5xl font-black text-white mt-2 leading-tight uppercase">{{ current.title }}</h1>
                </header>

                <div v-if="hasImage" class="mb-10 border border-[#1a1a1a] bg-black p-1 shadow-2xl">
                    <img :src="'/PNG/' + current.id + '.png'" class="w-full h-auto grayscale hover:grayscale-0 transition-all duration-700" @error="hasImage = false">
                </div>

                <article class="text-lg leading-relaxed text-neutral-400 text-justify">
                    <pre class="whitespace-pre-wrap font-sans">{{ text }}</pre>
                </article>
            </div>

            <div v-else class="h-full flex items-center justify-center border-2 border-dashed border-[#111] m-4">
                <p class="text-neutral-700 uppercase tracking-widest text-xs">Select Document for decryption</p>
            </div>
        </main>
    </div>

    <script>
        const { createApp, ref } = Vue;
        createApp({
            setup() {
                const articles = ref([
                    { id: 'updates-new-system', title: 'تحديثات الأنظمة المركزية' },
                    { id: 'beginners-guide', title: 'دليل البروتوكولات للمستجدين' },
                    { id: 'first-tournament', title: 'تقرير المناورة الجيوسياسية' }
                ]);
                const current = ref(null);
                const text = ref('');
                const loading = ref(false);
                const activeId = ref('');
                const hasImage = ref(true);

                const fetchData = async (art) => {
                    loading.value = true;
                    activeId.value = art.id;
                    hasImage.value = true;
                    try {
                        // جلب النص من المسار المكون في server.js
                        const res = await fetch(`/TXT/${art.id}.txt`);
                        text.value = res.ok ? await res.text() : 'فشل في الوصول إلى الوثيقة.';
                        current.value = art;
                    } catch (e) {
                        text.value = 'خطأ في النظام الأرشيفي.';
                    }
                    loading.value = false;
                };

                return { articles, current, text, loading, activeId, fetchData, hasImage };
            }
        }).mount('#app');
    </script>
</body>
</html>
