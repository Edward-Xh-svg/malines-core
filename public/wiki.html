<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Malines Wiki | الأرشيف المركزي</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root { --bg: #050505; --red: #7f1d1d; --border: #1a1a1a; }
        body { background: var(--bg); color: #a3a3a3; font-family: 'Inter', sans-serif; margin: 0; }
        
        /* شريط علوي بسيط وثابت */
        header { 
            background: #0a0a0a; 
            border-bottom: 1px solid var(--border); 
            position: sticky; 
            top: 0; 
            z-index: 100;
        }

        /* حاوية المقال */
        .article-container {
            border-bottom: 1px solid var(--border);
            padding-bottom: 4rem;
            margin-bottom: 4rem;
        }

        .article-container:last-child {
            border-bottom: none;
            margin-bottom: 0;
        }

        .content-view { 
            background: radial-gradient(circle at top right, #0d0202 0%, #050505 100%); 
        }

        /* تنسيق النص للحفاظ على المسافات والسطور */
        pre { 
            white-space: pre-wrap; 
            font-family: inherit; 
            line-height: 1.8; 
            color: #d4d4d4; 
            margin: 0; 
        }

        /* شريط تمرير احترافي */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: var(--bg); }
        ::-webkit-scrollbar-thumb { background: #1a1a1a; }
        ::-webkit-scrollbar-thumb:hover { background: var(--red); }
    </style>
</head>
<body class="min-h-screen content-view">

    <div id="app" class="flex flex-col">
        
        <header>
            <div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">
                <div class="flex items-center gap-3">
                    <span class="w-1 h-5 bg-red-900"></span>
                    <h1 class="text-white font-black tracking-widest text-xs uppercase">Malines Intelligence</h1>
                </div>
                <nav class="flex items-center gap-6 text-[10px] text-neutral-600 font-bold uppercase tracking-widest">
                    <span>Database Access</span>
                    <a href="index.html" class="hover:text-red-700 transition">Return</a>
                </nav>
            </div>
        </header>

        <main class="flex-grow w-full max-w-4xl mx-auto p-6 md:p-16 relative">
            
            <div v-if="loadingAll" class="fixed inset-0 flex flex-col items-center justify-center bg-black z-50">
                <div class="w-10 h-10 border-2 border-red-900 border-t-red-500 rounded-full animate-spin mb-4"></div>
                <p class="text-xs text-neutral-600 uppercase tracking-widest">Decryption in progress...</p>
            </div>

            <div v-else-if="error" class="text-center py-20 border border-red-900/20 bg-red-900/5 rounded p-10">
                <p class="text-red-700 text-sm mb-4">فشل الاتصال بالنظام الأرشيفي أو المجلد فارغ.</p>
                <button @click="fetchAllArticlesData" class="text-xs text-white underline uppercase">إعادة المحاولة</button>
            </div>

            <div v-else class="space-y-10">
                
                <div v-for="article in fullArticles" :key="article.id" class="article-container">
                    
                    <header class="mb-10">
                        <div class="flex items-center gap-3 mb-4">
                            <span class="text-red-700 text-xs font-bold tracking-[0.4em] uppercase">Document: {{ article.id }}</span>
                            <span class="w-20 h-[1px] bg-red-900/30"></span>
                        </div>
                        <h2 class="text-4xl md:text-6xl font-black text-white uppercase tracking-tighter leading-none">
                            {{ article.title }}
                        </h2>
                    </header>

                    <div v-if="!article.imageError" class="mb-12 border border-neutral-900 p-1 bg-black shadow-2xl">
                        <img 
                            :src="'/png/' + article.id + '.png'" 
                            :alt="article.title"
                            @error="article.imageError = true" 
                            class="w-full grayscale opacity-70 hover:grayscale-0 hover:opacity-100 transition duration-700"
                        >
                    </div>

                    <article class="prose prose-invert max-w-none">
                        <pre>{{ article.content }}</pre>
                    </article>

                </div>

            </div>
        </main>

        <footer class="border-t border-[#1a1a1a] p-10 bg-black/50 text-center text-[10px] text-neutral-700 font-mono uppercase tracking-widest">
            Ivanova Corp. Terminal v1.0 | All Data Classified
        </footer>
    </div>

    <script>
        const { createApp, ref, onMounted } = Vue;
        createApp({
            setup() {
                const fullArticles = ref([]); // مصفوفة تحتوي على البيانات الكاملة للمقالات (العنوان + النص)
                const loadingAll = ref(true);
                const error = ref(false);

                // دالة لجلب محتوى مقالة واحدة (نص)
                const fetchArticleContent = async (id) => {
                    try {
                        const res = await fetch(`/api/content/${id}`);
                        if (!res.ok) throw new Error("File not found");
                        const data = await res.json();
                        return data.content;
                    } catch (e) {
                        return "خطأ: تعذر فك تشفير محتوى هذا الملف. قد يكون مفقوداً.";
                    }
                };

                // الدالة الرئيسية لجلب القائمة ثم محتوى كل ملف بالتوازي
                const fetchAllArticlesData = async () => {
                    loadingAll.value = true;
                    error.value = false;
                    fullArticles.value = [];
                    try {
                        // 1. جلب قائمة المقالات أولاً
                        const res = await fetch('/api/articles');
                        if (!res.ok) throw new Error();
                        const basicArticles = await res.json();
                        
                        if (basicArticles.length === 0) {
                            error.value = true;
                            loadingAll.value = false;
                            return;
                        }

                        // 2. جلب محتوى كل مقالة ديناميكياً
                        // نستخدم Promise.all لضمان جلب النصوص كلها بالتوازي لسرعة التحميل
                        const articlesWithContent = await Promise.all(basicArticles.map(async (art) => {
                            const content = await fetchArticleContent(art.id);
                            return {
                                ...art,
                                content: content,
                                imageError: false // حالة خاصة للصورة لكل مقال
                            };
                        }));

                        fullArticles.value = articlesWithContent;

                    } catch (e) {
                        console.error("Archive fetch error:", e);
                        error.value = true;
                    } finally {
                        loadingAll.value = false;
                    }
                };

                onMounted(fetchAllArticlesData);
                
                return { 
                    fullArticles,
                    loadingAll,
                    error,
                    fetchAllArticlesData
                };
            }
        }).mount('#app');
    </script>
</body>
</html>
