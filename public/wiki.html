<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>أرشيف مالينز المركزي</title>
  <meta name="description" content="الموسوعة الحرة للوثائق والمخطوطات — مجتمع مالينز" />
  <meta property="og:title" content="أرشيف مالينز المركزي" />
  <meta property="og:description" content="مرحبا في ارشيف مجتمع مالينز" />
  <meta property="og:image" content="/malines-excon.png" />
  <meta property="og:url" content="https://malines.ivanova.sbs/wiki.html" />
  <meta property="og:locale" content="ar_MA" />
  <meta property="og:site_name" content="Archive | Malines Community" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Archive | Malines Community" />
  <meta name="twitter:description" content="مرحبا في ارشيف مجتمع مالينز!" />
  <meta name="twitter:image" content="/malines-excon.png" />
  <link rel="icon" href="/malines-icon.png" type="image/png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600&family=Playfair+Display:wght@700;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/style.css" />
</head>
<body class="wiki-page">

  <!-- NAVBAR -->
  <nav class="nav">
    <div class="nav-inner">
      <a href="/" class="nav-brand">
        <img src="/malines-icon.png" alt="مالينز" class="nav-logo" />
        <span class="nav-title">مالينز</span>
      </a>
      <div class="nav-links">
        <a href="/" class="nav-link">الرئيسية</a>
      </div>
    </div>
  </nav>

  <!-- WIKI LAYOUT -->
  <div class="wiki-layout">

    <!-- SIDEBAR -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <h2 class="sidebar-title">الأرشيف</h2>
        <div class="search-wrap">
          <svg class="search-icon" width="15" height="15" viewBox="0 0 15 15" fill="none">
            <circle cx="6.5" cy="6.5" r="5" stroke="currentColor" stroke-width="1.3"/>
            <path d="M10.5 10.5L14 14" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
          </svg>
          <input type="text" id="searchInput" class="search-input" placeholder="بحث في الأرشيف..." />
        </div>
      </div>

      <div class="sidebar-body" id="articleList">
        <div class="sidebar-loading">
          <div class="spinner"></div>
          <span>جارٍ التحميل...</span>
        </div>
      </div>
    </aside>

    <!-- MOBILE SIDEBAR TOGGLE -->
    <button class="sidebar-toggle" id="sidebarToggle" aria-label="القائمة">
      <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
        <path d="M3 5h14M3 10h14M3 15h14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
      </svg>
      <span>الأرشيف</span>
    </button>

    <!-- MAIN CONTENT -->
    <main class="wiki-main" id="wikiMain">

      <!-- WELCOME STATE -->
      <div class="wiki-welcome" id="welcomeState">
        <div class="welcome-icon">
          <svg width="48" height="48" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect x="8" y="6" width="22" height="30" rx="2" stroke="currentColor" stroke-width="1.5"/>
            <path d="M16 14h10M16 19h10M16 24h6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
            <rect x="18" y="20" width="22" height="22" rx="2" fill="var(--bg)" stroke="currentColor" stroke-width="1.5"/>
            <path d="M26 28h8M26 33h5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          </svg>
        </div>
        <h1 class="welcome-title">مرحباً بك في الأرشيف</h1>
        <p class="welcome-desc">اختر مقالاً من القائمة الجانبية للبدء في القراءة</p>
      </div>

      <!-- ARTICLE STATE -->
      <article class="wiki-article" id="articleState" style="display:none;">
        <div class="article-meta">
          <span class="article-tag">وثيقة تاريخية</span>
          <span class="article-read">5 دقائق قراءة</span>
        </div>
        <h1 class="article-title" id="articleTitle"></h1>
        <div class="article-divider"></div>
        <div class="article-image-wrap" id="articleImageWrap" style="display:none;">
          <img id="articleImage" src="" alt="" class="article-image" />
        </div>
        <div class="article-body" id="articleContent"></div>
      </article>

      <!-- ERROR STATE -->
      <div class="wiki-error" id="errorState" style="display:none;">
        <svg width="40" height="40" viewBox="0 0 40 40" fill="none">
          <circle cx="20" cy="20" r="16" stroke="currentColor" stroke-width="1.5"/>
          <path d="M20 13v8M20 26v1" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
        <p>تعذر تحميل المحتوى لهذا المقال</p>
      </div>

    </main>
  </div>

  <!-- OVERLAY for mobile -->
  <div class="sidebar-overlay" id="sidebarOverlay"></div>

  <script>
    let allArticles = [];
    let activeId = null;

    const articleList = document.getElementById('articleList');
    const welcomeState = document.getElementById('welcomeState');
    const articleState = document.getElementById('articleState');
    const errorState = document.getElementById('errorState');
    const articleTitle = document.getElementById('articleTitle');
    const articleContent = document.getElementById('articleContent');
    const articleImageWrap = document.getElementById('articleImageWrap');
    const articleImage = document.getElementById('articleImage');
    const searchInput = document.getElementById('searchInput');
    const sidebarToggle = document.getElementById('sidebarToggle');
    const sidebar = document.getElementById('sidebar');
    const overlay = document.getElementById('sidebarOverlay');

    // Mobile sidebar
    sidebarToggle.addEventListener('click', () => {
      sidebar.classList.toggle('open');
      overlay.classList.toggle('visible');
    });
    overlay.addEventListener('click', () => {
      sidebar.classList.remove('open');
      overlay.classList.remove('visible');
    });

    function showState(state) {
      welcomeState.style.display = 'none';
      articleState.style.display = 'none';
      errorState.style.display = 'none';
      if (state === 'welcome') welcomeState.style.display = 'flex';
      else if (state === 'article') articleState.style.display = 'block';
      else if (state === 'error') errorState.style.display = 'flex';
    }

    function renderList(articles) {
      if (!articles.length) {
        articleList.innerHTML = '<p class="sidebar-empty">لا توجد نتائج</p>';
        return;
      }
      articleList.innerHTML = articles.map(art => `
        <button class="art-item ${activeId === art.id ? 'active' : ''}" data-id="${art.id}" onclick="loadArticle('${art.id}')">
          <span class="art-item-title">${art.title}</span>
          ${art.category ? `<span class="art-item-cat">${art.category}</span>` : ''}
        </button>
      `).join('');
    }

    function loadArticle(id) {
      activeId = id;
      renderList(allArticles.filter(a =>
        searchInput.value === '' || a.title.includes(searchInput.value)
      ));

      const art = allArticles.find(a => a.id === id || a.id === String(id));
      if (!art) { showState('error'); return; }

      articleTitle.textContent = art.title;
      articleContent.innerHTML = art.content || '<p>لا يوجد محتوى لهذه الوثيقة.</p>';

      if (art.image) {
        articleImage.src = art.image;
        articleImage.alt = art.title;
        articleImageWrap.style.display = 'block';
      } else {
        articleImageWrap.style.display = 'none';
      }

      showState('article');

      // Close sidebar on mobile after selection
      sidebar.classList.remove('open');
      overlay.classList.remove('visible');

      // Scroll to top
      document.getElementById('wikiMain').scrollTo({ top: 0, behavior: 'smooth' });
    }

    searchInput.addEventListener('input', () => {
      const q = searchInput.value.trim();
      const filtered = q ? allArticles.filter(a => a.title.includes(q) || (a.content && a.content.includes(q))) : allArticles;
      renderList(filtered);
    });

    // Load articles
    fetch('/api/articles')
      .then(r => {
        if (!r.ok) throw new Error('not ok');
        return r.json();
      })
      .then(data => {
        allArticles = data;
        renderList(allArticles);
      })
      .catch(() => {
        articleList.innerHTML = '<p class="sidebar-empty">تعذر تحميل الأرشيف</p>';
      });
  </script>
</body>
</html>
