<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>أرشيف مالينز المركزي</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&family=IBM+Plex+Sans+Arabic:wght@300;500&family=Amiri:wght@400;700&display=swap" rel="stylesheet">

    <!-- Open Graph / WhatsApp / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://malines.ivanova.sbs/wiki.html" />
    <meta property="og:title" content="Archive | Malines Community" />
    <meta property="og:description" content="مرحبا في ارشيف مجتمع مالينز" />
    <meta property="og:image" content="https://malines.ivanova.sbs/sex-con.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="ar_MA" />
    <meta property="og:site_name" content="Archive | Malines Community" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://malines.ivanova.sbs/wiki.html" />
    <meta name="twitter:title" content="Archive | Malines Community" />
    <meta name="twitter:description" content="مرحبا في ارشيف مجتمع مالينز!" />
    <meta name="twitter:image" content="https://malines.ivanova.sbs/sex-con.png" />

    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --bg: #0a0a0a;
            --sidebar-bg: #0f0f0f;
            --text: #cccccc;
            --link: #8ab4f8;
            --border: #2a2a2a;
            --accent: #c49b3f; /* ذهبي هادئ */
            --accent-hover: #dbb452;
        }
        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'IBM Plex Sans Arabic', sans-serif;
            margin: 0;
            display: flex;
        }
        .wiki-body {
            display: flex;
            width: 100%;
            min-height: 100vh;
        }
        .sidebar {
            width: 280px;
            background: var(--sidebar-bg);
            border-left: 1px solid var(--border);
            padding: 20px 0;
            position: sticky;
            top: 0;
            height: 100vh;
            overflow-y: auto;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
        }
        .sidebar-header {
            padding: 0 20px 20px;
            border-bottom: 1px solid var(--border);
            margin-bottom: 15px;
        }
        .sidebar-header h2 {
            font-family: 'Cairo', sans-serif;
            font-weight: 700;
            font-size: 1.2rem;
            color: #e0e0e0;
            margin: 0;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .search-box {
            padding: 0 20px;
            margin-bottom: 20px;
            position: relative;
        }
        .search-input {
            width: 100%;
            padding: 10px 12px 10px 32px;
            background: #1a1a1a;
            border: 1px solid var(--border);
            border-radius: 8px;
            color: #ddd;
            font-family: inherit;
            box-sizing: border-box;
            transition: border-color 0.2s;
        }
        .search-input:focus {
            border-color: var(--accent);
            outline: none;
        }
        .search-icon {
            position: absolute;
            right: 28px;
            top: 50%;
            transform: translateY(-50%);
            color: #666;
            pointer-events: none;
        }
        .nav-list {
            list-style: none;
            padding: 0 12px;
            margin: 0;
            flex: 1;
            overflow-y: auto;
        }
        .nav-item {
            display: block;
            padding: 10px 12px;
            margin: 2px 0;
            border-radius: 6px;
            color: #aaa;
            text-decoration: none;
            transition: 0.2s;
            cursor: pointer;
            font-size: 0.9rem;
            border-right: 3px solid transparent;
        }
        .nav-item:hover {
            background: #1e1e1e;
            color: #fff;
            border-right-color: var(--accent);
        }
        .nav-item.active {
            background: #1e1e1e;
            color: #fff;
            border-right-color: var(--accent);
            font-weight: 500;
        }
        .no-results {
            color: #555;
            padding: 10px 12px;
            font-size: 0.85rem;
        }
        .main-content {
            flex: 1;
            padding: 40px 60px;
            max-width: 860px;
            margin: 0 auto;
        }
        .article-header {
            margin-bottom: 30px;
        }
        .article-title {
            font-family: 'Amiri', serif;
            font-weight: 700;
            font-size: 2.4rem;
            color: #f0f0f0;
            border-bottom: 2px solid var(--border);
            padding-bottom: 12px;
            margin: 0 0 20px;
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .article-title .icon-doc {
            color: var(--accent);
            opacity: 0.7;
        }
        .image-container {
            margin-bottom: 30px;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid var(--border);
        }
        .image-container img {
            width: 100%;
            display: block;
            filter: grayscale(0.2);
            transition: filter 0.5s;
        }
        .image-container img:hover {
            filter: grayscale(0);
        }
        .document-text {
            font-family: 'Amiri', serif;
            line-height: 2.3;
            font-size: 1.15rem;
            color: #c0c0c0;
            white-space: pre-wrap;
            background: rgba(255,255,255,0.02);
            padding: 25px;
            border-radius: 8px;
            border-right: 3px solid var(--accent);
        }
        .placeholder-message {
            text-align: center;
            margin-top: 80px;
            color: #666;
        }
        .placeholder-message h2 {
            font-family: 'Amiri', serif;
            font-size: 2.2rem;
            color: #555;
            margin-bottom: 10px;
        }
        .btn-listen {
            background: none;
            border: 1px solid var(--border);
            color: #aaa;
            font-size: 1.4rem;
            cursor: pointer;
            border-radius: 6px;
            padding: 4px 10px;
            transition: 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }
        .btn-listen:hover {
            border-color: var(--accent);
            color: #fff;
            background: #1a1a1a;
        }
        .btn-listen.active {
            border-color: var(--accent);
            color: var(--accent);
            background: #1a1a1a;
            box-shadow: 0 0 8px rgba(196,155,63,0.3);
        }
        .error-text {
            color: #aa5555;
        }
        /* تخصيص شريط التمرير */
        .sidebar::-webkit-scrollbar { width: 5px; }
        .sidebar::-webkit-scrollbar-track { background: transparent; }
        .sidebar::-webkit-scrollbar-thumb { background: #2a2a2a; border-radius: 3px; }
    </style>
</head>
<body>
    <div id="app">
        <div class="wiki-body">
            <!-- الشريط الجانبي -->
            <aside class="sidebar">
                <div class="sidebar-header">
                    <h2>
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-accent"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path></svg>
                        أرشيف مالينز
                    </h2>
                </div>
                <div class="search-box">
                    <input 
                        type="text" 
                        v-model="searchQuery" 
                        placeholder="ابحث عن مقال..." 
                        class="search-input"
                    />
                    <span class="search-icon">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
                    </span>
                </div>
                <nav class="nav-list">
                    <div 
                        v-for="art in filteredArticles" 
                        :key="art.id"
                        :class="['nav-item', { active: activeId === art.id }]"
                        @click="selectArticle(art.id)"
                    >
                        {{ art.title }}
                    </div>
                    <div v-if="filteredArticles.length === 0" class="no-results">
                        لا توجد نتائج
                    </div>
                </nav>
            </aside>

            <!-- المحتوى الرئيسي -->
            <main class="main-content">
                <div v-if="!activeArticle" class="placeholder-message">
                    <h2>مرحباً بك في الأرشيف</h2>
                    <p>اختر مقالاً من القائمة الجانبية للبدء</p>
                </div>

                <div v-else>
                    <div class="article-header">
                        <h1 class="article-title">
                            <span class="icon-doc">
                                <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline></svg>
                            </span>
                            {{ activeArticle.title }}
                        </h1>
                        <!-- زر استماع مؤقت (يمكن تفعيله لاحقاً) -->
                        <!--
                        <button class="btn-listen" @click="toggleSpeech">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>
                            استمع
                        </button>
                        -->
                    </div>

                    <div class="image-container">
                        <img 
                            :src="'/PNG/' + activeArticle.id + '.png'" 
                            @error="(e) => e.target.style.display='none'"
                            :alt="activeArticle.title"
                            loading="lazy"
                        />
                    </div>

                    <div v-if="activeArticle.content" class="document-text">
                        {{ activeArticle.content }}
                    </div>
                    <div v-else-if="loadingContent" class="placeholder-message">
                        ⏳ جارٍ تحميل الوثيقة...
                    </div>
                    <div v-else class="placeholder-message error-text">
                        تعذر تحميل المحتوى لهذا المقال.
                    </div>
                </div>
            </main>
        </div>
    </div>

    <script>
        const { createApp, ref, computed, onMounted } = Vue;

        createApp({
            setup() {
                // ========== The center of wiki ==========
                const articles = ref([
                    { id: '11001', title: 'معاهدة جين ستي', content: null },
                    { id: '11002', title: 'الحرب الهولندية اليابانية الألمانية : اغسطس 1906 - مارس 1907', content: null },
                    { id: '11003', title: 'الحرب الهولندية اليابانية الألمانية : مارس 1907 - يناير 1908', content: null },
                    { id: '11004', title: 'عملية إيكازوتشي: أكتوبر - ديسمبر 1904', content: null },
                    { id: '11005', title: 'عملية إيكازوتشي: يناير - مارس 1905', content: null },
                    { id: '11018', title: 'الحرب الكبرى : اكتوبر 1914 – يناير 1915 ', content: null },
                    { id: '11019', title: 'الحرب الكبرى : يناير 1915 – مايو 1915 ', content: null },
                    { id: '11020', title: 'الحرب الكبرى : مايو 1915 – اغسطس 1915 ', content: null },
                    { id: '11021', title: 'الحرب الكبرى : ابريل 1916 - اغسطس 1916', content: null },
                    { id: '11022', title: 'الحرب الكبرى : اغسطس 1916 - اكتوبر 1916', content: null },
                ]);
                // ========== The Fin of the center of wiki ==========

                const activeId = ref(null);
                const searchQuery = ref('');
                const loadingContent = ref(false);

                const filteredArticles = computed(() => {
                    const q = searchQuery.value.trim().toLowerCase();
                    if (!q) return articles.value;
                    return articles.value.filter(art => 
                        art.title.toLowerCase().includes(q)
                    );
                });

                const activeArticle = computed(() => {
                    return articles.value.find(a => a.id === activeId.value) || null;
                });

                const loadAllContents = async () => {
                    const promises = articles.value.map(async (article) => {
                        try {
                            const res = await fetch(`/TXT/${article.id}.txt`);
                            if (res.ok) {
                                article.content = await res.text();
                            } else {
                                article.content = '';
                            }
                        } catch (e) {
                            article.content = '';
                        }
                    });
                    await Promise.allSettled(promises);
                };

                const selectArticle = (id) => {
                    activeId.value = id;
                    const art = articles.value.find(a => a.id === id);
                    if (art && art.content === null) {
                        loadingContent.value = true;
                        fetch(`/TXT/${id}.txt`)
                            .then(res => res.ok ? res.text() : '')
                            .then(text => {
                                art.content = text;
                                loadingContent.value = false;
                            })
                            .catch(() => {
                                art.content = '';
                                loadingContent.value = false;
                            });
                    }
                };

                onMounted(loadAllContents);

                return {
                    articles,
                    activeId,
                    searchQuery,
                    filteredArticles,
                    activeArticle,
                    loadingContent,
                    selectArticle,
                };
            }
        }).mount('#app');
    </script>
</body>
</html>
