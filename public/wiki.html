<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Malines Wiki | الأرشيف الجيوسياسي</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* التخصيص اللوني للنمط الجاد: أسود، رمادي، أحمر داكن */
        :root {
            --bg-deep: #050505;
            --surface-dark: #111111;
            --surface-hover: #1a1a1a;
            --border-color: #262626;
            --text-main: #d4d4d4;
            --text-muted: #737373;
            --accent-red: #7f1d1d; /* أحمر داكن */
            --accent-red-hover: #991b1b;
        }

        body {
            background-color: var(--bg-deep);
            color: var(--text-main);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            overflow-x: hidden;
        }

        /* تنسيقات الشريط الجانبي */
        .sidebar-container {
            background-color: var(--surface-dark);
            border-left: 1px solid var(--border-color);
        }

        .article-btn {
            border: 1px solid transparent;
            transition: all 0.2s ease-in-out;
        }

        .article-btn:hover:not(.active-btn) {
            background-color: var(--surface-hover);
            border-right: 3px solid var(--accent-red);
        }

        .active-btn {
            background-color: var(--accent-red);
            color: #ffffff;
            border-right: 3px solid #dc2626; /* أحمر ساطع قليلاً للتباين */
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.5);
        }

        /* تنسيقات المحتوى */
        .content-area {
            background-color: var(--bg-deep);
        }

        .article-image-container {
            border: 1px solid var(--border-color);
            background-color: var(--surface-dark);
        }

        .article-text {
            font-size: 1.125rem;
            line-height: 1.8;
            color: #e5e5e5;
        }

        /* الحفاظ على تنسيق النصوص */
        pre {
            white-space: pre-wrap;
            word-wrap: break-word;
            font-family: inherit;
            margin: 0;
        }

        /* تخصيص شريط التمرير */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: var(--bg-deep);
        }
        ::-webkit-scrollbar-thumb {
            background: var(--border-color);
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: var(--accent-red);
        }
    </style>
</head>
<body class="h-screen flex overflow-hidden">
    <div id="app" class="flex w-full h-full">
        
        <aside class="w-80 sidebar-container flex flex-col h-full z-10 shadow-2xl shrink-0">
            <div class="p-6 border-b border-[#262626]">
                <a href="/" class="text-[#737373] hover:text-[#d4d4d4] text-sm flex items-center gap-2 mb-6 transition-colors">
                    <span>← العودة للمركز الرئيسي</span>
                </a>
                <h2 class="text-2xl font-bold tracking-wide uppercase text-white">
                    MALINES <span class="text-[#7f1d1d]">WIKI</span>
                </h2>
                <p class="text-xs text-[#737373] mt-2">الأرشيف الرسمي والوثائق</p>
            </div>
            
            <nav class="flex-grow overflow-y-auto p-4 space-y-2">
                <button 
                    v-for="article in articles" 
                    :key="article.id"
                    @click="loadArticle(article)"
                    :class="['w-full text-right px-4 py-3 rounded-md text-sm font-medium article-btn flex justify-between items-center', 
                             currentArticle?.id === article.id ? 'active-btn' : 'text-[#a3a3a3]']"
                >
                    <span>{{ article.title }}</span>
                    <span v-if="currentArticle?.id === article.id" class="w-1.5 h-1.5 rounded-full bg-white"></span>
                </button>
            </nav>

            <div class="p-4 border-t border-[#262626] text-center text-xs text-[#737373]">
                Ivanova Corporation © 2026
            </div>
        </aside>

        <main class="flex-grow overflow-y-auto content-area relative">
            <div v-if="currentArticle" class="max-w-4xl mx-auto p-10 pb-20">
                
                <header class="mb-10">
                    <div class="flex items-center gap-3 mb-4">
                        <span class="w-8 h-1 bg-[#7f1d1d]"></span>
                        <span class="text-xs font-bold tracking-widest text-[#737373] uppercase">وثيقة أرشيفية</span>
                    </div>
                    <h1 class="text-4xl md:text-5xl font-extrabold text-white leading-tight">
                        {{ currentArticle.title }}
                    </h1>
                </header>

                <div class="article-image-container rounded-lg overflow-hidden shadow-2xl mb-12">
                    <img 
                        :src="`/PNG/${currentArticle.id}.png`" 
                        :alt="currentArticle.title"
                        @error="handleImageError"
                        class="w-full object-cover max-h-[450px] opacity-90 hover:opacity-100 transition-opacity duration-300"
                    >
                </div>

                <article class="article-text">
                    <pre v-if="!isLoading" class="bg-transparent border-none p-0 text-justify">{{ currentContent }}</pre>
                    
                    <div v-else class="flex justify-center py-10">
                        <div class="w-8 h-8 border-4 border-[#262626] border-t-[#7f1d1d] rounded-full animate-spin"></div>
                    </div>
                </article>
            </div>

            <div v-else class="h-full flex flex-col items-center justify-center text-[#737373]">
                <div class="w-16 h-16 border-2 border-[#262626] rounded-lg flex items-center justify-center mb-4 bg-[#111111]">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-[#7f1d1d]"><path d="M4 19.5v-15A2.5 2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1 0-5H20"/></svg>
                </div>
                <h3 class="text-xl font-bold text-[#a3a3a3] mb-2">النظام الأرشيفي</h3>
                <p class="text-sm">قم بتحديد وثيقة من القائمة الجانبية لاستعراض محتوياتها.</p>
            </div>
        </main>
    </div>

    <script>
        const { createApp, ref, onMounted } = Vue;

        createApp({
            setup() {
                const currentArticle = ref(null);
                const currentContent = ref('');
                const isLoading = ref(false);
                
                // قائمة المقالات
                const articles = ref([
                    { id: 'updates-new-system', title: 'تحديثات النظام الجديد' },
                    { id: 'beginners-guide', title: 'دليل المبتدئين للمحاكاة' },
                    { id: 'first-tournament', title: 'البطولة الجيوسياسية الأولى' }
                ]);

                const loadArticle = async (article) => {
                    if (currentArticle.value?.id === article.id) return; // منع إعادة التحميل لنفس المقالة
                    
                    currentArticle.value = article;
                    isLoading.value = true;
                    
                    try {
                        // التعديل هنا: المسار يبدأ بـ / للبحث في المسار الجذري الذي حددناه في Express
                        const response = await fetch(`/TXT/${article.id}.txt`);
                        if (response.ok) {
                            currentContent.value = await response.text();
                        } else {
                            currentContent.value = "الوثيقة غير متوفرة في الأرشيف حالياً.";
                        }
                    } catch (error) {
                        currentContent.value = "حدث خطأ أثناء محاولة الاتصال بخوادم الأرشيف.";
                    } finally {
                        isLoading.value = false;
                    }
                };

                const handleImageError = (e) => {
                    // إخفاء الصورة في حال عدم وجودها
                    e.target.style.display = 'none';
                    e.target.parentElement.style.display = 'none'; // إخفاء الحاوية بأكملها لعدم ترك فراغ
                };

                onMounted(() => {
                    // يمكنك تفعيل هذا السطر إذا أردت فتح أول مقالة تلقائياً
                    // if (articles.value.length > 0) loadArticle(articles.value[0]);
                });

                return {
                    articles,
                    currentArticle,
                    currentContent,
                    isLoading,
                    loadArticle,
                    handleImageError
                };
            }
        }).mount('#app');
    </script>
</body>
</html>
