<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>Malines Wiki</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700;900&family=JetBrains+Mono&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: #050505; color: #a3a3a3; font-family: 'Cairo', sans-serif; }
        .article { border-bottom: 1px solid #1a1a1a; padding: 50px 0; }
        .content { 
            font-family: 'JetBrains Mono', monospace; 
            white-space: pre-wrap; 
            background: #0a0a0a; 
            padding: 20px; 
            border-right: 3px solid #7f1d1d; 
        }
    </style>
</head>
<body>
    <div id="app" class="max-w-4xl mx-auto px-6">
        <div v-for="art in fullArticles" :key="art.id" class="article">
            <h1 class="text-4xl font-black text-white mb-6 uppercase">{{ art.title }}</h1>
            
            <img :src="'/png/' + art.id + '.png'" 
                 @error="(e) => e.target.src = '/PNG/' + art.id + '.png'"
                 class="w-full mb-8 grayscale hover:grayscale-0 transition duration-500">
            
            <pre class="content">{{ art.content }}</pre>
        </div>
    </div>

    <script>
        const { createApp, ref, onMounted } = Vue;
        createApp({
            setup() {
                const fullArticles = ref([]);
                
                onMounted(async () => {
                    const res = await fetch('/api/articles');
                    const list = await res.json();
                    
                    for (let item of list) {
                        const textRes = await fetch(`/txt/${item.id}.txt`);
                        if (textRes.ok) {
                            item.content = await textRes.text();
                            fullArticles.value.push(item);
                        }
                    }
                });
                return { fullArticles };
            }
        }).mount('#app');
    </script>
</body>
</html>
