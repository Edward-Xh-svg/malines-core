<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="malines-fivcon.png" type="image/png">
  <title>المنتدى الدولي | مجتمع مالينز</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800;900&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root{--black:#050505;--dark:#0a0a0a;--card:#0f0f10;--border:#232325;--text:#e9e9e9;--muted:#8d8d8d;--red:#c0392b;--red-h:#e74c3c;--accent:#d4af37;}
    *{margin:0;padding:0;box-sizing:border-box;}
    body{background:radial-gradient(circle at 18% 16%,rgba(192,57,43,0.09),transparent 22%),var(--black);color:var(--text);font-family:'Cairo',sans-serif;overflow-x:hidden;}

    /* Topbar */
    .topbar{position:fixed;top:0;left:0;right:0;height:66px;background:rgba(5,5,5,0.6);backdrop-filter:blur(28px);border-bottom:1px solid rgba(255,255,255,0.04);display:flex;align-items:center;justify-content:space-between;padding:0 28px;z-index:100;}
    .topbar-left{display:flex;align-items:center;gap:10px;}
    .topbar-logo{width:34px;height:34px;border-radius:50%;object-fit:cover;}
    .topbar-title{font-weight:800;font-size:1rem;color:#fff;}
    .topbar-right{display:flex;align-items:center;gap:10px;}

    /* Chat icon button */
    .chat-icon-btn{position:relative;width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,0.04);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;cursor:pointer;color:#aaa;transition:0.2s;text-decoration:none;}
    .chat-icon-btn:hover{background:rgba(255,255,255,0.08);color:#fff;}
    .chat-unread{position:absolute;top:2px;right:2px;width:8px;height:8px;background:var(--red);border-radius:50%;display:none;}

    .btn-login{display:flex;align-items:center;gap:7px;background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.12);color:#d7d7d7;padding:8px 18px;border-radius:999px;cursor:pointer;font-family:'Cairo';font-size:0.88rem;transition:0.2s;}
    .btn-login:hover{border-color:rgba(255,255,255,0.28);color:#fff;}
    .user-badge-wrap{position:relative;}
    .user-badge{width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,var(--red),#8e2a1f);color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center;cursor:pointer;overflow:hidden;font-size:1.05rem;}
    .user-badge img{width:100%;height:100%;object-fit:cover;}
    .user-dropdown{position:absolute;top:48px;left:0;background:rgba(10,10,10,0.97);backdrop-filter:blur(20px);border:1px solid var(--border);border-radius:14px;padding:8px 0;min-width:180px;opacity:0;visibility:hidden;transform:translateY(-8px);transition:0.22s;z-index:10;}
    .user-dropdown.show{opacity:1;visibility:visible;transform:translateY(0);}
    .dropdown-name{padding:10px 16px;font-size:0.85rem;color:#888;border-bottom:1px solid var(--border);margin-bottom:4px;}
    .user-dropdown button{width:100%;text-align:right;padding:9px 16px;background:none;border:none;color:#ccc;cursor:pointer;font-family:'Cairo';font-size:0.88rem;display:flex;align-items:center;gap:8px;}
    .user-dropdown button:hover{background:rgba(255,255,255,0.04);color:#fff;}
    .user-dropdown button svg{flex-shrink:0;}

    /* Header */
    .page-header{padding:110px 24px 44px;text-align:center;}
    .page-header h1{font-size:clamp(1.8rem,4vw,2.8rem);font-weight:900;background:linear-gradient(to bottom,#fff,#aaa);-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
    .page-header p{color:var(--muted);margin-top:10px;font-size:0.95rem;}
    .search-wrap{max-width:580px;margin:28px auto 0;position:relative;}
    .search-wrap input{width:100%;padding:13px 20px 13px 46px;background:#141414;border:1px solid var(--border);border-radius:999px;color:#fff;font-family:'Cairo';font-size:0.95rem;}
    .search-wrap input:focus{outline:none;border-color:rgba(255,255,255,0.2);}
    .search-icon{position:absolute;left:16px;top:50%;transform:translateY(-50%);color:#555;pointer-events:none;}

    /* Post button */
    .post-bar{max-width:820px;margin:20px auto 0;padding:0 24px;display:none;}
    .btn-post{display:inline-flex;align-items:center;gap:8px;background:rgba(192,57,43,0.1);border:1px solid rgba(192,57,43,0.22);color:var(--red-h);padding:10px 22px;border-radius:11px;cursor:pointer;font-family:'Cairo';font-size:0.92rem;font-weight:700;transition:0.2s;}
    .btn-post:hover{background:rgba(192,57,43,0.18);}

    /* Feed */
    .feed{max-width:820px;margin:22px auto 80px;padding:0 24px;display:flex;flex-direction:column;gap:24px;}

    /* Card */
    .post-card{background:rgba(15,15,16,0.95);border:1px solid var(--border);border-radius:22px;overflow:hidden;transition:border-color 0.2s;}
    .post-card:hover{border-color:rgba(255,255,255,0.1);}
    .card-img{width:100%;max-height:320px;object-fit:cover;}
    .card-body{padding:22px 26px;}

    /* Publisher */
    .pub-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
    .pub-info{display:flex;align-items:center;gap:11px;}
    .pub-avatar{width:42px;height:42px;border-radius:50%;background:linear-gradient(145deg,var(--red),#8e2a1f);display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff;flex-shrink:0;overflow:hidden;font-size:1.1rem;}
    .pub-avatar img{width:100%;height:100%;object-fit:cover;}
    .pub-name{font-weight:700;font-size:0.95rem;color:#fff;}
    .pub-date{font-size:0.75rem;color:var(--muted);margin-top:2px;}
    .role-badge{display:inline-flex;align-items:center;gap:4px;padding:2px 9px;border-radius:999px;font-size:0.7rem;font-weight:700;margin-right:6px;}
    .badge-admin{background:rgba(192,57,43,0.14);color:var(--red-h);border:1px solid rgba(192,57,43,0.22);}
    .badge-member{background:rgba(255,255,255,0.04);color:var(--muted);border:1px solid var(--border);}
    .pub-actions{display:flex;align-items:center;gap:6px;}
    .btn-icon{background:none;border:none;color:#555;cursor:pointer;padding:6px;border-radius:8px;transition:0.18s;display:flex;align-items:center;}
    .btn-icon:hover{background:rgba(255,255,255,0.05);color:#aaa;}

    /* Content */
    .post-text{font-family:'Amiri',serif;line-height:2;color:#ccc;font-size:1rem;white-space:pre-wrap;margin-bottom:16px;}

    /* Reactions */
    .reactions-row{display:flex;align-items:center;gap:8px;margin-bottom:14px;flex-wrap:wrap;}
    .react-wrap{position:relative;display:inline-flex;align-items:center;}
    .react-main-btn{display:inline-flex;align-items:center;gap:6px;padding:6px 14px;border-radius:999px;border:1px solid var(--border);background:rgba(255,255,255,0.03);color:var(--muted);cursor:pointer;font-family:'Cairo';font-size:0.82rem;transition:0.18s;}
    .react-main-btn:hover{border-color:rgba(255,255,255,0.2);color:#fff;}
    .react-main-btn.reacted{background:rgba(192,57,43,0.1);border-color:rgba(192,57,43,0.25);color:var(--red-h);}
    .react-menu{position:absolute;bottom:calc(100% + 8px);right:0;background:rgba(15,15,16,0.98);border:1px solid var(--border);border-radius:999px;padding:6px 10px;display:none;gap:4px;backdrop-filter:blur(20px);z-index:10;white-space:nowrap;}
    .react-menu.show{display:flex;}
    .react-emoji-btn{background:none;border:none;font-size:1.35rem;cursor:pointer;padding:4px 6px;border-radius:8px;transition:0.15s;line-height:1;}
    .react-emoji-btn:hover{background:rgba(255,255,255,0.08);transform:scale(1.25);}
    .react-emoji-btn.active{background:rgba(192,57,43,0.15);}
    .pub-name-link{cursor:pointer;transition:0.15s;}
    .pub-name-link:hover{color:var(--red-h)!important;}

    /* Comments */
    .comments-section{border-top:1px solid rgba(255,255,255,0.04);padding-top:14px;margin-top:4px;}
    .comments-toggle{display:flex;align-items:center;gap:7px;background:none;border:none;color:var(--muted);cursor:pointer;font-family:'Cairo';font-size:0.85rem;padding:4px 0;margin-bottom:12px;transition:0.18s;}
    .comments-toggle:hover{color:#fff;}
    .comments-list{display:flex;flex-direction:column;gap:10px;margin-bottom:12px;}
    .comment{display:flex;gap:10px;align-items:flex-start;}
    .c-avatar{width:32px;height:32px;border-radius:50%;background:linear-gradient(145deg,var(--red),#8e2a1f);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:0.85rem;color:#fff;flex-shrink:0;overflow:hidden;}
    .c-avatar img{width:100%;height:100%;object-fit:cover;}
    .c-bubble{background:rgba(255,255,255,0.04);border-radius:12px;padding:10px 14px;flex:1;}
    .c-name{font-weight:700;font-size:0.82rem;color:#fff;margin-bottom:4px;display:flex;align-items:center;gap:6px;}
    .c-text{font-size:0.88rem;color:#bbb;line-height:1.6;}
    .c-del{background:none;border:none;color:#444;cursor:pointer;padding:2px 6px;border-radius:5px;font-size:0.75rem;font-family:'Cairo';transition:0.15s;}
    .c-del:hover{color:var(--red-h);}
    .comment-input-row{display:flex;gap:8px;align-items:center;}
    .comment-input{flex:1;padding:9px 14px;background:#1a1a1a;border:1px solid var(--border);border-radius:999px;color:#fff;font-family:'Cairo';font-size:0.88rem;}
    .comment-input:focus{outline:none;border-color:rgba(255,255,255,0.2);}
    .btn-send-comment{width:34px;height:34px;background:var(--red);border:none;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:0.2s;flex-shrink:0;}
    .btn-send-comment:hover{background:var(--red-h);}

    .spinner{width:36px;height:36px;border:3px solid #222;border-top-color:var(--red);border-radius:50%;animation:spin 0.9s linear infinite;margin:0 auto 14px;}
    @keyframes spin{to{transform:rotate(360deg);}}
    .loading{text-align:center;padding:60px;color:var(--muted);}
    .empty{text-align:center;padding:60px;color:var(--muted);}

    /* Modals */
    .modal-bd{position:fixed;inset:0;background:rgba(0,0,0,0.82);backdrop-filter:blur(12px);display:flex;align-items:center;justify-content:center;z-index:200;opacity:0;visibility:hidden;transition:0.25s;padding:20px;}
    .modal-bd.show{opacity:1;visibility:visible;}
    .modal-box{background:#111;border:1px solid var(--border);border-radius:22px;padding:32px 28px;width:100%;max-width:440px;transform:translateY(10px);transition:0.25s;max-height:88vh;overflow-y:auto;}
    .modal-bd.show .modal-box{transform:translateY(0);}
    .modal-box.wide{max-width:600px;}
    .modal-t{font-size:1.15rem;font-weight:800;color:#fff;margin-bottom:20px;}
    .tabs{display:flex;gap:4px;background:rgba(255,255,255,0.03);border-radius:9px;padding:4px;margin-bottom:22px;}
    .tab{flex:1;padding:8px;border:none;border-radius:7px;cursor:pointer;font-family:'Cairo';font-size:0.85rem;font-weight:700;background:none;color:var(--muted);transition:0.2s;}
    .tab.active{background:rgba(255,255,255,0.07);color:#fff;}
    .tab-pane{display:none;}
    .tab-pane.active{display:block;}
    .fg{margin-bottom:15px;}
    .fg label{display:block;margin-bottom:6px;color:#999;font-size:0.85rem;}
    .fg input{width:100%;padding:11px 13px;background:#1a1a1a;border:1px solid rgba(255,255,255,0.07);border-radius:9px;color:#fff;font-family:'Cairo';font-size:0.9rem;}
    .fg input:focus{outline:none;border-color:rgba(255,255,255,0.2);}
    .err{background:rgba(192,57,43,0.1);color:var(--red-h);padding:9px 13px;border-radius:8px;font-size:0.85rem;margin-bottom:12px;display:none;}
    .btn-submit{width:100%;padding:12px;background:#fff;color:#000;font-weight:800;border:none;border-radius:9px;cursor:pointer;font-family:'Cairo';font-size:0.92rem;transition:0.2s;margin-top:4px;}
    .btn-submit:hover{background:#e5e5e5;}
    .btn-submit:disabled{opacity:0.5;cursor:not-allowed;}
    .post-editor{width:100%;min-height:150px;max-height:340px;overflow-y:auto;padding:13px;background:#1a1a1a;border:1px solid rgba(255,255,255,0.07);border-radius:12px;color:#fff;font-family:'Amiri',serif;font-size:1rem;line-height:1.8;outline:none;}
    .post-editor:focus{border-color:rgba(255,255,255,0.2);}
    .post-editor[placeholder]:empty:before{content:attr(placeholder);color:#555;pointer-events:none;}
    .post-editor h2{font-size:1.3rem;font-weight:800;color:#fff;margin:8px 0 4px;}
    .post-editor h3{font-size:1.1rem;font-weight:700;color:#ddd;margin:6px 0 4px;}
    .post-editor blockquote{border-right:3px solid var(--red);padding-right:12px;color:#aaa;margin:8px 0;font-style:italic;}
    .post-editor ul{padding-right:20px;margin:6px 0;}
    .post-editor hr{border:none;border-top:1px solid var(--border);margin:10px 0;}
    .fmt-btn{background:rgba(255,255,255,0.04);border:1px solid var(--border);color:#aaa;padding:5px 10px;border-radius:7px;cursor:pointer;font-family:'Cairo';font-size:0.8rem;font-weight:700;transition:0.15s;display:flex;align-items:center;justify-content:center;min-width:30px;}
    .fmt-btn:hover{background:rgba(255,255,255,0.09);color:#fff;}
    /* عرض المحتوى في الكروت */
    .post-html h2{font-size:1.2rem;font-weight:800;color:#fff;margin:8px 0 4px;}
    .post-html h3{font-size:1rem;font-weight:700;color:#ddd;margin:6px 0 4px;}
    .post-html blockquote{border-right:3px solid var(--red);padding-right:12px;color:#aaa;margin:8px 0;font-style:italic;}
    .post-html ul{padding-right:20px;margin:6px 0;}
    .post-html hr{border:none;border-top:1px solid var(--border);margin:10px 0;}
    .post-html b,.post-html strong{color:#fff;}
    .post-html em{color:#ccc;}
    .modal-footer{display:flex;gap:10px;justify-content:flex-end;margin-top:20px;}
    .btn-ghost{padding:10px 18px;background:rgba(255,255,255,0.04);border:1px solid var(--border);border-radius:9px;color:#ccc;cursor:pointer;font-family:'Cairo';font-size:0.88rem;}

    @media(max-width:600px){.topbar{padding:0 14px;}.card-body{padding:16px 18px;}}
  </style>
</head>
<body>

<header class="topbar">
  <div class="topbar-left">
    <img src="malines-icon.png" class="topbar-logo" onerror="this.style.display='none'" alt="">
    <span class="topbar-title">المنتدى الدولي</span>
  </div>
  <div class="topbar-right">

    <!-- زر الرسائل -->
    <a href="/chat" class="chat-icon-btn" id="chatBtn" title="الرسائل">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
      <span class="chat-unread" id="chatUnread"></span>
    </a>
    <!-- زر طلب التوثيق -->
<button
  class="chat-icon-btn"
  id="verifyBtn"
  title="طلب التوثيق"
  onclick="requestVerify()"
  style="display:none;"
>
  <svg width="18" height="18" viewBox="0 0 24 24">
    <circle cx="12" cy="12" r="10" fill="#1d9bf0"/>
    <path
      d="M8 12.5L10.5 15L16 9.5"
      fill="none"
      stroke="#ffffff"
      stroke-width="2.4"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
  </svg>
    </button>
    <button id="btnLogin" class="btn-login" onclick="openAuth()">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg>
      دخول / تسجيل
    </button>
    <div class="user-badge-wrap" id="userBadgeWrap" style="display:none;">
      <div class="user-badge" id="userBadgeEl" onclick="toggleDrop()"></div>
      <div class="user-dropdown" id="userDrop">
        <div class="dropdown-name" id="dropName"></div>
        <button id="adminBtn" onclick="location.href='/admin'" style="display:none;">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.07 4.93l-1.41 1.41M4.93 4.93l1.41 1.41M19.07 19.07l-1.41-1.41M4.93 19.07l1.41-1.41M21 12h-2M5 12H3M12 21v-2M12 5V3"/></svg>
          لوحة الإدارة
        </button>
        <button onclick="location.href='/profile'">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          الملف الشخصي
        </button>
        <button onclick="location.href='/chat'">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
          الرسائل
        </button>
        <button onclick="doLogout()">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
          تسجيل الخروج
        </button>
      </div>
    </div>
  </div>
</header>

<section class="page-header">
  <h1>المنتدى الدولي</h1>
  <p>القرارات، التصريحات، الأحداث والمقالات الدبلوماسية</p>
  <div class="search-wrap">
    <input type="text" id="searchInput" placeholder="ابحث في المنشورات...">
    <span class="search-icon"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg></span>
  </div>
</section>

<div class="post-bar" id="postBar">
  <button class="btn-post" onclick="openPostModal()">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
    منشور جديد
  </button>
</div>

<div id="feed" class="feed">
  <div class="loading"><div class="spinner"></div>جارٍ تحميل المنشورات...</div>
</div>

<!-- Auth Modal -->
<div class="modal-bd" id="authModal">
  <div class="modal-box">
    <div class="tabs">
      <button class="tab active" onclick="switchTab('login')">دخول</button>
      <button class="tab" onclick="switchTab('register')">حساب جديد</button>
    </div>
    <div class="tab-pane active" id="tabLogin">
      <div class="err" id="loginErr"></div>
      <div class="fg"><label>البريد</label><input type="email" id="lEmail" dir="ltr"></div>
      <div class="fg"><label>كلمة المرور</label><input type="password" id="lPass"></div>
      <button class="btn-submit" id="loginBtn" onclick="doLogin()">دخول</button>
    </div>
    <div class="tab-pane" id="tabReg">
      <div class="err" id="regErr"></div>
      <div class="fg"><label>اسم المستخدم</label><input type="text" id="rUser"></div>
      <div class="fg"><label>البريد</label><input type="email" id="rEmail" dir="ltr"></div>
      <div class="fg"><label>كلمة المرور</label><input type="password" id="rPass"></div>
      <button class="btn-submit" id="regBtn" onclick="doRegister()">إنشاء الحساب</button>
    </div>
  </div>
</div>

<!-- Post Modal -->
<div class="modal-bd" id="postModal">
  <div class="modal-box wide">
    <div class="modal-t">منشور جديد</div>
    <div class="err" id="postErr"></div>
    <!-- شريط التنسيق -->
    <div style="display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap;">
      <button class="fmt-btn" onclick="fmt('bold')" title="غامق">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M6 4h8a4 4 0 0 1 4 4 4 4 0 0 1-4 4H6z"/><path d="M6 12h9a4 4 0 0 1 4 4 4 4 0 0 1-4 4H6z"/></svg>
      </button>
      <button class="fmt-btn" onclick="fmt('italic')" title="مائل">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="19" y1="4" x2="10" y2="4"/><line x1="14" y1="20" x2="5" y2="20"/><line x1="15" y1="4" x2="9" y2="20"/></svg>
      </button>
      <button class="fmt-btn" onclick="fmt('underline')" title="تسطير">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 3v7a6 6 0 0 0 6 6 6 6 0 0 0 6-6V3"/><line x1="4" y1="21" x2="20" y2="21"/></svg>
      </button>
      <div style="width:1px;background:var(--border);margin:0 4px;"></div>
      <button class="fmt-btn" onclick="fmtBlock('h2')" title="عنوان كبير">H1</button>
      <button class="fmt-btn" onclick="fmtBlock('h3')" title="عنوان صغير">H2</button>
      <div style="width:1px;background:var(--border);margin:0 4px;"></div>
      <button class="fmt-btn" onclick="fmtList('ul')" title="قائمة نقطية">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
      </button>
      <button class="fmt-btn" onclick="fmtLine()" title="فاصل أفقي">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="5" y1="12" x2="19" y2="12"/></svg>
      </button>
      <button class="fmt-btn" onclick="fmtQuote()" title="اقتباس">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 21c3 0 7-1 7-8V5c0-1.25-.756-2.017-2-2H4c-1.25 0-2 .75-2 1.972V11c0 1.25.75 2 2 2 1 0 1 0 1 1v1c0 1-1 2-2 2s-1 .008-1 1.031V20c0 1 0 1 1 1z"/><path d="M15 21c3 0 7-1 7-8V5c0-1.25-.757-2.017-2-2h-4c-1.25 0-2 .75-2 1.972V11c0 1.25.75 2 2 2h.75c0 2.25.25 4-2.75 4v3c0 1 0 1 1 1z"/></svg>
      </button>
    </div>
    <div class="fg">
      <div id="postEditor" class="post-editor" contenteditable="true" dir="auto" placeholder="اكتب منشورك هنا..."></div>
    </div>
    <div class="modal-footer">
      <button class="btn-ghost" onclick="closeModal('postModal')">إلغاء</button>
      <button class="btn-submit" style="width:auto;padding:10px 24px;" id="postBtn" onclick="submitPost()">نشر</button>
    </div>
  </div>
</div>

<script>
const TOKEN  = localStorage.getItem('malines_token') || '';
const stored = localStorage.getItem('malines_user');
let ME = null;
let allPosts = [];
let dropVisible = false;

try { if(stored) ME = JSON.parse(stored); } catch(e) {}

// ── SVGs ──
// ── علامة التوثيق ──
function verifiedBadge(){
  return `
  <svg
    width="16"
    height="16"
    viewBox="0 0 24 24"
    aria-label="موثق"
    title="حساب موثق"
    style="vertical-align:middle;margin-right:4px;flex-shrink:0;"
  >
    <circle cx="12" cy="12" r="10" fill="#1d9bf0"/>
    <path
      d="M8 12.5L10.5 15L16 9.5"
      fill="none"
      stroke="#ffffff"
      stroke-width="2.4"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
  </svg>`;
}

const REACTIONS = [
  { emoji:'like',    label:'أعجبني',  icon:'👍' },
  { emoji:'heart',   label:'أحببته',  icon:'❤️' },
  { emoji:'haha',    label:'أضحكني',  icon:'😄' },
  { emoji:'sad',     label:'أحزنني',  icon:'😢' },
  { emoji:'angry',   label:'أغضبني',  icon:'😠' },
];

// ── Init ──
(async function init() {
  if (TOKEN) {
    try {
      const r = await fetch('/api/auth/me', { headers:{'Authorization':'Bearer '+TOKEN} });
      if (r.ok) {
        const u = await r.json();
        if (u && !u.error) {
          ME = { username: u.username, role: u.role, avatar: u.avatar||'', id: u.id };
          localStorage.setItem('malines_user', JSON.stringify(ME));
          setLoggedInUI(ME);
          // جلب أحدث بيانات (avatar من DB) في الخلفية
          fetch('/api/me', { headers:{'Authorization':'Bearer '+TOKEN} })
            .then(r=>r.ok?r.json():null)
            .then(full=>{ if(full&&!full.error&&full.avatar){ ME.avatar=full.avatar; setLoggedInUI(ME); } })
            .catch(()=>{});
        } else {
          localStorage.removeItem('malines_token');
          localStorage.removeItem('malines_user');
          ME = null;
        }
      }
    } catch(e) { if (ME) setLoggedInUI(ME); }
  }
  await loadPosts();
  if (ME && TOKEN) loadUnread();
})();

function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function fmtDate(s){ if(!s) return ''; return new Date(s).toLocaleDateString('ar-SA',{year:'numeric',month:'short',day:'numeric'}); }

async function apiFetch(url, method='GET', body=null){
  // نقرأ التوكن في كل طلب لضمان أحدث قيمة
  const token = localStorage.getItem('malines_token') || '';
  const opts = { method, headers:{'Content-Type':'application/json','Authorization':'Bearer '+token} };
  if(body) opts.body = JSON.stringify(body);
  const r = await fetch(url, opts);
  return r.json();
}

// ── Auth UI ──
function setLoggedInUI(user){
  ME = user;
  document.getElementById('btnLogin').style.display = 'none';
  document.getElementById('userBadgeWrap').style.display = 'block';
  document.getElementById('dropName').textContent = user.username;
  const el = document.getElementById('userBadgeEl');
  el.innerHTML = user.avatar ? `<img src="${esc(user.avatar)}" alt="">` : user.username.charAt(0).toUpperCase();
  const ab = document.getElementById('adminBtn');
  if(ab) ab.style.display = user.role==='admin' ? 'flex' : 'none';
  document.getElementById('postBar').style.display = 'block';
  // زر التوثيق
  checkVerifyStatus();
}

async function checkVerifyStatus(){
  if(!ME || !getToken()) return;
  try {
    const d = await apiFetch('/api/verify/status');
    const btn = document.getElementById('verifyBtn');
    if(!btn) return;
    if(d.verified){
      btn.style.display='none'; // موثق — لا حاجة للزر
    } else if(d.status==='pending'){
      btn.style.display='flex';
      btn.title='طلب التوثيق قيد المراجعة';
      btn.style.opacity='0.5';
      btn.onclick=()=>showToast('طلبك قيد المراجعة من الإدارة');
    } else {
      btn.style.display='flex';
      btn.title='اطلب التوثيق';
      btn.style.opacity='1';
      btn.onclick=requestVerify;
    }
  } catch(e){}
}

async function requestVerify(){
  if(!ME){ openAuth(); return; }
  try {
    const d = await apiFetch('/api/verify/request','POST');
    if(d.success){
      showToast('تم إرسال طلب التوثيق للإدارة');
      checkVerifyStatus();
    } else {
      showToast(d.error||'فشل الطلب', 'error');
    }
  } catch(e){ showToast('تعذر الاتصال','error'); }
}

function showToast(msg, type='success'){
  const t=document.createElement('div');
  t.style.cssText=`position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:${type==='error'?'rgba(192,57,43,0.95)':'rgba(15,15,16,0.97)'};color:#fff;padding:11px 20px;border-radius:12px;font-size:0.88rem;z-index:999;border:1px solid ${type==='error'?'rgba(231,76,60,0.4)':'var(--border)'};backdrop-filter:blur(16px);`;
  t.textContent=msg;
  document.body.appendChild(t);
  setTimeout(()=>t.remove(),3000);
}

function clearUser(){
  ME = null;
  localStorage.removeItem('malines_user');
  localStorage.removeItem('malines_token');
  localStorage.removeItem('malines_role');
  document.getElementById('btnLogin').style.display = 'flex';
  document.getElementById('userBadgeWrap').style.display = 'none';
  document.getElementById('postBar').style.display = 'none';
}

function toggleDrop(){ dropVisible=!dropVisible; document.getElementById('userDrop').classList.toggle('show',dropVisible); }
document.addEventListener('click', e=>{ if(!document.getElementById('userBadgeWrap').contains(e.target)){ document.getElementById('userDrop').classList.remove('show'); dropVisible=false; } });

// ── Modals ──
function openAuth(){ document.getElementById('authModal').classList.add('show'); }
function closeModal(id){ document.getElementById(id).classList.remove('show'); }
document.querySelectorAll('.modal-bd').forEach(m=>m.addEventListener('click',e=>{ if(e.target===m) m.classList.remove('show'); }));

function switchTab(t){
  document.querySelectorAll('.tab').forEach((b,i)=>b.classList.toggle('active',(i===0&&t==='login')||(i===1&&t==='register')));
  document.getElementById('tabLogin').classList.toggle('active',t==='login');
  document.getElementById('tabReg').classList.toggle('active',t==='register');
}

// ── Auth ──
async function doLogin(){
  const email=document.getElementById('lEmail').value.trim(), pass=document.getElementById('lPass').value;
  const errEl=document.getElementById('loginErr'); errEl.style.display='none';
  const btn=document.getElementById('loginBtn'); btn.disabled=true; btn.textContent='...';
  try {
    const d = await apiFetch('/api/login','POST',{email,password:pass});
    if(d.success){
      localStorage.setItem('malines_token',d.token);
      localStorage.setItem('malines_role',d.role);
      const u={username:d.username,role:d.role,avatar:d.avatar||''};
      localStorage.setItem('malines_user',JSON.stringify(u));
      setLoggedInUI(u);
      closeModal('authModal');
      await loadPosts();
      loadUnread();
    } else { errEl.textContent=d.error||'فشل'; errEl.style.display='block'; }
  } catch(e){ errEl.textContent='تعذر الاتصال'; errEl.style.display='block'; }
  finally { btn.disabled=false; btn.textContent='دخول'; }
}

async function doRegister(){
  const username=document.getElementById('rUser').value.trim(), email=document.getElementById('rEmail').value.trim(), pass=document.getElementById('rPass').value;
  const errEl=document.getElementById('regErr'); errEl.style.display='none';
  const btn=document.getElementById('regBtn'); btn.disabled=true; btn.textContent='...';
  try {
    const d = await apiFetch('/api/register','POST',{username,email,password:pass});
    if(d.success){
      localStorage.setItem('malines_token',d.token);
      localStorage.setItem('malines_role',d.role);
      const u={username:d.username,role:d.role,avatar:''};
      localStorage.setItem('malines_user',JSON.stringify(u));
      setLoggedInUI(u);
      closeModal('authModal');
      await loadPosts();
    } else { errEl.textContent=d.error||'فشل'; errEl.style.display='block'; }
  } catch(e){ errEl.textContent='تعذر الاتصال'; errEl.style.display='block'; }
  finally { btn.disabled=false; btn.textContent='إنشاء الحساب'; }
}

async function doLogout(){
  if(TOKEN) { try{ await apiFetch('/api/logout','POST'); }catch(e){} }
  clearUser();
  await loadPosts();
}

// ── Unread ──
async function loadUnread(){
  try {
    const d = await apiFetch('/api/messages/unread');
    const el = document.getElementById('chatUnread');
    if(d?.count>0){ el.style.display='block'; } else { el.style.display='none'; }
  } catch(e){}
}

// ── Posts ──
async function loadPosts(){
  try {
    const data = await apiFetch('/api/records');
    allPosts = Array.isArray(data) ? data : [];
    renderFeed(allPosts);
  } catch(e){ document.getElementById('feed').innerHTML='<div class="empty">فشل تحميل المنشورات</div>'; }
}

function renderFeed(posts){
  const feed = document.getElementById('feed');
  if(!posts.length){ feed.innerHTML='<div class="empty">لا توجد منشورات بعد</div>'; return; }
  feed.innerHTML = posts.map(p => renderPost(p)).join('');
}

function renderPost(p){
  const name       = p.publisher_name || p.publisher || '?';
  const avatarHtml = p.user_avatar ? `<img src="${esc(p.user_avatar)}" alt="">` : esc(name.charAt(0).toUpperCase());
  const badgeCls   = p.user_role==='Admin' ? 'badge-admin' : 'badge-member';
  const canDel     = ME && (ME.role==='admin' || p.user_id==ME?.id);
  const imgHtml    = p.image ? `<img class="card-img" src="${esc(p.image)}" loading="lazy" onerror="this.style.display='none'">` : '';

  // Reactions
  const totalReactions = (p.reactions||[]).reduce((s,r)=>s+(r.count||0),0);
  const userR = p.userReaction;
  const activeR = userR ? REACTIONS.find(r=>r.emoji===userR) : null;
  const reactionHtml = `<div class="react-wrap">
    <button class="react-main-btn ${userR?'reacted':''}" onclick="toggleReactMenu(${p.id})">
      ${activeR ? activeR.icon : '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 9V5a3 3 0 0 0-3-3l-4 9v11h11.28a2 2 0 0 0 2-1.7l1.38-9a2 2 0 0 0-2-2.3H14z"/><path d="M7 22H4a2 2 0 0 1-2-2v-7a2 2 0 0 1 2-2h3"/></svg>'}
      <span>${totalReactions||'تفاعل'}</span>
    </button>
    <div class="react-menu" id="rmenu-${p.id}">
      ${REACTIONS.map(r=>`<button class="react-emoji-btn ${p.userReaction===r.emoji?'active':''}" onclick="toggleReact(${p.id},'${r.emoji}')" title="${r.label}">${r.icon}</button>`).join('')}
    </div>
  </div>`;

  // Comments count
  const commCount = (p.comments||[]).length;

  // Comments list
  const commentsHtml = (p.comments||[]).map(c=>{
    const ca = c.avatar ? `<img src="${esc(c.avatar)}" alt="">` : esc((c.display_name||c.username||'?').charAt(0).toUpperCase());
    const cBadge = c.user_role==='Admin' ? `<span class="role-badge badge-admin">Admin</span>` : '';
    const canDelC = ME && (ME.role==='admin' || c.user_id==ME?.id);
    return `<div class="comment" id="cmt-${c.id}">
      <div class="c-avatar">${ca}</div>
      <div class="c-bubble">
        <div class="c-name">${esc(c.display_name||c.username)} ${cBadge} ${canDelC?`<button class="c-del" onclick="delComment(${c.id},${p.id})">${SVG.delete}</button>`:''}</div>
        <div class="c-text">${esc(c.content)}</div>
      </div>
    </div>`;
  }).join('');

  const commentInputHtml = ME ? `<div class="comment-input-row">
    <input class="comment-input" type="text" placeholder="أضف تعليقاً..." id="ci-${p.id}" onkeydown="if(event.key==='Enter')sendComment(${p.id})">
    <button class="btn-send-comment" onclick="sendComment(${p.id})">${SVG.send}</button>
  </div>` : '';

  return `<div class="post-card" id="post-${p.id}">
    ${imgHtml}
    <div class="card-body">
      <div class="pub-row">
        <div class="pub-info">
          <div class="pub-avatar" onclick="goProfile('${esc(p.publisher)}')" style="cursor:pointer;">${avatarHtml}</div>
          <div>
            <div class="pub-name pub-name-link" onclick="goProfile('${esc(p.publisher)}')">
              <span class="role-badge ${badgeCls}">${esc(p.user_role)}</span>
              ${esc(name)}
              ${(p.publisher_verified||p.user_verified) ? verifiedBadge() : ''}
            </div>
            <div class="pub-date">${fmtDate(p.created_at)}</div>
          </div>
        </div>
        <div class="pub-actions">
          ${ME && p.user_id && p.user_id!=ME?.id ? `<button class="btn-icon" onclick="location.href='/chat?with=${esc(p.publisher)}'" title="مراسلة">${SVG.comment}</button>` : ''}
          ${canDel ? `<button class="btn-icon" onclick="delPost(${p.id})" title="حذف">${SVG.delete}</button>` : ''}
        </div>
      </div>
      <div class="post-text post-html" style="font-family:'Amiri',serif;line-height:2;color:#ccc;font-size:1rem;margin-bottom:16px;">${p.content}</div>
      <div class="reactions-row">
        ${reactionHtml}
        <button class="react-btn" onclick="toggleComments(${p.id})" id="cmtToggle-${p.id}">
          ${SVG.comment}<span>${commCount} تعليق</span>
        </button>
      </div>
      <div class="comments-section" id="cmtSec-${p.id}" style="display:none;">
        <div class="comments-list" id="cmtList-${p.id}">${commentsHtml}</div>
        ${commentInputHtml}
      </div>
    </div>
  </div>`;
}

function goProfile(username){ window.location = '/profile?u=' + encodeURIComponent(username); }

// ── Search ──
document.getElementById('searchInput').addEventListener('input', function(){
  const q = this.value.trim().toLowerCase();
  renderFeed(q ? allPosts.filter(p=>p.content.toLowerCase().includes(q)||p.publisher.toLowerCase().includes(q)) : allPosts);
});

// ── Post ──
function openPostModal(){ if(!ME){openAuth();return;} const ed=document.getElementById('postEditor'); if(ed) ed.innerHTML=''; document.getElementById('postErr').style.display='none'; document.getElementById('postModal').classList.add('show'); setTimeout(()=>document.getElementById('postEditor')?.focus(),100); }

// ── دوال التنسيق ──
function fmt(cmd){ document.execCommand(cmd, false, null); document.getElementById('postEditor')?.focus(); }
function fmtBlock(tag){
  const sel = window.getSelection();
  if(!sel.rangeCount) return;
  const range = sel.getRangeAt(0);
  const el = document.createElement(tag);
  el.appendChild(range.extractContents());
  range.insertNode(el);
  document.getElementById('postEditor')?.focus();
}
function fmtList(type){
  document.execCommand(type==='ul'?'insertUnorderedList':'insertOrderedList', false, null);
  document.getElementById('postEditor')?.focus();
}
function fmtLine(){
  document.execCommand('insertHorizontalRule', false, null);
  document.getElementById('postEditor')?.focus();
}
function fmtQuote(){
  const sel = window.getSelection();
  if(!sel.rangeCount) return;
  const range = sel.getRangeAt(0);
  const bq = document.createElement('blockquote');
  bq.appendChild(range.extractContents());
  range.insertNode(bq);
  document.getElementById('postEditor')?.focus();
}

async function submitPost(){
  const editor = document.getElementById('postEditor');
  const content = editor?.innerHTML?.trim();
  const errEl = document.getElementById('postErr'); errEl.style.display='none';
  if(!content || content==='<br>'){ errEl.textContent='المحتوى مطلوب'; errEl.style.display='block'; return; }
  const btn=document.getElementById('postBtn'); btn.disabled=true; btn.textContent='...';
  try {
    const d=await apiFetch('/api/records','POST',{content});
    if(d.success){ closeModal('postModal'); await loadPosts(); }
    else { errEl.textContent=d.error||'فشل النشر'; errEl.style.display='block'; }
  } catch(e){ errEl.textContent='تعذر الاتصال'; errEl.style.display='block'; }
  finally { btn.disabled=false; btn.textContent='نشر'; }
}

async function delPost(id){
  if(!confirm('حذف هذا المنشور؟')) return;
  await apiFetch('/api/records/'+id,'DELETE');
  allPosts=allPosts.filter(p=>p.id!==id);
  document.getElementById('post-'+id)?.remove();
}

// ── Reactions ──
function toggleReactMenu(postId){
  if(!ME){openAuth();return;}
  const menu = document.getElementById('rmenu-'+postId);
  if(!menu) return;
  document.querySelectorAll('.react-menu.show').forEach(m=>{ if(m!==menu) m.classList.remove('show'); });
  menu.classList.toggle('show');
}
document.addEventListener('click', e=>{
  if(!e.target.closest('.react-wrap')) document.querySelectorAll('.react-menu.show').forEach(m=>m.classList.remove('show'));
});

async function toggleReact(postId, emoji){
  if(!ME){openAuth();return;}
  document.querySelectorAll('.react-menu.show').forEach(m=>m.classList.remove('show'));
  const d=await apiFetch('/api/records/'+postId+'/react','POST',{emoji});
  if(!d.success) return;
  const post=allPosts.find(p=>p.id===postId);
  if(post){ post.reactions=d.reactions; post.userReaction=d.userReaction; }
  const card=document.getElementById('post-'+postId);
  if(card){ const newCard=document.createElement('div'); newCard.innerHTML=renderPost(post); card.replaceWith(newCard.firstChild); }
}

// ── Comments ──
function toggleComments(id){
  const sec=document.getElementById('cmtSec-'+id);
  if(sec) sec.style.display=sec.style.display==='none'?'block':'none';
}

async function sendComment(postId){
  if(!ME){openAuth();return;}
  const input=document.getElementById('ci-'+postId);
  if(!input||!input.value.trim()) return;
  const content=input.value.trim(); input.value='';
  const d=await apiFetch('/api/records/'+postId+'/comments','POST',{content});
  if(!d.success) return;
  const comments=await apiFetch('/api/records/'+postId+'/comments');
  const post=allPosts.find(p=>p.id===postId);
  if(post){ post.comments=comments; }
  const card=document.getElementById('post-'+postId);
  if(card){ const newCard=document.createElement('div'); newCard.innerHTML=renderPost(post); card.replaceWith(newCard.firstChild); document.getElementById('cmtSec-'+postId).style.display='block'; }
}

async function delComment(commentId, postId){
  if(!confirm('حذف التعليق؟')) return;
  await apiFetch('/api/comments/'+commentId,'DELETE');
  document.getElementById('cmt-'+commentId)?.remove();
}

document.getElementById('lPass').addEventListener('keydown',e=>{if(e.key==='Enter')doLogin();});
document.getElementById('lEmail').addEventListener('keydown',e=>{if(e.key==='Enter')doLogin();});
</script>
</body>
</html>
