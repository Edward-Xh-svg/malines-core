<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="malines-fivcon.png" type="image/png">
    <title>المنتدى الدولي | مجتمع مالينز</title>
    <script>window.va=window.va||function(){(window.vaq=window.vaq||[]).push(arguments);};</script>
    <script defer src="/_vercel/insights/script.js"></script>
    <script>window.si=window.si||function(){(window.siq=window.siq||[]).push(arguments);};</script>
    <script defer src="/_vercel/speed-insights/script.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800;900&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root { --black:#050505;--dark:#0a0a0a;--card:#0f0f10;--border:#232325;--text:#e9e9e9;--muted:#8d8d8d;--red:#c0392b;--red-hover:#e74c3c;--accent:#d4af37; }
        *{margin:0;padding:0;box-sizing:border-box;}
        html{scroll-behavior:smooth;}
        body{background:radial-gradient(circle at 18% 16%,rgba(192,57,43,0.10),transparent 22%),radial-gradient(circle at 82% 14%,rgba(212,175,55,0.06),transparent 18%),var(--black);color:var(--text);font-family:'Cairo',sans-serif;overflow-x:hidden;}
        .stars{position:fixed;inset:0;pointer-events:none;z-index:0;opacity:0.7;background:radial-gradient(1px 1px at 12% 18%,rgba(255,255,255,0.12),transparent),radial-gradient(1px 1px at 78% 28%,rgba(255,255,255,0.08),transparent),radial-gradient(1.5px 1.5px at 42% 72%,rgba(255,255,255,0.10),transparent);animation:starsMove 38s linear infinite;}
        @keyframes starsMove{from{transform:translateY(0);}to{transform:translateY(-30px);}}

        /* Topbar */
        .topbar{position:fixed;top:0;left:0;right:0;height:68px;background:rgba(5,5,5,0.58);backdrop-filter:blur(28px);border-bottom:1px solid rgba(255,255,255,0.04);display:flex;align-items:center;justify-content:space-between;padding:0 32px;z-index:100;}
        .topbar-left{display:flex;align-items:center;gap:12px;}
        .topbar-logo{width:36px;height:36px;border-radius:50%;object-fit:cover;}
        .topbar-title{font-weight:800;font-size:1.1rem;background:linear-gradient(135deg,#fff,#cfcfcf);-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
        .topbar-right{display:flex;align-items:center;gap:12px;}
        .btn-login{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.14);color:#d7d7d7;padding:9px 20px;border-radius:999px;cursor:pointer;transition:0.25s;font-family:'Cairo';font-size:0.9rem;}
        .btn-login:hover{border-color:rgba(255,255,255,0.3);color:#fff;background:rgba(255,255,255,0.06);}
        .user-badge{width:42px;height:42px;border-radius:50%;overflow:hidden;background:linear-gradient(135deg,var(--red),#8e2a1f);color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center;cursor:pointer;position:relative;font-size:1.1rem;}
        .user-badge img{width:100%;height:100%;object-fit:cover;}
        .user-dropdown{position:absolute;top:52px;left:0;background:rgba(10,10,10,0.96);backdrop-filter:blur(20px);border:1px solid var(--border);border-radius:14px;padding:8px 0;min-width:190px;opacity:0;visibility:hidden;transform:translateY(-8px);transition:0.25s;z-index:10;}
        .user-dropdown.show{opacity:1;visibility:visible;transform:translateY(0);}
        .dropdown-name{padding:10px 16px;font-size:0.88rem;color:#aaa;border-bottom:1px solid var(--border);margin-bottom:4px;}
        .user-dropdown button{width:100%;text-align:right;padding:10px 16px;background:none;border:none;color:#ccc;cursor:pointer;font-family:'Cairo';font-size:0.9rem;}
        .user-dropdown button:hover{background:rgba(255,255,255,0.04);color:#fff;}

        /* Header */
        .records-header{position:relative;padding:120px 24px 48px;text-align:center;z-index:2;}
        .records-header h1{font-size:clamp(2rem,5vw,3rem);font-weight:900;background:linear-gradient(to bottom,#fff,#b6b6b6);-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
        .records-header p{color:var(--muted);margin-top:12px;}
        .search-bar{max-width:600px;margin:32px auto 0;position:relative;}
        .search-bar input{width:100%;padding:14px 20px 14px 48px;background:#1a1a1a;border:1px solid var(--border);border-radius:60px;color:#fff;font-family:'Cairo';font-size:1rem;}
        .search-bar input:focus{outline:none;border-color:var(--red);}
        .search-icon{position:absolute;left:18px;top:50%;transform:translateY(-50%);color:#666;pointer-events:none;}

        /* Post button */
        .post-btn-wrap{max-width:860px;margin:24px auto 0;padding:0 24px;display:none;}
        .btn-new-post{display:flex;align-items:center;gap:10px;background:rgba(192,57,43,0.1);border:1px solid rgba(192,57,43,0.25);color:var(--red-hover);padding:12px 24px;border-radius:12px;cursor:pointer;font-family:'Cairo';font-size:0.95rem;font-weight:700;transition:0.2s;}
        .btn-new-post:hover{background:rgba(192,57,43,0.18);}

        /* Records */
        .records-container{max-width:860px;margin:24px auto 80px;padding:0 24px;display:flex;flex-direction:column;gap:28px;}
        .record-card{background:linear-gradient(180deg,rgba(255,255,255,0.03),rgba(255,255,255,0.012));border:1px solid var(--border);border-radius:24px;overflow:hidden;transition:transform 0.25s,border-color 0.2s;}
        .record-card:hover{transform:translateY(-2px);border-color:rgba(255,255,255,0.15);}
        .card-img{width:100%;max-height:300px;object-fit:cover;}
        .card-content{padding:24px 28px;}
        .publisher-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;}
        .publisher-info{display:flex;align-items:center;gap:12px;}
        .avatar{width:44px;height:44px;border-radius:50%;background:linear-gradient(145deg,var(--red),#8e2a1f);display:flex;align-items:center;justify-content:center;font-weight:bold;font-size:1.2rem;color:white;flex-shrink:0;overflow:hidden;}
        .avatar img{width:100%;height:100%;object-fit:cover;}
        .publisher-name{font-weight:700;font-size:1rem;color:#fff;}
        .badge{display:inline-block;padding:2px 10px;border-radius:999px;font-size:0.72rem;font-weight:700;margin-top:3px;}
        .badge-admin{background:rgba(192,57,43,0.15);color:var(--red-hover);border:1px solid rgba(192,57,43,0.25);}
        .badge-member{background:rgba(255,255,255,0.05);color:var(--muted);border:1px solid var(--border);}
        .post-date{font-size:0.78rem;color:var(--muted);}
        .record-text{font-family:'Amiri',serif;line-height:2;color:#d0d0d0;font-size:1.05rem;white-space:pre-wrap;}
        .card-actions{display:flex;justify-content:flex-end;margin-top:14px;}
        .btn-delete-post{background:none;border:none;color:#555;cursor:pointer;font-size:0.8rem;padding:4px 10px;border-radius:6px;transition:0.2s;font-family:'Cairo';}
        .btn-delete-post:hover{background:rgba(192,57,43,0.1);color:var(--red-hover);}

        .no-results{text-align:center;padding:60px;color:var(--muted);}
        .loading-spinner{text-align:center;padding:60px;color:var(--muted);}
        .spinner{width:40px;height:40px;border:3px solid #2a2a2a;border-top-color:var(--red);border-radius:50%;animation:spin 1s linear infinite;margin:0 auto 16px;}
        @keyframes spin{to{transform:rotate(360deg);}}
        .footer{text-align:center;padding:30px;color:#444;border-top:1px solid rgba(255,255,255,0.03);}

        /* Modals */
        .modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,0.85);backdrop-filter:blur(12px);display:flex;align-items:center;justify-content:center;z-index:200;opacity:0;visibility:hidden;transition:0.3s;padding:20px;}
        .modal-backdrop.active{opacity:1;visibility:visible;}
        .modal-box{background:linear-gradient(180deg,#121213,#0d0d0e);border:1px solid rgba(255,255,255,0.08);border-radius:24px;padding:36px 30px;max-width:460px;width:100%;text-align:right;transform:translateY(10px);transition:transform 0.3s;max-height:90vh;overflow-y:auto;}
        .modal-backdrop.active .modal-box{transform:translateY(0);}
        .modal-title{font-size:1.3rem;font-weight:800;color:#fff;margin-bottom:8px;}
        .modal-tabs{display:flex;gap:4px;background:rgba(255,255,255,0.03);border-radius:10px;padding:4px;margin-bottom:24px;}
        .tab-btn{flex:1;padding:9px;border:none;border-radius:8px;cursor:pointer;font-family:'Cairo';font-size:0.88rem;font-weight:700;background:none;color:var(--muted);transition:0.2s;}
        .tab-btn.active{background:rgba(255,255,255,0.08);color:#fff;}
        .tab-panel{display:none;}
        .tab-panel.active{display:block;}
        .form-group{margin-bottom:16px;}
        .form-group label{display:block;margin-bottom:7px;color:#aaa;font-size:0.88rem;}
        .form-group input{width:100%;padding:12px 14px;background:#1a1a1a;border:1px solid rgba(255,255,255,0.08);border-radius:10px;color:#fff;font-family:'Cairo';font-size:0.92rem;}
        .form-group input:focus{outline:none;border-color:rgba(255,255,255,0.25);}
        .form-error{background:rgba(192,57,43,0.1);color:var(--red-hover);padding:10px 14px;border-radius:8px;margin-bottom:14px;font-size:0.88rem;display:none;}
        .btn-submit{width:100%;padding:13px;background:#fff;color:#000;font-weight:800;border:none;border-radius:10px;cursor:pointer;font-family:'Cairo';font-size:0.95rem;transition:0.2s;margin-top:4px;}
        .btn-submit:hover{background:#e5e5e5;}
        .btn-submit:disabled{opacity:0.5;cursor:not-allowed;}

        /* Post modal */
        .post-modal-box{max-width:620px;}
        .post-textarea{width:100%;padding:14px;background:#1a1a1a;border:1px solid rgba(255,255,255,0.08);border-radius:12px;color:#fff;font-family:'Amiri',serif;font-size:1rem;resize:vertical;min-height:140px;line-height:1.8;}
        .post-textarea:focus{outline:none;border-color:rgba(255,255,255,0.25);}
        .img-upload-area{border:2px dashed var(--border);border-radius:12px;padding:20px;text-align:center;cursor:pointer;transition:0.2s;margin-bottom:16px;}
        .img-upload-area:hover{border-color:rgba(255,255,255,0.25);}
        .img-preview{max-width:100%;border-radius:10px;max-height:200px;object-fit:cover;display:none;margin-top:12px;}

        @media(max-width:640px){.topbar{padding:0 16px;}.card-content{padding:18px 20px;}}
    </style>
</head>
<body>
<div class="stars"></div>

<header class="topbar">
    <div class="topbar-left">
        <img src="malines-icon.png" alt="Malines" class="topbar-logo" onerror="this.style.display='none'">
        <span class="topbar-title">مجتمع مالينز — المنتدى الدولي</span>
    </div>
    <div class="topbar-right">
        <button id="btnLogin" class="btn-login" onclick="openAuthModal()">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4M10 17l5-5-5-5M13.8 12H3"/></svg>
            <span>تسجيل الدخول</span>
        </button>
        <div id="userBadge" style="display:none;position:relative;cursor:pointer;" onclick="toggleDropdown()">
            <div class="user-badge" id="userAvatarEl"></div>
            <div id="userDropdown" class="user-dropdown">
                <div class="dropdown-name" id="dropdownUsername"></div>
                <button id="adminPanelBtn" onclick="window.location.href='/admin'" style="display:none;">⚙️ لوحة الإدارة</button>
                <button onclick="window.location.href='/profile'">👤 الملف الشخصي</button>
                <button onclick="handleLogout()">تسجيل الخروج</button>
            </div>
        </div>
    </div>
</header>

<section class="records-header">
    <h1>المنتدى الدولي</h1>
    <p>القرارات، التصريحات، الأحداث والمقالات الدبلوماسية</p>
    <div class="search-bar">
        <input type="text" id="searchInput" placeholder="ابحث في المنشورات...">
        <span class="search-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg></span>
    </div>
</section>

<div class="post-btn-wrap" id="postBtnWrap">
    <button class="btn-new-post" onclick="openPostModal()">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        منشور جديد
    </button>
</div>

<div id="recordsContainer" class="records-container">
    <div class="loading-spinner"><div class="spinner"></div> جاري تحميل المنشورات...</div>
</div>

<footer class="footer">مجتمع مالينز &copy; 2026 · المنتدى الدولي</footer>

<!-- Auth Modal -->
<div id="authModal" class="modal-backdrop">
    <div class="modal-box">
        <div class="modal-tabs">
            <button class="tab-btn active" onclick="switchTab('login')">تسجيل الدخول</button>
            <button class="tab-btn" onclick="switchTab('register')">إنشاء حساب</button>
        </div>
        <!-- Login -->
        <div class="tab-panel active" id="tabLogin">
            <div class="form-error" id="loginError"></div>
            <div class="form-group"><label>البريد الإلكتروني</label><input type="email" id="loginEmail" dir="ltr"></div>
            <div class="form-group"><label>كلمة المرور</label><input type="password" id="loginPass"></div>
            <button class="btn-submit" id="loginBtn" onclick="doLogin()">دخول</button>
        </div>
        <!-- Register -->
        <div class="tab-panel" id="tabRegister">
            <div class="form-error" id="regError"></div>
            <div class="form-group"><label>اسم المستخدم</label><input type="text" id="regUsername"></div>
            <div class="form-group"><label>البريد الإلكتروني</label><input type="email" id="regEmail" dir="ltr"></div>
            <div class="form-group"><label>كلمة المرور</label><input type="password" id="regPass"></div>
            <button class="btn-submit" id="regBtn" onclick="doRegister()">إنشاء الحساب</button>
        </div>
    </div>
</div>

<!-- Post Modal -->
<div id="postModal" class="modal-backdrop">
    <div class="modal-box post-modal-box">
        <div class="modal-title" style="margin-bottom:20px;">✍️ منشور جديد</div>
        <div class="form-error" id="postError"></div>
        <div class="form-group">
            <label>المحتوى *</label>
            <textarea class="post-textarea" id="postContent" placeholder="اكتب منشورك هنا..."></textarea>
        </div>
        <div class="img-upload-area" onclick="document.getElementById('postImageInput').click()">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#666" stroke-width="2" style="margin:0 auto 8px;display:block;"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
            <div style="color:#666;font-size:0.88rem;">اضغط لرفع صورة (اختياري)</div>
            <img id="postImgPreview" class="img-preview">
            <input type="file" id="postImageInput" accept="image/*" style="display:none;" onchange="handleImageSelect(event)">
        </div>
        <div style="display:flex;gap:10px;justify-content:flex-end;margin-top:4px;">
            <button style="padding:11px 20px;background:rgba(255,255,255,0.05);border:1px solid var(--border);border-radius:10px;color:#ccc;cursor:pointer;font-family:'Cairo';" onclick="closePostModal()">إلغاء</button>
            <button class="btn-submit" style="width:auto;padding:11px 24px;" id="postSubmitBtn" onclick="submitPost()">نشر</button>
        </div>
    </div>
</div>

<script>
// ==================== Auth State ====================
const STORAGE_KEY = 'malines_user';
let TOKEN = localStorage.getItem('malines_token') || '';
let currentUser = null;
let dropdownVisible = false;
let selectedImageBase64 = '';
let allPosts = [];

const btnLogin = document.getElementById('btnLogin');
const userBadge = document.getElementById('userBadge');
const userAvatarEl = document.getElementById('userAvatarEl');
const dropdownUsername = document.getElementById('dropdownUsername');

// ==================== Init ====================
(async function init() {
    const stored = localStorage.getItem(STORAGE_KEY);
    if (stored && TOKEN) {
        try {
            const u = JSON.parse(stored);
            if (u.username) setLoggedInUI(u);
        } catch(e) { clearUser(); }
    }
    await loadPosts();
})();

// ==================== Auth UI ====================
function setLoggedInUI(user) {
    currentUser = user;
    btnLogin.style.display = 'none';
    userBadge.style.display = 'block';
    dropdownUsername.textContent = user.username;
    if (user.avatar) {
        userAvatarEl.innerHTML = `<img src="${user.avatar}" alt="${user.username}">`;
    } else {
        userAvatarEl.textContent = user.username.charAt(0).toUpperCase();
    }
    const ab = document.getElementById('adminPanelBtn');
    if (ab) ab.style.display = user.role === 'admin' ? 'block' : 'none';
    document.getElementById('postBtnWrap').style.display = 'block';
}

function clearUser() {
    TOKEN = '';
    currentUser = null;
    localStorage.removeItem(STORAGE_KEY);
    localStorage.removeItem('malines_token');
    localStorage.removeItem('malines_role');
    btnLogin.style.display = 'flex';
    userBadge.style.display = 'none';
    document.getElementById('postBtnWrap').style.display = 'none';
}

function toggleDropdown() {
    dropdownVisible = !dropdownVisible;
    document.getElementById('userDropdown').classList.toggle('show', dropdownVisible);
}
document.addEventListener('click', e => {
    if (!userBadge.contains(e.target)) {
        document.getElementById('userDropdown').classList.remove('show');
        dropdownVisible = false;
    }
});

// ==================== Auth Modal ====================
function openAuthModal() { document.getElementById('authModal').classList.add('active'); }
function closeAuthModal() { document.getElementById('authModal').classList.remove('active'); }
document.getElementById('authModal').addEventListener('click', e => { if(e.target===document.getElementById('authModal')) closeAuthModal(); });

function switchTab(tab) {
    document.querySelectorAll('.tab-btn').forEach((b,i) => b.classList.toggle('active', (i===0&&tab==='login')||(i===1&&tab==='register')));
    document.getElementById('tabLogin').classList.toggle('active', tab==='login');
    document.getElementById('tabRegister').classList.toggle('active', tab==='register');
}

async function doLogin() {
    const email = document.getElementById('loginEmail').value.trim();
    const password = document.getElementById('loginPass').value;
    const errEl = document.getElementById('loginError');
    errEl.style.display = 'none';
    const btn = document.getElementById('loginBtn');
    btn.disabled = true; btn.textContent = '...';
    try {
        const r = await fetch('/api/login', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({email,password}) });
        const data = await r.json();
        if (data.success) {
            TOKEN = data.token;
            localStorage.setItem('malines_token', TOKEN);
            localStorage.setItem('malines_role', data.role);
            const user = { username: data.username, role: data.role, avatar: data.avatar || '' };
            localStorage.setItem(STORAGE_KEY, JSON.stringify(user));
            setLoggedInUI(user);
            closeAuthModal();
            await loadPosts();
        } else {
            errEl.textContent = data.error || 'فشل تسجيل الدخول';
            errEl.style.display = 'block';
        }
    } catch(e) { errEl.textContent = 'تعذر الاتصال'; errEl.style.display = 'block'; }
    finally { btn.disabled = false; btn.textContent = 'دخول'; }
}

async function doRegister() {
    const username = document.getElementById('regUsername').value.trim();
    const email = document.getElementById('regEmail').value.trim();
    const password = document.getElementById('regPass').value;
    const errEl = document.getElementById('regError');
    errEl.style.display = 'none';
    const btn = document.getElementById('regBtn');
    btn.disabled = true; btn.textContent = '...';
    try {
        const r = await fetch('/api/register', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({username,email,password}) });
        const data = await r.json();
        if (data.success) {
            TOKEN = data.token;
            localStorage.setItem('malines_token', TOKEN);
            localStorage.setItem('malines_role', data.role);
            const user = { username: data.username, role: data.role, avatar: '' };
            localStorage.setItem(STORAGE_KEY, JSON.stringify(user));
            setLoggedInUI(user);
            closeAuthModal();
            await loadPosts();
        } else {
            errEl.textContent = data.error || 'فشل إنشاء الحساب';
            errEl.style.display = 'block';
        }
    } catch(e) { errEl.textContent = 'تعذر الاتصال'; errEl.style.display = 'block'; }
    finally { btn.disabled = false; btn.textContent = 'إنشاء الحساب'; }
}

async function handleLogout() {
    if (TOKEN) {
        try { await fetch('/api/logout', { method:'POST', headers:{'Authorization':'Bearer '+TOKEN} }); } catch(e) {}
    }
    clearUser();
    await loadPosts();
}

// ==================== Posts ====================
async function loadPosts() {
    try {
        const res = await fetch('/api/records');
        allPosts = await res.json();
        renderPosts(allPosts);
    } catch(e) {
        document.getElementById('recordsContainer').innerHTML = '<div class="no-results">⚠️ فشل تحميل المنشورات</div>';
    }
}

function renderPosts(posts) {
    const container = document.getElementById('recordsContainer');
    if (!posts.length) { container.innerHTML = '<div class="no-results">لا توجد منشورات بعد.</div>'; return; }
    container.innerHTML = posts.map(p => {
        const initial = (p.publisher||'?').charAt(0).toUpperCase();
        const avatarHtml = p.user_avatar
            ? `<img src="${esc(p.user_avatar)}" alt="${esc(p.publisher)}">`
            : initial;
        const badgeClass = p.user_role === 'Admin' ? 'badge-admin' : 'badge-member';
        const canDelete = currentUser && (currentUser.role === 'admin' || p.user_id == currentUser?.id);
        const deleteBtn = canDelete ? `<button class="btn-delete-post" onclick="deletePost(${p.id})">حذف</button>` : '';
        const imgHtml = p.image ? `<img class="card-img" src="${esc(p.image)}" loading="lazy" onerror="this.style.display='none'">` : '';
        return `
        <div class="record-card" id="post-${p.id}">
            ${imgHtml}
            <div class="card-content">
                <div class="publisher-row">
                    <div class="publisher-info">
                        <div class="avatar">${avatarHtml}</div>
                        <div>
                            <div class="publisher-name">${esc(p.publisher)}</div>
                            <span class="badge ${badgeClass}">${esc(p.user_role)}</span>
                        </div>
                    </div>
                    <div class="post-date">${fmtDate(p.created_at)}</div>
                </div>
                <div class="record-text">${esc(p.content)}</div>
                <div class="card-actions">${deleteBtn}</div>
            </div>
        </div>`;
    }).join('');
}

// Search
document.getElementById('searchInput').addEventListener('input', function() {
    const q = this.value.trim().toLowerCase();
    renderPosts(q ? allPosts.filter(p => p.content.toLowerCase().includes(q) || p.publisher.toLowerCase().includes(q)) : allPosts);
});

// ==================== New Post ====================
function openPostModal() {
    if (!currentUser) { openAuthModal(); return; }
    document.getElementById('postContent').value = '';
    document.getElementById('postImgPreview').style.display = 'none';
    document.getElementById('postError').style.display = 'none';
    selectedImageBase64 = '';
    document.getElementById('postModal').classList.add('active');
}
function closePostModal() { document.getElementById('postModal').classList.remove('active'); }
document.getElementById('postModal').addEventListener('click', e => { if(e.target===document.getElementById('postModal')) closePostModal(); });

function handleImageSelect(e) {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = function(ev) {
        selectedImageBase64 = ev.target.result;
        const preview = document.getElementById('postImgPreview');
        preview.src = selectedImageBase64;
        preview.style.display = 'block';
    };
    reader.readAsDataURL(file);
}

async function submitPost() {
    const content = document.getElementById('postContent').value.trim();
    const errEl = document.getElementById('postError');
    const btn = document.getElementById('postSubmitBtn');
    errEl.style.display = 'none';
    if (!content) { errEl.textContent = 'المحتوى مطلوب'; errEl.style.display = 'block'; return; }

    btn.disabled = true; btn.textContent = 'جارٍ النشر...';
    try {
        let imageUrl = '';
        // رفع الصورة إلى Cloudinary إذا وُجدت
        if (selectedImageBase64) {
            const upRes = await fetch('/api/upload', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + TOKEN },
                body: JSON.stringify({ image: selectedImageBase64 })
            });
            const upData = await upRes.json();
            if (upData.url) imageUrl = upData.url;
        }

        const r = await fetch('/api/records', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + TOKEN },
            body: JSON.stringify({ content, image: imageUrl })
        });
        const data = await r.json();
        if (data.success) {
            closePostModal();
            await loadPosts();
        } else {
            errEl.textContent = data.error || 'فشل النشر';
            errEl.style.display = 'block';
        }
    } catch(e) { errEl.textContent = 'تعذر الاتصال'; errEl.style.display = 'block'; }
    finally { btn.disabled = false; btn.textContent = 'نشر'; }
}

async function deletePost(id) {
    if (!confirm('هل تريد حذف هذا المنشور؟')) return;
    try {
        await fetch('/api/records/' + id, { method:'DELETE', headers:{'Authorization':'Bearer '+TOKEN} });
        document.getElementById('post-' + id)?.remove();
        allPosts = allPosts.filter(p => p.id !== id);
    } catch(e) { alert('فشل الحذف'); }
}

// ==================== Helpers ====================
function esc(s) {
    return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function fmtDate(s) {
    if (!s) return '';
    return new Date(s).toLocaleDateString('ar-SA', { year:'numeric', month:'short', day:'numeric' });
}

document.getElementById('loginPass').addEventListener('keydown', e => { if(e.key==='Enter') doLogin(); });
</script>
