<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="malines-fivcon.png" type="image/png">
  <title>الرسائل | مجتمع مالينز</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root{--black:#050505;--dark:#0a0a0a;--card:#0f0f10;--border:#232325;--text:#e9e9e9;--muted:#8d8d8d;--red:#c0392b;--red-h:#e74c3c;}
    *{margin:0;padding:0;box-sizing:border-box;}
    body{background:var(--black);color:var(--text);font-family:'Cairo',sans-serif;height:100vh;display:flex;flex-direction:column;overflow:hidden;}

    /* Topbar */
    .topbar{height:60px;background:rgba(5,5,5,0.9);backdrop-filter:blur(20px);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 20px;flex-shrink:0;z-index:10;}
    .topbar-left{display:flex;align-items:center;gap:12px;}
    .back-btn{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,0.04);border:1px solid var(--border);color:#ccc;padding:7px 14px;border-radius:999px;cursor:pointer;font-family:'Cairo';font-size:0.85rem;text-decoration:none;transition:0.2s;}
    .back-btn:hover{background:rgba(255,255,255,0.08);color:#fff;}
    .topbar-title{font-weight:800;font-size:1rem;color:#fff;}
    .unread-badge{background:var(--red);color:#fff;font-size:0.7rem;font-weight:800;padding:2px 7px;border-radius:999px;margin-right:6px;display:none;}

    /* Layout */
    .chat-layout{display:flex;flex:1;overflow:hidden;}

    /* Sidebar */
    .conv-sidebar{width:280px;border-left:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0;}
    .sidebar-header{padding:16px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;}
    .sidebar-title{font-weight:800;font-size:0.95rem;color:#fff;}
    .btn-new-chat{display:flex;align-items:center;gap:6px;background:rgba(192,57,43,0.1);border:1px solid rgba(192,57,43,0.2);color:var(--red-h);padding:7px 12px;border-radius:8px;cursor:pointer;font-family:'Cairo';font-size:0.82rem;font-weight:700;transition:0.2s;}
    .btn-new-chat:hover{background:rgba(192,57,43,0.2);}
    .conv-list{flex:1;overflow-y:auto;}
    .conv-item{display:flex;align-items:center;gap:12px;padding:14px 16px;cursor:pointer;border-bottom:1px solid rgba(255,255,255,0.02);transition:0.15s;}
    .conv-item:hover{background:rgba(255,255,255,0.03);}
    .conv-item.active{background:rgba(192,57,43,0.08);border-right:2px solid var(--red);}
    .conv-avatar{width:40px;height:40px;border-radius:50%;background:linear-gradient(145deg,var(--red),#8e2a1f);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:1rem;color:#fff;flex-shrink:0;overflow:hidden;}
    .conv-avatar img{width:100%;height:100%;object-fit:cover;}
    .conv-info{flex:1;min-width:0;}
    .conv-name{font-weight:700;font-size:0.9rem;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
    .conv-last{font-size:0.78rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px;}
    .conv-empty{padding:40px 20px;text-align:center;color:var(--muted);font-size:0.88rem;}

    /* Main chat */
    .chat-main{flex:1;display:flex;flex-direction:column;overflow:hidden;}
    .chat-header{padding:14px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px;background:rgba(10,10,10,0.5);flex-shrink:0;}
    .chat-peer-avatar{width:38px;height:38px;border-radius:50%;background:linear-gradient(145deg,var(--red),#8e2a1f);display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff;overflow:hidden;flex-shrink:0;}
    .chat-peer-avatar img{width:100%;height:100%;object-fit:cover;}
    .chat-peer-name{font-weight:800;font-size:1rem;color:#fff;}
    .chat-peer-role{font-size:0.75rem;color:var(--muted);}
    .messages-area{flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:12px;}
    .msg{display:flex;gap:10px;align-items:flex-end;}
    .msg.mine{flex-direction:row-reverse;}
    .msg-avatar{width:32px;height:32px;border-radius:50%;background:linear-gradient(145deg,var(--red),#8e2a1f);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:0.85rem;color:#fff;flex-shrink:0;overflow:hidden;}
    .msg-avatar img{width:100%;height:100%;object-fit:cover;}
    .msg-bubble{max-width:65%;padding:10px 14px;border-radius:16px;font-size:0.92rem;line-height:1.6;}
    .msg.mine .msg-bubble{background:rgba(192,57,43,0.2);border:1px solid rgba(192,57,43,0.3);border-bottom-left-radius:4px;}
    .msg.theirs .msg-bubble{background:rgba(255,255,255,0.06);border:1px solid var(--border);border-bottom-right-radius:4px;}
    .msg-time{font-size:0.7rem;color:var(--muted);margin-top:4px;text-align:left;}
    .msg.mine .msg-time{text-align:right;}
    .no-chat{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--muted);gap:12px;}
    .no-chat svg{opacity:0.3;}

    /* Input */
    .chat-input-row{padding:14px 20px;border-top:1px solid var(--border);display:flex;gap:10px;align-items:center;background:rgba(5,5,5,0.8);flex-shrink:0;}
    .chat-input{flex:1;padding:11px 16px;background:#1a1a1a;border:1px solid rgba(255,255,255,0.08);border-radius:999px;color:#fff;font-family:'Cairo';font-size:0.92rem;}
    .chat-input:focus{outline:none;border-color:rgba(255,255,255,0.2);}
    .btn-send{width:42px;height:42px;background:var(--red);border:none;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:0.2s;flex-shrink:0;}
    .btn-send:hover{background:var(--red-h);}
    .btn-send:disabled{opacity:0.4;cursor:not-allowed;}

    /* Search modal */
    .modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,0.8);backdrop-filter:blur(10px);display:flex;align-items:center;justify-content:center;z-index:200;opacity:0;visibility:hidden;transition:0.2s;padding:20px;}
    .modal-backdrop.show{opacity:1;visibility:visible;}
    .modal-box{background:#111;border:1px solid var(--border);border-radius:20px;padding:28px;width:100%;max-width:420px;}
    .modal-title{font-weight:800;font-size:1.1rem;color:#fff;margin-bottom:20px;}
    .search-input{width:100%;padding:11px 14px;background:#1a1a1a;border:1px solid var(--border);border-radius:10px;color:#fff;font-family:'Cairo';font-size:0.92rem;margin-bottom:14px;}
    .search-input:focus{outline:none;border-color:rgba(255,255,255,0.2);}
    .search-results{display:flex;flex-direction:column;gap:8px;max-height:260px;overflow-y:auto;}
    .search-user{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;cursor:pointer;transition:0.15s;}
    .search-user:hover{background:rgba(255,255,255,0.05);}
    .s-avatar{width:36px;height:36px;border-radius:50%;background:linear-gradient(145deg,var(--red),#8e2a1f);display:flex;align-items:center;justify-content:center;font-weight:700;color:#fff;flex-shrink:0;overflow:hidden;}
    .s-avatar img{width:100%;height:100%;object-fit:cover;}
    .s-name{font-weight:700;font-size:0.9rem;color:#fff;}
    .s-un{font-size:0.78rem;color:var(--muted);}

    /* not logged */
    .not-logged{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;color:var(--muted);}
    .not-logged h2{color:#fff;font-size:1.3rem;}
    .btn-go{padding:11px 24px;background:#fff;color:#000;border-radius:10px;font-weight:800;text-decoration:none;font-family:'Cairo';}

    @media(max-width:640px){.conv-sidebar{width:220px;}.msg-bubble{max-width:80%;}}
  </style>
</head>
<body>

<div class="topbar">
  <div class="topbar-left">
    <a href="/records" class="back-btn">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg>
      المنتدى
    </a>
    <span class="topbar-title">الرسائل</span>
    <span class="unread-badge" id="unreadBadge"></span>
  </div>
  <span id="topbarUser" style="font-size:0.85rem;color:var(--muted);"></span>
</div>

<div class="chat-layout" id="chatLayout">
  <div class="not-logged" id="notLogged">
    <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
    <h2>يجب تسجيل الدخول</h2>
    <p>سجّل دخولك للوصول إلى الرسائل</p>
    <a href="/" class="btn-go">الرئيسية</a>
  </div>
</div>

<!-- Search Modal -->
<div class="modal-backdrop" id="searchModal">
  <div class="modal-box">
    <div class="modal-title">محادثة جديدة</div>
    <input class="search-input" type="text" id="searchQ" placeholder="ابحث عن مستخدم..." oninput="searchUsers(this.value)">
    <div class="search-results" id="searchResults">
      <div style="color:var(--muted);text-align:center;padding:20px;font-size:0.88rem;">ابدأ الكتابة للبحث</div>
    </div>
    <div style="text-align:left;margin-top:16px;">
      <button onclick="closeSearch()" style="padding:9px 18px;background:rgba(255,255,255,0.05);border:1px solid var(--border);border-radius:8px;color:#ccc;cursor:pointer;font-family:'Cairo';">إلغاء</button>
    </div>
  </div>
</div>

<script>
const TOKEN = localStorage.getItem('malines_token') || '';
const stored = localStorage.getItem('malines_user');
let ME = null;
let currentPeer = null;
let conversations = [];
let pollTimer = null;

try { if (stored) ME = JSON.parse(stored); } catch(e) {}

function esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function fmtTime(s) { if(!s) return ''; return new Date(s).toLocaleTimeString('ar',{hour:'2-digit',minute:'2-digit'}); }
function fmtDate(s) { if(!s) return ''; const d=new Date(s); return d.toLocaleDateString('ar-SA',{month:'short',day:'numeric'}); }

async function api(url, method='GET', body=null) {
  const opts = { method, headers:{'Content-Type':'application/json','Authorization':'Bearer '+TOKEN} };
  if (body) opts.body = JSON.stringify(body);
  const r = await fetch(url, opts);
  return r.json();
}

async function init() {
  if (!TOKEN || !ME) { document.getElementById('notLogged').style.display='flex'; return; }
  document.getElementById('topbarUser').textContent = ME.username;
  renderChatLayout();
  await loadConversations();
  loadUnread();

  // فتح محادثة مباشرة إذا كان هناك ?with=username في الرابط
  const params = new URLSearchParams(location.search);
  const withUser = params.get('with');
  if (withUser) openConversation(withUser);
}

function renderChatLayout() {
  document.getElementById('chatLayout').innerHTML = `
    <div class="conv-sidebar">
      <div class="sidebar-header">
        <span class="sidebar-title">المحادثات</span>
        <button class="btn-new-chat" onclick="openSearch()">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          جديد
        </button>
      </div>
      <div class="conv-list" id="convList"></div>
    </div>
    <div class="chat-main" id="chatMain">
      <div class="no-chat">
        <svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
        <span>اختر محادثة أو ابدأ واحدة جديدة</span>
      </div>
    </div>
  `;
}

async function loadConversations() {
  const data = await api('/api/messages/conversations');
  conversations = Array.isArray(data) ? data : [];
  const list = document.getElementById('convList');
  if (!list) return;
  if (!conversations.length) {
    list.innerHTML = '<div class="conv-empty">لا توجد محادثات بعد</div>';
    return;
  }
  list.innerHTML = conversations.map(c => {
    const isFrom = c.from_id == ME?.id;
    const peerName = isFrom ? c.to_name : c.from_name;
    const peerAvatar = isFrom ? (c.to_avatar||'') : (c.from_avatar||'');
    const peerUsername = isFrom ? c.to_name : c.from_name;
    const avatarHtml = peerAvatar ? `<img src="${esc(peerAvatar)}" alt="">` : peerName.charAt(0).toUpperCase();
    return `<div class="conv-item ${currentPeer===peerUsername?'active':''}" onclick="openConversation('${esc(peerUsername)}')">
      <div class="conv-avatar">${avatarHtml}</div>
      <div class="conv-info">
        <div class="conv-name">${esc(peerName)}</div>
        <div class="conv-last">${esc(c.content?.slice(0,40)||'')}</div>
      </div>
    </div>`;
  }).join('');
}

async function openConversation(username) {
  currentPeer = username;
  const main = document.getElementById('chatMain');
  if (!main) return;

  // تحديث الـ active في السايدبار
  document.querySelectorAll('.conv-item').forEach(el => el.classList.remove('active'));

  const profile = await api('/api/profile/' + username);
  const avatarHtml = profile.avatar ? `<img src="${esc(profile.avatar)}" alt="">` : (profile.display_name||profile.username||'?').charAt(0).toUpperCase();
  const roleLabel = profile.role==='admin' ? 'Admin' : 'Member';

  main.innerHTML = `
    <div class="chat-header">
      <div class="chat-peer-avatar">${avatarHtml}</div>
      <div>
        <div class="chat-peer-name">${esc(profile.display_name||profile.username)}</div>
        <div class="chat-peer-role">${roleLabel} · @${esc(profile.username)}</div>
      </div>
    </div>
    <div class="messages-area" id="messagesArea"></div>
    <div class="chat-input-row">
      <input class="chat-input" type="text" id="msgInput" placeholder="اكتب رسالة..." onkeydown="if(event.key==='Enter')sendMsg()">
      <button class="btn-send" onclick="sendMsg()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
      </button>
    </div>
  `;

  await loadMessages(username);
  await loadConversations();

  if (pollTimer) clearInterval(pollTimer);
  pollTimer = setInterval(() => loadMessages(username, false), 5000);
}

async function loadMessages(username, scroll=true) {
  const data = await api('/api/messages/' + username);
  const area = document.getElementById('messagesArea');
  if (!area) return;
  if (!Array.isArray(data) || !data.length) {
    area.innerHTML = '<div style="text-align:center;color:var(--muted);padding:30px;font-size:0.88rem;">ابدأ المحادثة بإرسال رسالة</div>';
    return;
  }
  area.innerHTML = data.map(m => {
    const isMine = m.from_id == ME?.id;
    const avatarHtml = m.from_avatar ? `<img src="${esc(m.from_avatar)}" alt="">` : m.from_name.charAt(0).toUpperCase();
    return `<div class="msg ${isMine?'mine':'theirs'}">
      <div class="msg-avatar">${avatarHtml}</div>
      <div>
        <div class="msg-bubble">${esc(m.content)}</div>
        <div class="msg-time">${fmtTime(m.created_at)}</div>
      </div>
    </div>`;
  }).join('');
  if (scroll) area.scrollTop = area.scrollHeight;
}

async function sendMsg() {
  const input = document.getElementById('msgInput');
  if (!input || !input.value.trim()) return;
  const content = input.value.trim();
  input.value = '';
  await api('/api/messages/' + currentPeer, 'POST', { content });
  await loadMessages(currentPeer);
}

async function loadUnread() {
  const data = await api('/api/messages/unread');
  const badge = document.getElementById('unreadBadge');
  if (data?.count > 0) {
    badge.textContent = data.count;
    badge.style.display = 'inline-block';
  } else {
    badge.style.display = 'none';
  }
}

// ── Search ──
function openSearch() { document.getElementById('searchModal').classList.add('show'); document.getElementById('searchQ').focus(); }
function closeSearch() { document.getElementById('searchModal').classList.remove('show'); document.getElementById('searchQ').value=''; document.getElementById('searchResults').innerHTML='<div style="color:var(--muted);text-align:center;padding:20px;font-size:0.88rem;">ابدأ الكتابة للبحث</div>'; }

let searchTimer;
async function searchUsers(q) {
  clearTimeout(searchTimer);
  if (!q.trim()) { document.getElementById('searchResults').innerHTML='<div style="color:var(--muted);text-align:center;padding:20px;font-size:0.88rem;">ابدأ الكتابة للبحث</div>'; return; }
  searchTimer = setTimeout(async () => {
    const data = await api('/api/users/search?q=' + encodeURIComponent(q));
    const results = document.getElementById('searchResults');
    if (!Array.isArray(data) || !data.length) { results.innerHTML='<div style="color:var(--muted);text-align:center;padding:20px;font-size:0.88rem;">لا توجد نتائج</div>'; return; }
    results.innerHTML = data.filter(u=>u.username!==ME?.username).map(u => {
      const avatarHtml = u.avatar ? `<img src="${esc(u.avatar)}" alt="">` : (u.display_name||u.username).charAt(0).toUpperCase();
      return `<div class="search-user" onclick="startChat('${esc(u.username)}')">
        <div class="s-avatar">${avatarHtml}</div>
        <div><div class="s-name">${esc(u.display_name||u.username)}</div><div class="s-un">@${esc(u.username)}</div></div>
      </div>`;
    }).join('');
  }, 300);
}

function startChat(username) {
  closeSearch();
  openConversation(username);
}

document.getElementById('searchModal').addEventListener('click', e => { if(e.target===document.getElementById('searchModal')) closeSearch(); });

init();
</script>
</body>
</html>
