<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <link rel="icon" href="malines-fivcon.png" type="image/png">
  <title>الرسائل | مجتمع مالينز</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root{--black:#050505;--dark:#0d0d0e;--border:#1e1e20;--text:#e9e9e9;--muted:#6b6b6b;--red:#c0392b;--red-h:#e74c3c;--mine-bg:rgba(192,57,43,0.18);--mine-border:rgba(192,57,43,0.28);--their-bg:rgba(255,255,255,0.06);--their-border:rgba(255,255,255,0.08);}
    *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
    html,body{height:100%;overflow:hidden;}
    body{background:var(--black);color:var(--text);font-family:'Cairo',sans-serif;display:flex;flex-direction:column;}

    .topbar{height:56px;background:rgba(8,8,9,0.95);backdrop-filter:blur(24px);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 16px;gap:12px;flex-shrink:0;z-index:20;}
    .back-btn{display:flex;align-items:center;gap:6px;color:#aaa;font-size:0.84rem;cursor:pointer;padding:6px 10px;border-radius:8px;transition:0.18s;background:none;border:none;font-family:'Cairo';}
    .back-btn:hover{color:#fff;background:rgba(255,255,255,0.05);}
    .topbar-title{font-weight:800;font-size:0.96rem;color:#fff;flex:1;text-align:center;}
    .topbar-peer{display:flex;align-items:center;gap:10px;flex:1;}
    .topbar-peer-av{width:34px;height:34px;border-radius:50%;background:linear-gradient(145deg,var(--red),#8e2a1f);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:0.9rem;color:#fff;overflow:hidden;flex-shrink:0;cursor:pointer;}
    .topbar-peer-av img{width:100%;height:100%;object-fit:cover;}
    .topbar-peer-name{font-weight:700;font-size:0.92rem;color:#fff;cursor:pointer;}
    .topbar-peer-role{font-size:0.7rem;color:var(--muted);}

    .chat-layout{display:flex;flex:1;overflow:hidden;}

    /* Sidebar */
    .sidebar{width:300px;display:flex;flex-direction:column;border-left:1px solid var(--border);background:rgba(8,8,9,0.6);flex-shrink:0;transition:transform 0.25s;}
    .sidebar-head{padding:12px 14px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:8px;}
    .sidebar-head-title{font-weight:800;font-size:0.88rem;color:#fff;}
    .btn-new-group{display:flex;align-items:center;gap:5px;background:rgba(192,57,43,0.1);border:1px solid rgba(192,57,43,0.2);color:var(--red-h);padding:5px 10px;border-radius:7px;cursor:pointer;font-family:'Cairo';font-size:0.75rem;font-weight:700;transition:0.18s;}
    .btn-new-group:hover{background:rgba(192,57,43,0.2);}
    .user-list{flex:1;overflow-y:auto;padding:4px 0;}
    .user-list::-webkit-scrollbar{width:3px;}
    .user-list::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.08);border-radius:3px;}
    .section-label{padding:8px 14px 3px;font-size:0.7rem;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:0.05em;}
    .user-item{display:flex;align-items:center;gap:10px;padding:10px 12px;cursor:pointer;transition:0.15s;border-radius:10px;margin:2px 6px;}
    .user-item:hover{background:rgba(255,255,255,0.04);}
    .user-item.active{background:rgba(192,57,43,0.1);border:1px solid rgba(192,57,43,0.15);}
    .u-av{width:38px;height:38px;border-radius:50%;background:linear-gradient(145deg,var(--red),#8e2a1f);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:0.95rem;color:#fff;flex-shrink:0;overflow:hidden;}
    .u-av img{width:100%;height:100%;object-fit:cover;}
    .u-info{flex:1;min-width:0;}
    .u-name{font-weight:700;font-size:0.86rem;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
    .u-last{font-size:0.72rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px;}

    /* Main */
    .chat-main{flex:1;display:flex;flex-direction:column;min-width:0;min-height:0;}
    .empty-state{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;color:var(--muted);}
    .empty-state svg{opacity:0.18;}

    /* Messages */
    .msgs-area{flex:1;overflow-y:auto;padding:14px 12px;display:flex;flex-direction:column;gap:3px;min-height:0;}
    .msgs-area::-webkit-scrollbar{width:3px;}
    .msgs-area::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.06);border-radius:3px;}
    .date-divider{text-align:center;font-size:0.7rem;color:var(--muted);padding:8px 0;position:relative;}
    .date-divider::before{content:'';position:absolute;top:50%;left:0;right:0;height:1px;background:var(--border);}
    .date-divider span{position:relative;z-index:1;background:var(--black);padding:0 10px;}
    .msg-row{display:flex;align-items:flex-end;gap:8px;margin-bottom:5px;}
    .msg-row.mine{flex-direction:row-reverse;}
    .msg-av{width:28px;height:28px;border-radius:50%;background:linear-gradient(145deg,var(--red),#8e2a1f);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:0.75rem;color:#fff;flex-shrink:0;overflow:hidden;}
    .msg-av img{width:100%;height:100%;object-fit:cover;}
    .msg-av.invisible{opacity:0;pointer-events:none;}
    .bubble-wrap{display:flex;flex-direction:column;max-width:68%;}
    .msg-row.mine .bubble-wrap{align-items:flex-end;}
    .bubble{padding:9px 13px;border-radius:18px;font-size:0.9rem;line-height:1.5;word-break:break-word;position:relative;cursor:pointer;}
    .msg-row.mine  .bubble{background:var(--mine-bg);border:1px solid var(--mine-border);border-bottom-left-radius:4px;}
    .msg-row.theirs .bubble{background:var(--their-bg);border:1px solid var(--their-border);border-bottom-right-radius:4px;}
    .bubble:hover{filter:brightness(1.12);}
    .bubble-img{max-width:100%;border-radius:10px;display:block;margin-bottom:4px;max-height:180px;object-fit:cover;}
    .msg-time{font-size:0.63rem;color:var(--muted);padding:2px 4px;}
    .msg-reaction{display:inline-flex;align-items:center;gap:3px;background:rgba(20,20,22,0.95);border:1px solid var(--border);border-radius:999px;padding:2px 7px;font-size:0.78rem;margin-top:3px;cursor:pointer;}
    .react-picker{position:absolute;bottom:calc(100% + 6px);background:rgba(15,15,16,0.98);border:1px solid var(--border);border-radius:999px;padding:5px 8px;display:none;gap:3px;backdrop-filter:blur(20px);z-index:30;white-space:nowrap;}
    .msg-row.mine .react-picker{right:0;}
    .msg-row.theirs .react-picker{left:0;}
    .react-picker.show{display:flex;}
    .r-emoji{background:none;border:none;font-size:1.25rem;cursor:pointer;padding:3px 5px;border-radius:7px;transition:0.15s;line-height:1;}
    .r-emoji:hover{background:rgba(255,255,255,0.08);transform:scale(1.2);}
    .r-emoji.active{background:rgba(192,57,43,0.15);}

    /* Input */
    .img-preview-bar{padding:6px 12px;background:rgba(10,10,10,0.8);border-top:1px solid var(--border);display:none;align-items:center;gap:8px;flex-shrink:0;}
    .img-preview-bar img{height:50px;border-radius:7px;object-fit:cover;}
    .img-rm-btn{background:rgba(0,0,0,0.7);border:none;color:#fff;border-radius:50%;width:20px;height:20px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
    .input-area{padding:10px 12px;border-top:1px solid var(--border);display:flex;align-items:flex-end;gap:8px;background:rgba(5,5,5,0.9);flex-shrink:0;}
    .btn-attach{width:38px;height:38px;background:rgba(255,255,255,0.05);border:1px solid var(--border);border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;color:#aaa;transition:0.18s;flex-shrink:0;}
    .btn-attach:hover{color:#fff;background:rgba(255,255,255,0.08);}
    .msg-input{flex:1;padding:10px 14px;background:rgba(255,255,255,0.06);border:1px solid var(--border);border-radius:22px;color:#fff;font-family:'Cairo';font-size:0.92rem;resize:none;max-height:120px;overflow-y:auto;line-height:1.5;outline:none;transition:border-color 0.18s;}
    .msg-input:focus{border-color:rgba(255,255,255,0.18);}
    .send-btn{width:42px;height:42px;background:var(--red);border:none;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:0.18s;flex-shrink:0;}
    .send-btn:hover{background:var(--red-h);transform:scale(1.05);}
    .send-btn:disabled{opacity:0.4;cursor:not-allowed;transform:none;}

    /* Mobile */
    .sidebar-toggle{display:none;width:36px;height:36px;background:rgba(255,255,255,0.05);border:1px solid var(--border);border-radius:9px;align-items:center;justify-content:center;cursor:pointer;color:#aaa;flex-shrink:0;}
    .sidebar-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.6);z-index:15;}

    /* Not logged */
    .not-logged{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;}
    .not-logged h2{font-size:1.2rem;font-weight:800;color:#fff;}
    .btn-go{padding:10px 22px;background:#fff;color:#000;border-radius:9px;font-weight:800;font-size:0.88rem;text-decoration:none;display:inline-block;}

    /* Modal */
    .modal-bg{position:fixed;inset:0;background:rgba(0,0,0,0.82);backdrop-filter:blur(10px);display:none;align-items:center;justify-content:center;z-index:200;padding:20px;}
    .modal-bg.show{display:flex;}
    .modal-box{background:#111;border:1px solid var(--border);border-radius:20px;padding:28px;width:100%;max-width:440px;max-height:85vh;overflow-y:auto;}
    .modal-title{font-weight:800;font-size:1rem;color:#fff;margin-bottom:18px;}
    .m-input{width:100%;padding:10px 12px;background:#1a1a1a;border:1px solid rgba(255,255,255,0.07);border-radius:9px;color:#fff;font-family:'Cairo';font-size:0.88rem;margin-bottom:12px;}
    .m-input:focus{outline:none;border-color:rgba(255,255,255,0.18);}
    .member-check{display:flex;align-items:center;gap:9px;padding:8px 10px;background:rgba(255,255,255,0.03);border-radius:8px;cursor:pointer;margin-bottom:5px;}
    .m-footer{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;}
    .btn-cancel{padding:9px 16px;background:rgba(255,255,255,0.05);border:1px solid var(--border);border-radius:8px;color:#ccc;cursor:pointer;font-family:'Cairo';}
    .btn-confirm{padding:9px 16px;background:#fff;border:none;border-radius:8px;color:#000;font-weight:800;cursor:pointer;font-family:'Cairo';}

    @media(max-width:680px){
      .sidebar{position:fixed;top:0;right:0;bottom:0;z-index:16;width:280px;transform:translateX(100%);}
      .sidebar.open{transform:translateX(0);}
      .sidebar-overlay.show{display:block;}
      .sidebar-toggle{display:flex;}
      .bubble-wrap{max-width:82%;}
    }
  </style>
</head>
<body>

<div class="topbar" id="topbar">
  <a href="/records" class="back-btn">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg>
    المنتدى
  </a>
  <span class="topbar-title" id="topbarTitle">الرسائل</span>
  <button class="sidebar-toggle" onclick="toggleSidebar()">
    <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
  </button>
</div>

<div class="chat-layout">
  <div class="chat-main" id="chatMain">
    <div class="empty-state">
      <svg width="52" height="52" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
      <span style="font-size:0.9rem;">اختر محادثة من القائمة</span>
    </div>
  </div>
  <div class="sidebar" id="sidebar">
    <div class="sidebar-head">
      <span class="sidebar-head-title">الرسائل</span>
      <button class="btn-new-group" onclick="openCreateGroup()">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        جروب جديد
      </button>
    </div>
    <div class="user-list" id="userList">
      <div style="text-align:center;padding:30px;color:var(--muted);font-size:0.84rem;">جارٍ التحميل...</div>
    </div>
  </div>
</div>

<div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>

<!-- Create Group Modal -->
<div class="modal-bg" id="createGroupModal">
  <div class="modal-box">
    <div class="modal-title">إنشاء مجموعة جديدة</div>
    <input class="m-input" type="text" id="cgName" placeholder="اسم المجموعة *">
    <div id="cgMembers" style="max-height:220px;overflow-y:auto;margin-bottom:4px;"></div>
    <div class="m-footer">
      <button class="btn-cancel" onclick="closeCreateGroup()">إلغاء</button>
      <button class="btn-confirm" onclick="createGroup()">إنشاء</button>
    </div>
  </div>
</div>

<script>
const getToken = () => localStorage.getItem('malines_token')||'';
const EMOJIS = ['❤️','😄','😢','😠','👍'];
let ME = null;
let currentPeer = null;
let allUsers = [];
let conversations = [];
let groups = [];
let pollTimer = null;
let msgReactions = {};
let chatImgBase64 = '';

// ── Utils ──
function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function fmtTime(s){ if(!s) return ''; return new Date(s).toLocaleTimeString('ar',{hour:'2-digit',minute:'2-digit'}); }
function fmtDay(s){ if(!s) return ''; const d=new Date(s),t=new Date(),diff=Math.floor((t-d)/86400000); if(diff===0) return 'اليوم'; if(diff===1) return 'أمس'; return d.toLocaleDateString('ar-SA',{month:'short',day:'numeric'}); }

async function apiFetch(url,method='GET',body=null){
  const token=getToken();
  const opts={method,headers:{'Content-Type':'application/json','Authorization':'Bearer '+token}};
  if(body) opts.body=JSON.stringify(body);
  const r=await fetch(url,opts); return r.json();
}

// ── Init ──
(async function init(){
  const token=getToken();
  if(!token){ showNotLogged(); return; }
  try{
    const r=await fetch('/api/auth/me',{headers:{'Authorization':'Bearer '+token}});
    if(!r.ok){ showNotLogged(); return; }
    const u=await r.json();
    if(!u||u.error){ showNotLogged(); return; }
    ME=u;
  }catch(e){ showNotLogged(); return; }

  await loadSidebar();

  const withUser=new URLSearchParams(location.search).get('with');
  if(withUser) openChat(withUser);
})();

function showNotLogged(){
  document.getElementById('chatMain').innerHTML=`<div class="not-logged">
    <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="#555" stroke-width="1.5"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
    <h2>يجب تسجيل الدخول</h2><a href="/" class="btn-go">الرئيسية</a></div>`;
  document.getElementById('sidebar').innerHTML='';
}

// ── Sidebar ──
async function loadSidebar(){
  try{
    [allUsers, conversations, groups] = await Promise.all([
      apiFetch('/api/users'),
      apiFetch('/api/messages/conversations'),
      apiFetch('/api/groups'),
    ]);
  }catch(e){ allUsers=[]; conversations=[]; groups=[]; }
  renderSidebar();
}

function renderSidebar(){
  const list=document.getElementById('userList');
  if(!list) return;

  const others = Array.isArray(allUsers) ? allUsers.filter(u=>u.username!==ME?.username) : [];
  const convMap = {};
  if(Array.isArray(conversations)){
    conversations.forEach(c=>{
      const peer = c.from_id==ME?.id ? c.to_name : c.from_name;
      convMap[peer]=c;
    });
  }

  let html='';

  // الجروبات
  if(Array.isArray(groups)&&groups.length){
    html+=`<div class="section-label">المجموعات</div>`;
    html+=groups.map(g=>{
      const av=g.avatar?`<img src="${esc(g.avatar)}" alt="">`:(g.name||'?').charAt(0).toUpperCase();
      return `<div class="user-item" onclick="window.location='/group?g=${g.id}'">
        <div class="u-av" style="background:linear-gradient(145deg,#566573,#2c3e50);">${av}</div>
        <div class="u-info">
          <div class="u-name" style="display:flex;align-items:center;gap:5px;">
            <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
            ${esc(g.name)}
          </div>
          <div class="u-last">${g.my_role==='admin'?'مدير':'عضو'}</div>
        </div>
      </div>`;
    }).join('');
  }

  // المحادثات الأخيرة
  const withConv=others.filter(u=>convMap[u.username]);
  if(withConv.length){
    html+=`<div class="section-label">المحادثات</div>`;
    html+=withConv.map(u=>userItemHtml(u,convMap[u.username])).join('');
  }

  // كل الأعضاء
  html+=`<div class="section-label">جميع الأعضاء</div>`;
  html+=others.length ? others.map(u=>userItemHtml(u,convMap[u.username]||null)).join('') :
    '<div style="padding:12px 16px;font-size:0.82rem;color:var(--muted);">لا يوجد أعضاء آخرون</div>';

  list.innerHTML=html;
}

function userItemHtml(u,conv){
  const av=u.avatar?`<img src="${esc(u.avatar)}" alt="">`:(u.display_name||u.username||'?').charAt(0).toUpperCase();
  const lastMsg=conv?(conv.from_id==ME?.id?'أنت: ':'')+esc((conv.content||'').slice(0,30)):'ابدأ محادثة';
  const active=currentPeer===u.username?'active':'';
  const role=u.role==='admin'?`<span style="font-size:0.66rem;color:var(--red-h);font-weight:700;margin-left:4px;">Admin</span>`:'';
  return `<div class="user-item ${active}" onclick="openChat('${esc(u.username)}')">
    <div class="u-av">${av}</div>
    <div class="u-info">
      <div class="u-name">${role}${esc(u.display_name||u.username)}</div>
      <div class="u-last">${lastMsg}</div>
    </div>
  </div>`;
}

// ── Open Chat ──
async function openChat(username){
  currentPeer=username;
  if(window.innerWidth<=680) toggleSidebar(false);
  renderSidebar();

  const peer=allUsers.find(u=>u.username===username)||{username};
  const av=peer.avatar?`<img src="${esc(peer.avatar)}" alt="">`:(peer.display_name||peer.username||'?').charAt(0).toUpperCase();
  const role=peer.role==='admin'?'Admin':'Member';

  document.getElementById('topbarTitle').innerHTML=`
    <div class="topbar-peer">
      <div class="topbar-peer-av" onclick="window.location='/profile?u='+encodeURIComponent('${esc(username)}')">${av}</div>
      <div>
        <div class="topbar-peer-name" onclick="window.location='/profile?u='+encodeURIComponent('${esc(username)}')">${esc(peer.display_name||peer.username)}</div>
        <div class="topbar-peer-role">${role}</div>
      </div>
    </div>`;

  document.getElementById('chatMain').innerHTML=`
    <div class="msgs-area" id="msgsArea"></div>
    <div class="img-preview-bar" id="imgPreviewBar">
      <img id="imgPreviewThumb" src="" alt="">
      <button class="img-rm-btn" onclick="removeChatImg()">
        <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
      <span style="font-size:0.76rem;color:var(--muted);">صورة مرفقة</span>
    </div>
    <div class="input-area">
      <button class="btn-attach" onclick="document.getElementById('chatImgFile').click()" title="إرفاق صورة JPG">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
      </button>
      <input type="file" id="chatImgFile" accept=".jpg,.jpeg,image/jpeg" style="display:none;" onchange="onChatImg(event)">
      <textarea class="msg-input" id="msgInput" placeholder="اكتب رسالة..." rows="1" onkeydown="onKey(event)" oninput="autoResize(this)"></textarea>
      <button class="send-btn" id="sendBtn" onclick="sendMsg()">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
      </button>
    </div>`;

  await loadMsgs(username);
  if(pollTimer) clearInterval(pollTimer);
  pollTimer=setInterval(()=>loadMsgs(username,false),4000);
}

async function loadMsgs(username,scroll=true){
  try{
    const msgs=await apiFetch('/api/messages/'+encodeURIComponent(username));
    if(!Array.isArray(msgs)) return;
    renderMsgs(msgs,scroll);
  }catch(e){}
}

function renderMsgs(msgs,scroll=true){
  const area=document.getElementById('msgsArea');
  if(!area) return;
  if(!msgs.length){ area.innerHTML='<div style="text-align:center;color:var(--muted);padding:30px;font-size:0.85rem;">ابدأ المحادثة</div>'; return; }
  let html='',lastDay='';
  msgs.forEach((m,i)=>{
    const isMine=m.from_id==ME?.id;
    const day=fmtDay(m.created_at);
    if(day!==lastDay){ html+=`<div class="date-divider"><span>${day}</span></div>`; lastDay=day; }
    const next=msgs[i+1]; const isLast=!next||next.from_id!=m.from_id;
    const av=m.from_avatar?`<img src="${esc(m.from_avatar)}" alt="">`:m.from_name.charAt(0).toUpperCase();
    const rc=msgReactions[m.id];
    const reactionHtml=rc&&rc.reactions&&rc.reactions.length?
      `<div class="msg-reaction" onclick="togglePicker(${m.id})">${rc.reactions.map(r=>r.emoji).join('')} <span style="font-size:0.7rem;color:var(--muted);">${rc.reactions.reduce((s,r)=>s+Number(r.count),0)}</span></div>`:'';
    html+=`<div class="msg-row ${isMine?'mine':'theirs'}">
      ${!isMine?`<div class="msg-av ${isLast?'':'invisible'}">${av}</div>`:''}
      <div class="bubble-wrap">
        <div class="bubble" id="bubble-${m.id}" onclick="togglePicker(${m.id})">
          ${m.image?`<img class="bubble-img" src="${esc(m.image)}" loading="lazy" onerror="this.style.display='none'">` : ''}
          ${m.content?esc(m.content):''}
          <div class="react-picker" id="picker-${m.id}">
            ${EMOJIS.map(e=>`<button class="r-emoji ${rc?.userReaction===e?'active':''}" onclick="reactMsg(event,${m.id},'${e}')">${e}</button>`).join('')}
          </div>
        </div>
        ${reactionHtml}
        ${isLast?`<div class="msg-time">${fmtTime(m.created_at)}</div>`:''}
      </div>
      ${isMine?`<div class="msg-av ${isLast?'':'invisible'}">${av}</div>`:''}
    </div>`;
  });
  area.innerHTML=html;
  if(scroll) area.scrollTop=area.scrollHeight;
}

function togglePicker(id){
  const p=document.getElementById('picker-'+id);
  if(!p) return;
  document.querySelectorAll('.react-picker.show').forEach(x=>{if(x!==p) x.classList.remove('show');});
  p.classList.toggle('show');
}
document.addEventListener('click',e=>{
  if(!e.target.closest('.bubble')) document.querySelectorAll('.react-picker.show').forEach(p=>p.classList.remove('show'));
});

async function reactMsg(e,mid,emoji){
  e.stopPropagation();
  document.querySelectorAll('.react-picker.show').forEach(p=>p.classList.remove('show'));
  const d=await apiFetch('/api/messages/react/'+mid,'POST',{emoji});
  if(d.success){ msgReactions[mid]={reactions:d.reactions,userReaction:d.userReaction}; }
  if(currentPeer) await loadMsgs(currentPeer,false);
}

// ── Image ──
function onChatImg(e){
  const f=e.target.files[0]; if(!f) return;
  if(!f.type.match('image/jpeg')){ alert('JPG/JPEG فقط'); return; }
  const r=new FileReader();
  r.onload=ev=>{
    chatImgBase64=ev.target.result;
    document.getElementById('imgPreviewThumb').src=chatImgBase64;
    document.getElementById('imgPreviewBar').style.display='flex';
  };
  r.readAsDataURL(f);
  e.target.value='';
}
function removeChatImg(){
  chatImgBase64='';
  document.getElementById('imgPreviewBar').style.display='none';
}

// ── Send ──
async function sendMsg(){
  const input=document.getElementById('msgInput');
  const content=input?.value.trim()||'';
  if(!content&&!chatImgBase64) return;
  input.value=''; input.style.height='';
  document.getElementById('sendBtn').disabled=true;
  try{
    let imageUrl='';
    if(chatImgBase64){
      const up=await apiFetch('/api/upload','POST',{image:chatImgBase64});
      if(up.url) imageUrl=up.url;
      removeChatImg();
    }
    await apiFetch('/api/messages/'+encodeURIComponent(currentPeer),'POST',{content,image:imageUrl});
    await loadMsgs(currentPeer);
    loadSidebar();
  }catch(e){}
  document.getElementById('sendBtn').disabled=false;
}

function onKey(e){ if(e.key==='Enter'&&!e.shiftKey){ e.preventDefault(); sendMsg(); } }
function autoResize(el){ el.style.height='auto'; el.style.height=Math.min(el.scrollHeight,120)+'px'; }

// ── Sidebar Toggle ──
function toggleSidebar(force){
  const sb=document.getElementById('sidebar');
  const ov=document.getElementById('sidebarOverlay');
  const open=force!==undefined?force:!sb.classList.contains('open');
  sb.classList.toggle('open',open);
  ov.classList.toggle('show',open);
}

// ── Create Group ──
async function openCreateGroup(){
  document.getElementById('cgName').value='';
  document.getElementById('createGroupModal').classList.add('show');
  const others=Array.isArray(allUsers)?allUsers.filter(u=>u.username!==ME?.username):[];
  document.getElementById('cgMembers').innerHTML=others.map(u=>`
    <label class="member-check">
      <input type="checkbox" value="${u.id}" style="accent-color:var(--red);width:16px;height:16px;">
      <div class="u-av" style="width:28px;height:28px;font-size:0.78rem;flex-shrink:0;">
        ${u.avatar?`<img src="${esc(u.avatar)}" alt="">`:((u.display_name||u.username||'?').charAt(0).toUpperCase())}
      </div>
      <span style="font-size:0.84rem;color:#ddd;">${esc(u.display_name||u.username)}</span>
    </label>`).join('');
}
function closeCreateGroup(){ document.getElementById('createGroupModal').classList.remove('show'); }
document.getElementById('createGroupModal').addEventListener('click',e=>{if(e.target===document.getElementById('createGroupModal')) closeCreateGroup();});

async function createGroup(){
  const name=document.getElementById('cgName').value.trim();
  if(!name){ alert('اسم المجموعة مطلوب'); return; }
  const members=[...document.querySelectorAll('#cgMembers input:checked')].map(i=>Number(i.value));
  const d=await apiFetch('/api/groups','POST',{name,members});
  if(d.id){
    closeCreateGroup();
    window.location='/group?g='+d.id;
  }
}
</script>
