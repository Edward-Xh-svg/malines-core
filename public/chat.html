<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <link rel="icon" href="malines-fivcon.png" type="image/png">
  <title>الرسائل | مجتمع مالينز</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root{--black:#050505;--dark:#0d0d0e;--border:#1e1e20;--text:#e9e9e9;--muted:#6b6b6b;--red:#c0392b;--red-h:#e74c3c;--mine-bg:rgba(192,57,43,0.18);--mine-border:rgba(192,57,43,0.28);--their-bg:rgba(255,255,255,0.06);--their-border:rgba(255,255,255,0.08);}
    *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
    html,body{height:100%;overflow:hidden;}
    body{background:var(--black);color:var(--text);font-family:'Cairo',sans-serif;display:flex;flex-direction:column;}

    /* ── Top Bar ── */
    .topbar{height:56px;background:rgba(8,8,9,0.95);backdrop-filter:blur(24px);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 16px;gap:12px;flex-shrink:0;z-index:20;}
    .back-btn{display:flex;align-items:center;gap:6px;color:#aaa;font-size:0.84rem;cursor:pointer;padding:6px 10px;border-radius:8px;transition:0.18s;background:none;border:none;font-family:'Cairo';}
    .back-btn:hover{color:#fff;background:rgba(255,255,255,0.05);}
    .topbar-title{font-weight:800;font-size:0.96rem;color:#fff;flex:1;text-align:center;}
    .topbar-peer{display:flex;align-items:center;gap:10px;flex:1;}
    .topbar-peer-av{width:34px;height:34px;border-radius:50%;background:linear-gradient(145deg,var(--red),#8e2a1f);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:0.9rem;color:#fff;overflow:hidden;flex-shrink:0;}
    .topbar-peer-av img{width:100%;height:100%;object-fit:cover;}
    .topbar-peer-name{font-weight:700;font-size:0.92rem;color:#fff;}
    .topbar-peer-role{font-size:0.7rem;color:var(--muted);}

    /* ── Layout ── */
    .chat-layout{display:flex;flex:1;overflow:hidden;min-height:0;}

    /* ── Sidebar ── */
    .sidebar{width:300px;display:flex;flex-direction:column;border-left:1px solid var(--border);background:rgba(8,8,9,0.6);flex-shrink:0;transition:transform 0.25s;}
    .sidebar-head{padding:14px 16px;border-bottom:1px solid var(--border);font-weight:800;font-size:0.9rem;color:#fff;}
    .user-list{flex:1;overflow-y:auto;padding:6px 0;}
    .user-list::-webkit-scrollbar{width:3px;}
    .user-list::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.08);border-radius:3px;}
    .user-item{display:flex;align-items:center;gap:11px;padding:11px 14px;cursor:pointer;transition:0.15s;border-radius:10px;margin:2px 6px;}
    .user-item:hover{background:rgba(255,255,255,0.04);}
    .user-item.active{background:rgba(192,57,43,0.1);border:1px solid rgba(192,57,43,0.15);}
    .u-av{width:40px;height:40px;border-radius:50%;background:linear-gradient(145deg,var(--red),#8e2a1f);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:1rem;color:#fff;flex-shrink:0;overflow:hidden;}
    .u-av img{width:100%;height:100%;object-fit:cover;}
    .u-info{flex:1;min-width:0;}
    .u-name{font-weight:700;font-size:0.88rem;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
    .u-last{font-size:0.74rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px;}
    .u-badge{background:var(--red);color:#fff;font-size:0.65rem;font-weight:800;padding:2px 6px;border-radius:999px;min-width:18px;text-align:center;}
    .section-label{padding:8px 16px 4px;font-size:0.72rem;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:0.05em;}

    /* ── Main ── */
    .chat-main{flex:1;display:flex;flex-direction:column;min-width:0;min-height:0;}
    .empty-state{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;color:var(--muted);}
    .empty-state svg{opacity:0.2;}

    /* ── Messages Area ── */
    .msgs-area{flex:1;overflow-y:auto;padding:16px 14px;display:flex;flex-direction:column;gap:4px;min-height:0;}
    .msgs-area::-webkit-scrollbar{width:3px;}
    .msgs-area::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.06);border-radius:3px;}

    /* Date divider */
    .date-divider{text-align:center;font-size:0.72rem;color:var(--muted);padding:8px 0;position:relative;}
    .date-divider::before{content:'';position:absolute;top:50%;left:0;right:0;height:1px;background:var(--border);z-index:0;}
    .date-divider span{position:relative;z-index:1;background:var(--black);padding:0 12px;}

    /* Message bubble */
    .msg-group{display:flex;flex-direction:column;gap:2px;margin-bottom:8px;}
    .msg-row{display:flex;align-items:flex-end;gap:8px;}
    .msg-row.mine{flex-direction:row-reverse;}
    .msg-av{width:28px;height:28px;border-radius:50%;background:linear-gradient(145deg,var(--red),#8e2a1f);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:0.75rem;color:#fff;flex-shrink:0;overflow:hidden;align-self:flex-end;}
    .msg-av img{width:100%;height:100%;object-fit:cover;}
    .msg-av.invisible{opacity:0;pointer-events:none;}
    .bubble-wrap{display:flex;flex-direction:column;max-width:68%;}
    .msg-row.mine .bubble-wrap{align-items:flex-end;}
    .bubble{padding:9px 13px;border-radius:18px;font-size:0.9rem;line-height:1.5;word-break:break-word;position:relative;cursor:pointer;}
    .msg-row.mine  .bubble{background:var(--mine-bg);border:1px solid var(--mine-border);border-bottom-left-radius:4px;}
    .msg-row.theirs .bubble{background:var(--their-bg);border:1px solid var(--their-border);border-bottom-right-radius:4px;}
    .bubble:hover{filter:brightness(1.1);}
    .msg-time{font-size:0.65rem;color:var(--muted);padding:2px 4px;}
    .msg-row.mine .msg-time{text-align:left;}

    /* Reaction on message */
    .msg-reaction{display:inline-flex;align-items:center;gap:3px;background:rgba(20,20,22,0.95);border:1px solid var(--border);border-radius:999px;padding:2px 7px;font-size:0.78rem;margin-top:3px;cursor:pointer;transition:0.15s;}
    .msg-reaction:hover{border-color:rgba(255,255,255,0.2);}
    .msg-react-picker{position:absolute;bottom:calc(100% + 6px);background:rgba(15,15,16,0.98);border:1px solid var(--border);border-radius:999px;padding:5px 8px;display:none;gap:3px;backdrop-filter:blur(20px);z-index:30;white-space:nowrap;}
    .msg-row.mine .msg-react-picker{right:0;}
    .msg-row.theirs .msg-react-picker{left:0;}
    .msg-react-picker.show{display:flex;}
    .r-emoji{background:none;border:none;font-size:1.25rem;cursor:pointer;padding:3px 5px;border-radius:7px;transition:0.15s;line-height:1;}
    .r-emoji:hover{background:rgba(255,255,255,0.08);transform:scale(1.2);}
    .r-emoji.active{background:rgba(192,57,43,0.15);}

    /* Input */
    .input-area{padding:10px 12px;border-top:1px solid var(--border);display:flex;align-items:flex-end;gap:8px;background:rgba(5,5,5,0.9);flex-shrink:0;}
    .msg-input{flex:1;padding:10px 14px;background:rgba(255,255,255,0.06);border:1px solid var(--border);border-radius:22px;color:#fff;font-family:'Cairo';font-size:0.92rem;resize:none;max-height:120px;overflow-y:auto;line-height:1.5;outline:none;transition:border-color 0.18s;}
    .msg-input:focus{border-color:rgba(255,255,255,0.18);}
    .send-btn{width:42px;height:42px;background:var(--red);border:none;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:0.18s;flex-shrink:0;}
    .send-btn:hover{background:var(--red-h);transform:scale(1.05);}
    .send-btn:disabled{opacity:0.4;cursor:not-allowed;transform:none;}

    /* Mobile sidebar toggle */
    .sidebar-toggle{display:none;width:36px;height:36px;background:rgba(255,255,255,0.05);border:1px solid var(--border);border-radius:9px;align-items:center;justify-content:center;cursor:pointer;color:#aaa;flex-shrink:0;}
    .sidebar-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.6);z-index:15;}

    /* Not logged */
    .not-logged{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;}
    .not-logged h2{font-size:1.2rem;font-weight:800;color:#fff;}
    .btn-go{padding:10px 22px;background:#fff;color:#000;border-radius:9px;font-weight:800;font-size:0.88rem;text-decoration:none;display:inline-block;}

    /* Mobile */
    @media(max-width:680px){
      .sidebar{position:fixed;top:0;right:0;bottom:0;z-index:16;width:280px;transform:translateX(100%);}
      .sidebar.open{transform:translateX(0);}
      .sidebar-overlay.show{display:block;}
      .sidebar-toggle{display:flex;}
      .chat-layout{flex-direction:column;}
      .bubble-wrap{max-width:82%;}
    }
  </style>
</head>
<body>

<!-- Topbar -->
<div class="topbar" id="topbar">
  <a href="/records" class="back-btn">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg>
    المنتدى
  </a>
  <span class="topbar-title" id="topbarTitle">الرسائل</span>
  <button class="sidebar-toggle" id="sidebarToggle" onclick="toggleSidebar()">
    <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
  </button>
</div>

<div class="chat-layout">
  <!-- Main -->
  <div class="chat-main" id="chatMain">
    <div class="empty-state" id="emptyState">
      <svg width="52" height="52" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
      <span style="font-size:0.9rem;">اختر محادثة من القائمة</span>
    </div>
  </div>
  <!-- Sidebar -->
  <div class="sidebar" id="sidebar">
    <div class="sidebar-head" style="display:flex;align-items:center;justify-content:space-between;">
      المحادثات والأعضاء
      <button onclick="openCreateGroup()" style="background:rgba(192,57,43,0.1);border:1px solid rgba(192,57,43,0.2);color:var(--red-h);padding:5px 10px;border-radius:7px;cursor:pointer;font-family:Cairo;font-size:0.75rem;font-weight:700;display:flex;align-items:center;gap:5px;">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        جروب
      </button>
    </div>
    <div class="user-list" id="userList">
      <div style="text-align:center;padding:30px;color:var(--muted);font-size:0.85rem;">جارٍ التحميل...</div>
    </div>
  </div>
</div>

<div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>

<script>
const getToken = () => localStorage.getItem('malines_token')||'';
const EMOJIS = ['❤️','😄','😢','😠','👍'];
let ME = null;
let currentPeer = null;
let allUsers = [];
let conversations = [];
let pollTimer = null;
let msgReactions = {}; // { msgId: { reactions, userReaction } }

function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function fmtTime(s){ if(!s) return ''; return new Date(s).toLocaleTimeString('ar',{hour:'2-digit',minute:'2-digit'}); }
function fmtDay(s){ if(!s) return ''; const d=new Date(s); const today=new Date(); const diff=Math.floor((today-d)/86400000); if(diff===0) return 'اليوم'; if(diff===1) return 'أمس'; return d.toLocaleDateString('ar-SA',{month:'short',day:'numeric'}); }

async function apiFetch(url,method='GET',body=null){
  const token=getToken();
  const opts={method,headers:{'Content-Type':'application/json','Authorization':'Bearer '+token}};
  if(body) opts.body=JSON.stringify(body);
  const r=await fetch(url,opts); return r.json();
}

// ── Init ──
(async function init(){
  const token=getToken();
  if(!token){ showNotLogged(); return; }
  try{
    const r=await fetch('/api/auth/me',{headers:{'Authorization':'Bearer '+token}});
    if(!r.ok){ showNotLogged(); return; }
    const u=await r.json();
    if(!u||u.error){ showNotLogged(); return; }
    ME=u;
  }catch(e){ showNotLogged(); return; }
  await loadSidebar();
  // فتح محادثة من URL مباشرة
  const with_=new URLSearchParams(location.search).get('with');
  if(with_) openChat(with_);
})();

function showNotLogged(){
  document.getElementById('chatMain').innerHTML=`<div class="not-logged">
    <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="#555" stroke-width="1.5"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
    <h2>يجب تسجيل الدخول</h2>
    <a href="/" class="btn-go">الرئيسية</a>
  </div>`;
  document.getElementById('sidebar').innerHTML='';
}

// ── Sidebar ──
async function loadSidebar(){
  try{
    [allUsers, conversations] = await Promise.all([
      apiFetch('/api/users'),
      apiFetch('/api/messages/conversations')
    ]);
  }catch(e){ allUsers=[]; conversations=[]; }
  renderSidebar();
}

function renderSidebar(){
  const list=document.getElementById('userList');
  const others=Array.isArray(allUsers)?allUsers.filter(u=>u.username!==ME?.username):[];
  const convMap={};
  if(Array.isArray(conversations)){
    conversations.forEach(c=>{
      const peer=c.from_id==ME?.id?c.to_name:c.from_name;
      convMap[peer]=c;
    });
  }
  const withConv=others.filter(u=>convMap[u.username]);
  const noConv=others.filter(u=>!convMap[u.username]);
  let html='';
  if(withConv.length){
    html+=`<div class="section-label">المحادثات الأخيرة</div>`;
    html+=withConv.map(u=>userItemHtml(u,convMap[u.username])).join('');
  }
  if(noConv.length){
    html+=`<div class="section-label">جميع الأعضاء</div>`;
    html+=noConv.map(u=>userItemHtml(u,null)).join('');
  }
  if(!others.length) html='<div style="text-align:center;padding:30px;color:var(--muted);font-size:0.83rem;">لا يوجد أعضاء آخرون</div>';
  list.innerHTML=html;
}

function userItemHtml(u,conv){
  const av=u.avatar?`<img src="${esc(u.avatar)}" alt="">`:(u.display_name||u.username).charAt(0).toUpperCase();
  const lastMsg=conv?(conv.from_id==ME?.id?'أنت: ':'')+esc(conv.content?.slice(0,30)||''):'ابدأ محادثة';
  const active=currentPeer===u.username?'active':'';
  const role=u.role==='admin'?`<span style="font-size:0.68rem;color:var(--red-h);font-weight:700;margin-right:4px;">Admin</span>`:'';
  return `<div class="user-item ${active}" onclick="openChat('${esc(u.username)}')">
    <div class="u-av">${av}</div>
    <div class="u-info">
      <div class="u-name">${role}${esc(u.display_name||u.username)}</div>
      <div class="u-last">${lastMsg}</div>
    </div>
  </div>`;
}

// ── Open Chat ──
async function openChat(username){
  currentPeer=username;
  if(window.innerWidth<=680) toggleSidebar(false);
  renderSidebar();
  const peer=allUsers.find(u=>u.username===username)||{username};
  const av=peer.avatar?`<img src="${esc(peer.avatar)}" alt="">`:(peer.display_name||peer.username||'?').charAt(0).toUpperCase();
  const role=peer.role==='admin'?'Admin':'Member';
  // تحديث topbar
  document.getElementById('topbarTitle').innerHTML=`
    <div class="topbar-peer">
      <div class="topbar-peer-av" onclick="window.location='/profile?u='+encodeURIComponent('${esc(username)}')" style="cursor:pointer;">${av}</div>
      <div>
        <div class="topbar-peer-name" onclick="window.location='/profile?u='+encodeURIComponent('${esc(username)}')" style="cursor:pointer;">${esc(peer.display_name||peer.username)}</div>
        <div class="topbar-peer-role">${role}</div>
      </div>
    </div>`;
  // بناء منطقة الرسائل
  document.getElementById('chatMain').innerHTML=`
    <div class="msgs-area" id="msgsArea"></div>
    <div id="chatImgBar" style="display:none;padding:6px 12px;background:rgba(10,10,10,0.8);border-top:1px solid var(--border);flex-shrink:0;display:none;align-items:center;gap:8px;">
      <img id="chatImgThumb" style="height:48px;border-radius:7px;object-fit:cover;">
      <button onclick="removeChatImg()" style="background:rgba(0,0,0,0.7);border:none;color:#fff;border-radius:50%;width:20px;height:20px;cursor:pointer;font-size:0.7rem;">✕</button>
    </div>
    <div class="input-area">
      <button class="btn-attach" onclick="document.getElementById('chatImgFile').click()" title="إرفاق صورة" style="width:38px;height:38px;background:rgba(255,255,255,0.05);border:1px solid var(--border);border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;color:#aaa;transition:0.18s;flex-shrink:0;">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
      </button>
      <input type="file" id="chatImgFile" accept=".jpg,.jpeg,image/jpeg" style="display:none;" onchange="onChatImg(event)">
      <textarea class="msg-input" id="msgInput" placeholder="اكتب رسالة..." rows="1" onkeydown="onKey(event)" oninput="autoResize(this)"></textarea>
      <button class="send-btn" id="sendBtn" onclick="sendMsg()">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
      </button>
    </div>`;
  await loadMsgs(username);
  if(pollTimer) clearInterval(pollTimer);
  pollTimer=setInterval(()=>loadMsgs(username,false),4000);
}

async function loadMsgs(username,scroll=true){
  try{
    const msgs=await apiFetch('/api/messages/'+encodeURIComponent(username));
    if(!Array.isArray(msgs)) return;
    renderMsgs(msgs,scroll);
    loadSidebar(); // تحديث آخر رسالة في السايدبار
  }catch(e){}
}

function renderMsgs(msgs,scroll=true){
  const area=document.getElementById('msgsArea');
  if(!area) return;
  if(!msgs.length){ area.innerHTML='<div style="text-align:center;color:var(--muted);padding:30px;font-size:0.85rem;">ابدأ المحادثة</div>'; return; }
  let html='';
  let lastDay='';
  msgs.forEach((m,i)=>{
    const isMine=m.from_id==ME?.id;
    const day=fmtDay(m.created_at);
    if(day!==lastDay){ html+=`<div class="date-divider"><span>${day}</span></div>`; lastDay=day; }
    const nextMsg=msgs[i+1];
    const isLast=!nextMsg||(nextMsg.from_id!=m.from_id);
    const av=m.from_avatar?`<img src="${esc(m.from_avatar)}" alt="">`:m.from_name.charAt(0).toUpperCase();
    const rc=msgReactions[m.id];
    const reactionBubble=rc&&rc.reactions.length
      ?`<div class="msg-reaction" onclick="toggleMsgReactPicker(${m.id},this)">${rc.reactions.map(r=>r.emoji_icon||r.emoji).join('')} <span style="font-size:0.72rem;color:var(--muted);">${rc.reactions.reduce((s,r)=>s+Number(r.count),0)}</span></div>`:'';
    html+=`<div class="msg-row ${isMine?'mine':'theirs'}">
      ${!isMine?`<div class="msg-av ${isLast?'':'invisible'}">${av}</div>`:''}
      <div class="bubble-wrap">
        <div class="bubble" id="bubble-${m.id}" onclick="toggleMsgReactPicker(${m.id},this)">
          ${m.image?`<img src="${m.image}" style="max-width:100%;border-radius:10px;display:block;margin-bottom:4px;max-height:180px;object-fit:cover;" loading="lazy" onerror="this.style.display='none'">`:''}${esc(m.content)}
          <div class="msg-react-picker" id="picker-${m.id}">
            ${EMOJIS.map(e=>`<button class="r-emoji ${rc?.userReaction===e?'active':''}" onclick="reactMsg(event,${m.id},'${e}')">${e}</button>`).join('')}
          </div>
        </div>
        ${reactionBubble}
        ${isLast?`<div class="msg-time">${fmtTime(m.created_at)}</div>`:''}
      </div>
      ${isMine?`<div class="msg-av ${isLast?'':'invisible'}">${av}</div>`:''}
    </div>`;
  });
  area.innerHTML=html;
  if(scroll) area.scrollTop=area.scrollHeight;
  // إغلاق picker عند الضغط خارجه
  setTimeout(()=>{
    document.addEventListener('click',e=>{
      if(!e.target.closest('.bubble')) document.querySelectorAll('.msg-react-picker.show').forEach(p=>p.classList.remove('show'));
    },{once:false});
  },100);
}

function toggleMsgReactPicker(id,el){
  const picker=document.getElementById('picker-'+id);
  if(!picker) return;
  document.querySelectorAll('.msg-react-picker.show').forEach(p=>{ if(p!==picker) p.classList.remove('show'); });
  picker.classList.toggle('show');
}

async function reactMsg(e,msgId,emoji){
  e.stopPropagation();
  document.querySelectorAll('.msg-react-picker.show').forEach(p=>p.classList.remove('show'));
  const d=await apiFetch('/api/messages/react/'+msgId,'POST',{emoji});
  if(d.success){
    msgReactions[msgId]={reactions:d.reactions,userReaction:d.userReaction};
    // تحديث الـ reaction bubble فقط بدون إعادة رسم كل شيء
    const bubble=document.getElementById('bubble-'+msgId);
    if(bubble){
      const existing=bubble.nextElementSibling;
      const rc=msgReactions[msgId];
      const total=rc.reactions.reduce((s,r)=>s+Number(r.count),0);
      if(existing&&existing.classList.contains('msg-reaction')){
        if(total>0) existing.innerHTML=`${rc.reactions.map(r=>r.emoji).join('')} <span style="font-size:0.72rem;color:var(--muted);">${total}</span>`;
        else existing.remove();
      } else if(total>0){
        const div=document.createElement('div');
        div.className='msg-reaction';
        div.onclick=()=>toggleMsgReactPicker(msgId,div);
        div.innerHTML=`${rc.reactions.map(r=>r.emoji).join('')} <span style="font-size:0.72rem;color:var(--muted);">${total}</span>`;
        bubble.after(div);
      }
    }
  }
}

let chatImgBase64='';
function onChatImg(e){
  const f=e.target.files[0]; if(!f) return;
  if(!f.type.match('image/jpeg')){ alert('JPG/JPEG فقط'); return; }
  const r=new FileReader(); r.onload=ev=>{ chatImgBase64=ev.target.result; document.getElementById('chatImgThumb').src=chatImgBase64; const bar=document.getElementById('chatImgBar'); bar.style.display='flex'; }; r.readAsDataURL(f); e.target.value='';
}
function removeChatImg(){ chatImgBase64=''; document.getElementById('chatImgBar').style.display='none'; }

async function sendMsg(){
  const input=document.getElementById('msgInput');
  const content=input?.value.trim()||'';
  if(!content&&!chatImgBase64) return;
  input.value=''; input.style.height='';
  document.getElementById('sendBtn').disabled=true;
  try{
    let imageUrl='';
    if(chatImgBase64){
      const up=await apiFetch('/api/upload','POST',{image:chatImgBase64});
      if(up.url) imageUrl=up.url;
      removeChatImg();
    }
    await apiFetch('/api/messages/'+encodeURIComponent(currentPeer),'POST',{content,image:imageUrl});
    await loadMsgs(currentPeer);
  }catch(e){}
  document.getElementById('sendBtn').disabled=false;
}

function onKey(e){
  if(e.key==='Enter'&&!e.shiftKey){ e.preventDefault(); sendMsg(); }
}
function autoResize(el){
  el.style.height='auto';
  el.style.height=Math.min(el.scrollHeight,120)+'px';
}

// ── Sidebar Toggle (Mobile) ──
function toggleSidebar(force){
  const sb=document.getElementById('sidebar');
  const ov=document.getElementById('sidebarOverlay');
  const isOpen=sb.classList.contains('open');
  const open=force!==undefined?force:!isOpen;
  sb.classList.toggle('open',open);
  ov.classList.toggle('show',open);
}
</script>

<div id="createGroupModal" style="position:fixed;inset:0;background:rgba(0,0,0,0.8);backdrop-filter:blur(10px);display:none;align-items:center;justify-content:center;z-index:200;padding:20px;">
  <div style="background:#111;border:1px solid #232325;border-radius:20px;padding:28px;width:100%;max-width:420px;max-height:85vh;overflow-y:auto;">

    <div style="margin-bottom:14px;">
      <label style="display:block;color:#888;font-size:0.82rem;margin-bottom:5px;">اسم المجموعة *</label>
      <input id="cgName" type="text" style="width:100%;padding:10px 12px;background:#1a1a1a;border:1px solid rgba(255,255,255,0.07);border-radius:9px;color:#fff;font-family:Cairo;font-size:0.88rem;" placeholder="اسم المجموعة">

    <div style="margin-bottom:14px;">
      <label style="display:block;color:#888;font-size:0.82rem;margin-bottom:8px;">إضافة أعضاء</label>
      <div id="memberSelect" style="display:flex;flex-direction:column;gap:6px;max-height:200px;overflow-y:auto;"></div>
    </div>
    <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:16px;">
      <button onclick="document.getElementById('createGroupModal').style.display='none'" style="padding:9px 16px;background:rgba(255,255,255,0.05);border:1px solid #232325;border-radius:8px;color:#ccc;cursor:pointer;font-family:Cairo;">إلغاء</button>
      <button onclick="createGroup()" style="padding:9px 16px;background:#fff;border:none;border-radius:8px;color:#000;font-weight:800;cursor:pointer;font-family:Cairo;">إنشاء</button>
    </div>
  </div>
</div>

<script>
// ── Groups ──
async function openCreateGroup(){
  document.getElementById('createGroupModal').style.display='flex';
  const users=await api('/api/users');
  const others=Array.isArray(users)?users.filter(u=>u.username!==ME?.username):[];
  document.getElementById('memberSelect').innerHTML=others.map(u=>`
    <label style="display:flex;align-items:center;gap:9px;padding:7px 10px;background:rgba(255,255,255,0.03);border-radius:8px;cursor:pointer;">
      <input type="checkbox" value="${u.id}" style="accent-color:#c0392b;">
      <div style="width:28px;height:28px;border-radius:50%;background:linear-gradient(145deg,#c0392b,#8e2a1f);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:0.78rem;color:#fff;overflow:hidden;flex-shrink:0;">
        ${u.avatar?`<img src="${u.avatar}" style="width:100%;height:100%;object-fit:cover;">`:((u.display_name||u.username||'?').charAt(0).toUpperCase())}
      </div>
      <span style="font-size:0.84rem;color:#ddd;">${u.display_name||u.username}</span>
    </label>`).join('');
}

async function createGroup(){
  const name=document.getElementById('cgName').value.trim();
  if(!name){ alert('اسم المجموعة مطلوب'); return; }
  const checked=[...document.querySelectorAll('#memberSelect input:checked')].map(i=>Number(i.value));
  const d=await api('/api/groups','POST',{name,members:checked});
  if(d.success||d.id){
    document.getElementById('createGroupModal').style.display='none';
    window.location='/group?g='+d.id;
  }
}

// إضافة الجروبات في السايدبار
const _origRenderSidebar=renderSidebar;
async function renderSidebar(){
  _origRenderSidebar();
  try{
    const groups=await api('/api/groups');
    if(!Array.isArray(groups)||!groups.length) return;
    const list=document.getElementById('userList');
    if(!list) return;
    const groupsHtml=`<div style="padding:8px 16px 4px;font-size:0.72rem;color:#6b6b6b;font-weight:700;text-transform:uppercase;letter-spacing:0.05em;">المجموعات</div>`+
      groups.map(g=>{
        const av=g.avatar?`<img src="${g.avatar}" style="width:100%;height:100%;object-fit:cover;">`:(g.name||'?').charAt(0).toUpperCase();
        return `<div class="user-item" onclick="window.location='/group?g='+${g.id}" style="cursor:pointer;">
          <div class="u-av">${av}</div>
          <div class="u-info">
            <div class="u-name" style="display:flex;align-items:center;gap:5px;">
              <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
              ${g.name}
            </div>
            <div class="u-last">${g.my_role==='admin'?'مدير ':''}مجموعة</div>
          </div>
        </div>`;
      }).join('');
    list.innerHTML=groupsHtml+list.innerHTML;
  }catch(e){}
}
</script>
