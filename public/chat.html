<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>Malines Hostaka - ChatBot Economy</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            background: #0d0d0d;
            color: #d0d0d0;
            font-family: 'Cairo', sans-serif;
            margin: 0;
            padding: 20px;
        }
        .chat-container {
            max-width: 800px;
            margin: 0 auto;
        }
        h1 {
            color: #b8860b;
            text-align: center;
            border-bottom: 1px solid #333;
            padding-bottom: 10px;
        }
        .messages {
            height: 500px;
            overflow-y: auto;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 15px;
            background: #111;
            margin-bottom: 15px;
        }
        .msg {
            margin-bottom: 15px;
            padding: 10px;
            border-radius: 8px;
            max-width: 80%;
            word-wrap: break-word;
        }
        .user {
            background: #1a1a1a;
            margin-right: auto;
            text-align: right;
        }
        .assistant {
            background: #222;
            border-right: 3px solid #b8860b;
            margin-left: auto;
            text-align: left;
        }
        .input-area {
            display: flex;
            gap: 10px;
        }
        input {
            flex: 1;
            padding: 12px;
            background: #1a1a1a;
            border: 1px solid #333;
            color: white;
            border-radius: 8px;
            font-family: 'Cairo', sans-serif;
        }
        button {
            padding: 12px 25px;
            background: #b8860b;
            border: none;
            color: black;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
        }
        .loading {
            color: #666;
            font-style: italic;
            padding: 10px;
        }
    </style>
</head>
<body>
    <div class="chat-container">
        <h1>🧮 Malines Hostaka - المستشار الاقتصادي</h1>
        <div class="messages" id="messages"></div>
        <div class="input-area">
            <input type="text" id="userInput" placeholder="اسأل عن دخل شركات اللعبة..." 
                   onkeypress="if(event.key==='Enter') send()">
            <button onclick="send()">إرسال</button>
        </div>
    </div>

    <script>
        const messagesDiv = document.getElementById('messages');
        const userInput = document.getElementById('userInput');
        let conversation = [];

        function addMessage(role, text) {
            const div = document.createElement('div');
            div.className = `msg ${role}`;
            div.textContent = text;
            messagesDiv.appendChild(div);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }

        async function send() {
            const text = userInput.value.trim();
            if (!text) return;
            addMessage('user', text);
            userInput.value = '';
            conversation.push({ role: 'user', content: text });

            // عرض مؤشر تحميل
            const loadingDiv = document.createElement('div');
            loadingDiv.className = 'loading';
            loadingDiv.textContent = '...يكتب';
            messagesDiv.appendChild(loadingDiv);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;

            try {
                const response = await fetch('/api/deepseek', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ messages: conversation })
                });
                const data = await response.json();
                messagesDiv.removeChild(loadingDiv);

                if (data.choices && data.choices.length > 0) {
                    const reply = data.choices[0].message.content;
                    addMessage('assistant', reply);
                    conversation.push({ role: 'assistant', content: reply });
                } else {
                    addMessage('assistant', 'لم أحصل على رد.');
                }
            } catch (error) {
                messagesDiv.removeChild(loadingDiv);
                addMessage('assistant', 'خطأ في الاتصال بالخادم.');
            }
        }
    </script>
</body>
</html>
