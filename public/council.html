<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سجلات الدول | مجتمع مالينز</title>

    <script>window.va=window.va||function(){(window.vaq=window.vaq||[]).push(arguments);};</script>
    <script defer src="/_vercel/insights/script.js"></script>
    <script>window.si=window.si||function(){(window.siq=window.siq||[]).push(arguments);};</script>
    <script defer src="/_vercel/speed-insights/script.js"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800;900&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        malines: { black:'#050505', dark:'#0a0a0a', card:'#0f0f10', border:'#232325', text:'#e9e9e9', muted:'#8d8d8d', red:'#c0392b', 'red-hover':'#e74c3c', accent:'#d4af37' }
                    },
                    fontFamily: { cairo:['Cairo','sans-serif'], amiri:['Amiri','serif'] }
                }
            }
        }
    </script>
    <style>
        :root {
            --black: #050505; --dark: #0a0a0a; --card: #0f0f10; --border: #232325;
            --text: #e9e9e9; --muted: #8d8d8d; --red: #c0392b; --red-hover: #e74c3c; --accent: #d4af37;
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        html { scroll-behavior: smooth; }
        body {
            background: radial-gradient(circle at 18% 16%, rgba(192,57,43,0.10), transparent 22%),
                        radial-gradient(circle at 82% 14%, rgba(212,175,55,0.06), transparent 18%),
                        radial-gradient(circle at 50% 84%, rgba(255,255,255,0.03), transparent 24%),
                        var(--black);
            color: var(--text);
            font-family: 'Cairo', sans-serif;
            overflow-x: hidden;
        }
        .stars {
            position: fixed; inset: 0; pointer-events: none; z-index: 0; opacity: 0.7;
            background: radial-gradient(1px 1px at 12% 18%, rgba(255,255,255,0.12), transparent),
                        radial-gradient(1px 1px at 78% 28%, rgba(255,255,255,0.08), transparent),
                        radial-gradient(1.5px 1.5px at 42% 72%, rgba(255,255,255,0.10), transparent),
                        radial-gradient(1px 1px at 70% 10%, rgba(255,255,255,0.07), transparent),
                        radial-gradient(1px 1px at 25% 85%, rgba(255,255,255,0.06), transparent);
            animation: starsMove 38s linear infinite;
        }
        @keyframes starsMove { from{ transform:translateY(0); } to{ transform:translateY(-30px); } }
        .topbar {
            position: fixed; top:0; left:0; right:0; height:68px;
            background: rgba(5,5,5,0.58); backdrop-filter: blur(28px);
            border-bottom:1px solid rgba(255,255,255,0.04);
            display:flex; align-items:center; justify-content:space-between; padding:0 32px; z-index:100;
        }
        .topbar-left { display:flex; align-items:center; gap:12px; }
        .topbar-logo { width:36px; height:36px; border-radius:50%; object-fit:cover; }
        .topbar-title { font-weight:800; font-size:1.1rem; background:linear-gradient(135deg,#fff,#cfcfcf); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
        .btn-login {
            display:flex; align-items:center; gap:8px; background:rgba(255,255,255,0.03);
            border:1px solid rgba(255,255,255,0.14); color:#d7d7d7; padding:9px 20px;
            border-radius:999px; cursor:pointer; transition:0.25s;
        }
        .btn-login:hover { border-color:rgba(255,255,255,0.3); color:#fff; background:rgba(255,255,255,0.06); transform:translateY(-1px); }
        .user-badge {
            width:42px; height:42px; border-radius:50%; background:linear-gradient(135deg,#fff,#e6e6e6);
            color:#000; font-weight:800; display:flex; align-items:center; justify-content:center;
            cursor:pointer; position:relative;
        }
        .user-dropdown {
            position:absolute; top:52px; left:0; background:rgba(10,10,10,0.96); backdrop-filter:blur(20px);
            border:1px solid var(--border); border-radius:14px; padding:8px 0; min-width:180px;
            opacity:0; visibility:hidden; transform:translateY(-8px); transition:0.25s; z-index:10;
        }
        .user-dropdown.show { opacity:1; visibility:visible; transform:translateY(0); }
        .user-dropdown button { width:100%; text-align:right; padding:10px 16px; background:none; border:none; color:#ccc; cursor:pointer; }
        .user-dropdown button:hover { background:rgba(255,255,255,0.04); }
        .council-header {
            position:relative; padding:120px 24px 60px; text-align:center; z-index:2;
        }
        .council-header h1 {
            font-size:clamp(2rem,5vw,3.2rem); font-weight:900;
            background:linear-gradient(to bottom,#fff,#b6b6b6); -webkit-background-clip:text; -webkit-text-fill-color:transparent;
        }
        .council-header p { color:var(--muted); margin-top:12px; }
        .countries-grid {
            max-width:1300px; margin:0 auto 60px; padding:0 24px;
            display:grid; grid-template-columns:repeat(auto-fill, minmax(260px,1fr)); gap:24px;
        }
        .country-card {
            background:linear-gradient(180deg, rgba(255,255,255,0.03), rgba(255,255,255,0.012));
            border:1px solid var(--border); border-radius:20px; padding:24px 20px;
            text-align:center; cursor:pointer; transition:0.25s;
        }
        .country-card:hover { transform:translateY(-4px); border-color:rgba(255,255,255,0.2); background:rgba(255,255,255,0.02); }
        .country-name { font-size:1.3rem; font-weight:800; margin-bottom:8px; }
        .country-desc { color:var(--muted); font-size:0.85rem; display:flex; align-items:center; justify-content:center; gap:6px; }
        .modal-corssd {
            position:fixed; inset:0; background:rgba(0,0,0,0.9); backdrop-filter:blur(12px);
            display:flex; align-items:center; justify-content:center; z-index:300;
            opacity:0; visibility:hidden; transition:0.3s; padding:20px;
        }
        .modal-corssd.active { opacity:1; visibility:visible; }
        .modal-corssd-box {
            background:linear-gradient(180deg,#121213,#0d0d0e); border:1px solid var(--border);
            border-radius:28px; padding:32px; max-width:500px; width:100%; text-align:center;
        }
        .modal-corssd-box h3 { margin-bottom:20px; font-size:1.5rem; }
        .modal-corssd-box input {
            width:100%; padding:14px; background:#1a1a1a; border:1px solid var(--border);
            border-radius:14px; color:#fff; direction:ltr; text-align:left; margin-bottom:20px;
        }
        .modal-corssd-box button {
            background:var(--red); border:none; padding:12px 24px; border-radius:40px;
            color:#fff; font-weight:bold; cursor:pointer; margin:0 8px;
        }
        .modal-corssd-box .cancel-btn { background:#333; }
        .error-msg { color:var(--red-hover); margin-top:12px; display:none; }
        .record-view {
            max-width:1100px; margin:0 auto 80px; padding:0 24px;
            display:none;
        }
        .record-card {
            background:rgba(15,15,16,0.8); border:1px solid var(--border); border-radius:32px;
            overflow:hidden; backdrop-filter:blur(8px);
        }
        .record-header {
            padding:24px 28px; border-bottom:1px solid var(--border);
            display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap;
        }
        .record-country { font-size:1.8rem; font-weight:800; }
        .close-record { background:none; border:none; color:#aaa; cursor:pointer; font-size:1.2rem; display:flex; align-items:center; gap:6px; }
        .record-content {
            padding:28px; font-family:'Amiri', serif; line-height:1.8;
            overflow-x:auto;
        }
        .record-content table { width:100%; border-collapse:collapse; margin:16px 0; background:#111; }
        .record-content th, .record-content td { border:1px solid #333; padding:10px; text-align:right; }
        .record-content th { background:#1a1a1a; }
        .record-content code { background:#1a1a1a; padding:2px 6px; border-radius:6px; }
        .loading-spinner { text-align:center; padding:40px; color:var(--muted); grid-column:1/-1; }
        .footer { text-align:center; padding:30px; color:#444; border-top:1px solid rgba(255,255,255,0.03); }
        @media (max-width:640px) {
            .topbar { padding:0 16px; }
            .countries-grid { grid-template-columns:1fr; }
            .record-header { flex-direction:column; align-items:flex-start; gap:12px; }
        }
        .modal-backdrop {
            position:fixed; inset:0; background:rgba(0,0,0,0.84); backdrop-filter:blur(12px);
            display:flex; align-items:center; justify-content:center; z-index:200;
            opacity:0; visibility:hidden; transition:0.3s; padding:20px;
        }
        .modal-backdrop.active { opacity:1; visibility:visible; }
        .modal-box {
            background:linear-gradient(180deg,#121213,#0d0d0e); border:1px solid rgba(255,255,255,0.08);
            border-radius:24px; padding:36px 30px; max-width:420px; width:100%; text-align:right;
            transform:translateY(10px); transition:transform 0.3s;
        }
        .modal-backdrop.active .modal-box { transform:translateY(0); }
        .modal-close { position:absolute; top:16px; left:16px; background:none; border:none; color:#888; cursor:pointer; }
        .form-group input { width:100%; padding:14px; background:#1a1a1a; border:1px solid var(--border); border-radius:12px; color:#fff; }
        .btn-submit { width:100%; padding:14px; background:#fff; color:#000; font-weight:bold; border:none; border-radius:12px; cursor:pointer; }
        .form-error { background:rgba(192,57,43,0.1); padding:10px; border-radius:8px; margin-bottom:16px; text-align:center; display:none; }
        .spinner { width:40px; height:40px; border:3px solid #2a2a2a; border-top-color:var(--red); border-radius:50%; animation:spin 1s linear infinite; margin:0 auto 16px; }
        @keyframes spin { to { transform:rotate(360deg); } }
    </style>
</head>
<body>
<div class="stars"></div>

<header class="topbar">
    <div class="topbar-left">
        <img src="malines-icon.png" alt="Malines" class="topbar-logo" onerror="this.style.display='none'">
        <span class="topbar-title">مجتمع مالينز - سجلات الدول</span>
    </div>
    <div class="topbar-right">
        <button id="btnLogin" class="btn-login" onclick="openModal()">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4M10 17l5-5-5-5M13.8 12H3"/></svg>
            <span>تسجيل الدخول</span>
        </button>
        <div id="userBadge" class="user-badge" style="display: none;" onclick="toggleDropdown()">
            <span id="userInitial"></span>
            <div id="userDropdown" class="user-dropdown">
                <div class="dropdown-name" id="dropdownUsername"></div>
                <button onclick="handleLogout()">تسجيل الخروج</button>
            </div>
        </div>
    </div>
</header>

<section class="council-header">
    <h1>سجلات الدول</h1>
    <p>اختر دولة، أدخل رمز الوصول للاطلاع على سجلها الداخلي.</p>
</section>

<div id="countriesContainer" class="countries-grid">
    <div class="loading-spinner"><div class="spinner"></div> جاري تحميل قائمة الدول...</div>
</div>

<div id="corssdModal" class="modal-corssd">
    <div class="modal-corssd-box">
        <h3>رمز الوصول</h3>
        <input type="text" id="corssdCode" placeholder="أدخل الرمز" dir="ltr">
        <div id="corssdError" class="error-msg"></div>
        <button id="submitCorssd">تحقق</button>
        <button id="cancelCorssd" class="cancel-btn">إلغاء</button>
    </div>
</div>

<div id="recordView" class="record-view">
    <div class="record-card">
        <div class="record-header">
            <span class="record-country" id="recordCountryName"></span>
            <button id="closeRecordBtn" class="close-record">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg>
                إغلاق
            </button>
        </div>
        <div id="recordContent" class="record-content"></div>
    </div>
</div>

<footer class="footer">
    مجتمع مالينز &copy; 2026 · جميع الحقوق محفوظة
</footer>

<div id="loginModal" class="modal-backdrop">
    <div class="modal-box">
        <button class="modal-close" onclick="closeModal()">✕</button>
        <h2>تسجيل الدخول</h2>
        <div class="form-group"><label>البريد الإلكتروني</label><input type="email" id="emailInput" dir="ltr"></div>
        <div class="form-group"><label>كلمة المرور</label><input type="password" id="passInput"></div>
        <div id="loginError" class="form-error"></div>
        <button id="btnSubmit" class="btn-submit" onclick="doLogin()">دخول</button>
    </div>
</div>

<script>
    // -------------------- نظام المصادقة (مطابق) --------------------
    const STORAGE_KEY='malines_user'; let dropdownVisible=false;
    const btnLogin=document.getElementById('btnLogin'), userBadge=document.getElementById('userBadge'), userInitial=document.getElementById('userInitial');
    const userDropdown=document.getElementById('userDropdown'), dropdownUsername=document.getElementById('dropdownUsername');
    const loginModal=document.getElementById('loginModal'), loginError=document.getElementById('loginError');
    function openModal(){ loginModal.classList.add('active'); }
    function closeModal(){ loginModal.classList.remove('active'); }
    loginModal.addEventListener('click',e=>{ if(e.target===loginModal) closeModal(); });
    document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeModal(); });
    async function doLogin(){
        const email=document.getElementById('emailInput').value.trim(), password=document.getElementById('passInput').value;
        loginError.style.display='none';
        if(!email||!password){ showError('يرجى تعبئة الحقول'); return; }
        document.getElementById('btnSubmit').disabled=true;
        try{
            const res=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email,password})});
            const data=await res.json();
            if(res.ok && data.success){ setLoggedInUser(data.username); closeModal(); }
            else showError(data.error||'فشل تسجيل الدخول');
        }catch(e){ showError('تعذر الاتصال بالخادم'); }
        finally{ document.getElementById('btnSubmit').disabled=false; }
    }
    function showError(msg){ loginError.textContent=msg; loginError.style.display='block'; }
    function setLoggedInUser(username){ localStorage.setItem(STORAGE_KEY,JSON.stringify({username})); updateUI(username); }
    function updateUI(username){ btnLogin.style.display='none'; userBadge.style.display='flex'; userInitial.textContent=username.charAt(0).toUpperCase(); dropdownUsername.textContent=username; }
    function clearUser(){ localStorage.removeItem(STORAGE_KEY); btnLogin.style.display='flex'; userBadge.style.display='none'; userDropdown.classList.remove('show'); }
    function handleLogout(){ clearUser(); }
    function toggleDropdown(){ dropdownVisible=!dropdownVisible; userDropdown.classList.toggle('show',dropdownVisible); }
    document.addEventListener('click',e=>{ if(!userBadge.contains(e.target)){ userDropdown.classList.remove('show'); dropdownVisible=false; } });
    (function init(){ const stored=localStorage.getItem(STORAGE_KEY); if(stored){ try{ const user=JSON.parse(stored); if(user.username) updateUI(user.username); }catch(e){ clearUser(); } } })();

    // -------------------- قائمة الدول الثابتة (عدلها كما تشاء) --------------------
    const COUNTRIES_LIST = [
        "Japanese Empire",
        "United States",
        "France",
        "Germany",
        "United Kingdom"
    ];

    const countriesContainer = document.getElementById('countriesContainer');
    const corssdModal = document.getElementById('corssdModal');
    const codeInput = document.getElementById('corssdCode');
    const errorDiv = document.getElementById('corssdError');
    const submitBtn = document.getElementById('submitCorssd');
    const cancelBtn = document.getElementById('cancelCorssd');
    const recordView = document.getElementById('recordView');
    const recordCountryNameSpan = document.getElementById('recordCountryName');
    const recordContentDiv = document.getElementById('recordContent');
    const closeRecordBtn = document.getElementById('closeRecordBtn');

    let currentCountry = null;

    // دالة للتحقق من أن الاستجابة ليست HTML (لحماية إضافية)
    function isHtmlResponse(text) {
        const trimmed = text.trim();
        return trimmed.startsWith('<!DOCTYPE') || trimmed.startsWith('<html') || 
               trimmed.startsWith('<head') || (trimmed.includes('<body') && trimmed.includes('</body>'));
    }

    function loadCountries() {
        // استخدام القائمة الثابتة
        if (COUNTRIES_LIST.length === 0) {
            countriesContainer.innerHTML = '<div class="loading-spinner">لا توجد دول متاحة حالياً.</div>';
            return;
        }
        renderCountries(COUNTRIES_LIST);
    }

    function renderCountries(countries) {
        countriesContainer.innerHTML = '';
        countries.forEach(country => {
            const card = document.createElement('div');
            card.className = 'country-card';
            card.innerHTML = `
                <div class="country-name">${escapeHtml(country)}</div>
                <div class="country-desc">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
                    تصفح السجل
                </div>
            `;
            card.addEventListener('click', () => openCorssdModal(country));
            countriesContainer.appendChild(card);
        });
    }

    function openCorssdModal(country) {
        currentCountry = country;
        codeInput.value = '';
        errorDiv.style.display = 'none';
        corssdModal.classList.add('active');
        codeInput.focus();
    }

    function closeCorssdModal() {
        corssdModal.classList.remove('active');
        currentCountry = null;
    }

    async function verifyCorssd() {
        const code = codeInput.value.trim();
        if (!code) {
            errorDiv.textContent = 'الرجاء إدخال الرمز';
            errorDiv.style.display = 'block';
            return;
        }
        if (!currentCountry) return;

        const countryFileName = currentCountry + '.txt';
        try {
            const response = await fetch(`/NBN/CORSSD/${encodeURIComponent(countryFileName)}`);
            if (!response.ok) {
                errorDiv.textContent = 'هذه الدولة غير مسجلة في نظام الرموز.';
                errorDiv.style.display = 'block';
                return;
            }
            const text = await response.text();
            if (isHtmlResponse(text)) {
                errorDiv.textContent = 'خطأ: الخادم أعاد HTML بدلاً من رمز CORSSD. تأكد من وجود الملف الصحيح.';
                errorDiv.style.display = 'block';
                return;
            }
            const correctCode = text.trim();
            if (correctCode === code) {
                closeCorssdModal();
                await loadCountryRecord(currentCountry);
            } else {
                errorDiv.textContent = 'الرمز غير صحيح.';
                errorDiv.style.display = 'block';
            }
        } catch (err) {
            errorDiv.textContent = 'حدث خطأ في التحقق من الرمز';
            errorDiv.style.display = 'block';
            console.error(err);
        }
    }

    async function loadCountryRecord(country) {
        const filePath = `/NBN/NB/${encodeURIComponent(country + '.txt')}`;
        try {
            const response = await fetch(filePath);
            if (!response.ok) throw new Error('ملف السجل غير موجود (HTTP ' + response.status + ')');
            const markdownText = await response.text();
            if (isHtmlResponse(markdownText)) {
                alert('خطأ: الخادم أعاد HTML بدلاً من محتوى السجل. تأكد من وجود الملف الصحيح.');
                return;
            }
            const htmlContent = marked.parse(markdownText);
            recordCountryNameSpan.textContent = country;
            recordContentDiv.innerHTML = htmlContent;
            recordView.style.display = 'block';
            recordView.scrollIntoView({ behavior: 'smooth', block: 'start' });
        } catch (err) {
            alert('تعذر تحميل سجل الدولة: ' + err.message);
        }
    }

    function closeRecord() {
        recordView.style.display = 'none';
        recordContentDiv.innerHTML = '';
    }

    function escapeHtml(str) {
        return str.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }

    submitBtn.addEventListener('click', verifyCorssd);
    cancelBtn.addEventListener('click', closeCorssdModal);
    closeRecordBtn.addEventListener('click', closeRecord);
    corssdModal.addEventListener('click', (e) => {
        if (e.target === corssdModal) closeCorssdModal();
    });

    loadCountries();
</script>
</body>
</html>
